                  </div>
                  <div style={{ flexShrink: 0, textAlign: "right" }}>
                    <span style={{ fontSize: ".62rem", fontWeight: 800, color: IMPORT_STATUS_COLOR[row.status], textTransform: "uppercase", letterSpacing: ".06em" }}>{row.status === "ok" ? "OK" : IMPORT_STATUS_LABEL[row.status].split(" / ")[0]}</span>
                  </div>
                </div>
              );
            })}

            {processedRows.length === 0 && (
              <div className="empty">No usable rows found in this file. / Δεν βρέθηκαν χρησιμοποιήσιμες γραμμές.</div>
            )}

            <button className="btn" style={{ marginTop: 8 }} disabled={willImport === 0 || importing} onClick={doImport}>
              {importing ? "Importing… / Εισαγωγή…" : ("Import " + willImport + " Students / Εισαγωγή " + willImport + " Μαθητών")}
            </button>
            {importResult && !importResult.ok && (
              <div className="err" style={{ marginTop: 12 }}>
                Import failed — nothing was imported, your file is unchanged. / Η εισαγωγή απέτυχε — δεν έγινε καμία αλλαγή.
                <div style={{ marginTop: 4, fontWeight: 600 }}>{importResult.error}</div>
              </div>
            )}
          </>
        )}

        {step === "done" && (
          <div className="wsec" style={{ margin: 0, textAlign: "center" }}>
            <div style={{ fontSize: "2.2rem", marginBottom: 8 }}>✅</div>
            <div style={{ fontSize: "1.1rem", fontWeight: 900, marginBottom: 6 }}>{importedCount + " Students Imported"}</div>
            <div style={{ fontSize: ".78rem", color: "var(--text2)", fontWeight: 600, lineHeight: 1.6, marginBottom: 20 }}>
              {importedCount + " μαθητές εισήχθησαν επιτυχώς. Each student got a share code and PIN, visible on their card. / Κάθε μαθητής απέκτησε κωδικό και PIN, ορατά στην κάρτα του."}
            </div>
            <button className="btn" onClick={onBack}>Done / Τέλος</button>
            <button className="btn-ghost" onClick={reset}>Import More / Εισαγωγή Περισσότερων</button>
          </div>
        )}
      </div>
    </div>
  );
}
function PgManage({ biz, onBack, onSaveTeacher, onDeleteTeacher, onSaveGroup, onDeleteGroup }) {
  const p = bizPal(biz);
  const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const ABBR = {Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thu",Friday:"Fri",Saturday:"Sat",Sunday:"Sun"};
  const teachers = biz.teachers || [];
  const groups = biz.groups || [];
  const cards = Object.values(biz.cards || {});
  const [tName, setTName] = useState("");
  const [tEdit, setTEdit] = useState(null);   // {id,name} inline teacher edit
  const [gEdit, setGEdit] = useState(null);   // {id?, name, schedule, teacher_id} group form
  const [del, setDel] = useState(null);       // {kind, id, name, warn}
  const [busy, setBusy] = useState(false);
  const teacherName = (id)=>{ const t=teachers.find(x=>x.id===id); return t?t.name:null; };
  const schedSummary = (sch)=> (sch&&sch.length) ? sch.map(s=>(ABBR[s.day]||s.day)+" "+(s.start_time||"")+(s.end_time?("–"+s.end_time):"")).join(", ") : "No schedule set";

  async function addTeacher(){ if(!tName.trim()) return; setBusy(true); const ok=await onSaveTeacher({name:tName}); setBusy(false); if(ok) setTName(""); }
  async function saveTeacherEdit(){ setBusy(true); const ok=await onSaveTeacher(tEdit); setBusy(false); if(ok) setTEdit(null); }
  async function saveGroup(){ setBusy(true); const ok=await onSaveGroup(gEdit); setBusy(false); if(ok) setGEdit(null); }
  async function confirmDelete(){ setBusy(true); const ok = del.kind==="teacher" ? await onDeleteTeacher(del.id) : await onDeleteGroup(del.id); setBusy(false); if(ok) setDel(null); }

  function askDeleteTeacher(t){ const n=groups.filter(g=>g.teacher_id===t.id).length; setDel({kind:"teacher",id:t.id,name:t.name,warn:n>0?("Assigned to "+n+" group"+(n>1?"s":"")+" — they will show no teacher."):null}); }
  function askDeleteGroup(g){ const n=cards.filter(c=>c.groupId===g.id).length; setDel({kind:"group",id:g.id,name:g.name,warn:n>0?(n+" student"+(n>1?"s":"")+" will become unassigned."):null}); }

  const setSch = (fn)=> setGEdit(g=>({ ...g, schedule: fn(g.schedule||[]) }));
  const lbl = {fontSize:".68rem",fontWeight:800,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".1em",margin:"14px 0 6px"};
  // Section labels, cards and buttons come from the shared .scr skin now rather
  // than from style objects local to this screen — that is what stops the same
  // control looking different depending on which screen you reached it from.
  // Row actions stay content-sized: .btn-ghost / .btn-add are width:100% form
  // buttons, which is what once stretched Edit across the row and crushed the
  // name beside it.

  // ---- Group create/edit form ----
  if (gEdit) {
    return (
      <div className="page scr" style={{"--accent":p.acc}}>
        <div className="topbar">
          <button className="tb-back" onClick={()=>setGEdit(null)}>←</button>
          <h2>{gEdit.id ? "Edit Group" : "New Group"}</h2>
          <div style={{width:24}} />
        </div>
        <div className="section">
          <div className="scr-lbl" style={{marginTop:16}}>Group name</div>
          <input className="inp" placeholder="e.g. Τρ/Παρ 15:15" value={gEdit.name} onChange={e=>setGEdit(g=>({...g,name:e.target.value}))} autoFocus />
          <div className="scr-lbl" style={{marginTop:16}}>Teacher</div>
          <select className="inp" value={gEdit.teacher_id||""} onChange={e=>setGEdit(g=>({...g,teacher_id:e.target.value}))}>
            <option value="">— No teacher —</option>
            {teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
          {teachers.length===0 && <div style={{fontSize:".72rem",color:"var(--text3)",fontWeight:600,marginTop:6}}>Add a teacher below first to assign one.</div>}
          <div className="scr-lbl" style={{marginTop:16}}>Schedule</div>
          {(gEdit.schedule||[]).map((row,i)=>(
            <div key={i} style={{marginBottom:10,padding:"10px",background:"var(--bg2)",borderRadius:12,border:"1px solid var(--border)"}}>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <select className="inp" style={{flex:1,marginBottom:0}} value={row.day} onChange={e=>setSch(s=>s.map((r,j)=>j===i?{...r,day:e.target.value}:r))}>{DAYS.map(d=><option key={d} value={d}>{d}</option>)}</select>
                <button type="button" onClick={()=>setSch(s=>s.filter((_,j)=>j!==i))} aria-label="Remove" style={{background:"transparent",border:"1px solid var(--border)",borderRadius:10,minWidth:44,height:48,color:"var(--red)",fontWeight:800,fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>×</button>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center",marginTop:6}}>
                <input className="inp" style={{flex:1,marginBottom:0}} type="time" value={row.start_time||""} onChange={e=>setSch(s=>s.map((r,j)=>j===i?{...r,start_time:e.target.value}:r))} />
                <span style={{color:"var(--text2)",fontWeight:700}}>–</span>
                <input className="inp" style={{flex:1,marginBottom:0}} type="time" value={row.end_time||""} onChange={e=>setSch(s=>s.map((r,j)=>j===i?{...r,end_time:e.target.value}:r))} />
              </div>
            </div>
          ))}
          {(gEdit.schedule||[]).length<7 && <button type="button" onClick={()=>setSch(s=>[...s,{day:"Monday",start_time:"17:00",end_time:"18:00"}])} className="scr-btn wide">+ Add day</button>}
          <button className="scr-btn primary wide" style={{marginTop:14}} onClick={saveGroup} disabled={busy}>{busy?"…":(gEdit.id?"Save Group":"Create Group")}</button>
        </div>
      </div>
    );
  }

  // ---- Lists ----
  return (
    <div className="page scr" style={{"--accent":p.acc}}>
      <div className="topbar">
        <button className="tb-back" onClick={onBack}>←</button>
        <h2>Manage</h2>
        <div style={{width:24}} />
      </div>

      <div className="section">
        <div className="scr-lbl">Teachers</div>
        {teachers.length===0 && <div className="scr-empty">No teachers yet.</div>}
        {teachers.map(t=>(
          <div key={t.id} className="scr-card">
            {tEdit && tEdit.id===t.id ? (
              <>
                <input className="inp" style={{width:"100%",marginBottom:0}} value={tEdit.name} onChange={e=>setTEdit({...tEdit,name:e.target.value})} autoFocus />
                <div className="scr-acts">
                  <button className="scr-btn primary" onClick={saveTeacherEdit} disabled={busy}>Save</button>
                  <button className="scr-btn" onClick={()=>setTEdit(null)}>Cancel</button>
                </div>
              </>
            ) : (
              <>
                <div className="scr-card-t">{t.name}</div>
                <div className="scr-acts">
                  <button className="scr-btn" onClick={()=>setTEdit({id:t.id,name:t.name})}>Edit</button>
                  <button className="scr-btn danger" onClick={()=>askDeleteTeacher(t)}>Delete</button>
                </div>
              </>
            )}
          </div>
        ))}
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <input className="inp" style={{flex:1,marginBottom:0}} placeholder="New teacher name" value={tName} onChange={e=>setTName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTeacher()} />
          <button className="scr-btn primary tall" onClick={addTeacher} disabled={busy||!tName.trim()}>Add</button>
        </div>
      </div>

      <div className="section">
        <div className="scr-lbl">Groups</div>
        {groups.length===0 && <div className="scr-empty">No groups yet.</div>}
        {groups.map(g=>(
          <div key={g.id} className="scr-card">
            <div>
              <div className="scr-card-t">{g.name}</div>
              <div className="scr-card-s">{teacherName(g.teacher_id) ? ("👤 "+teacherName(g.teacher_id)) : "No teacher"} · {schedSummary(g.schedule)}</div>
              <div className="scr-acts">
                <button className="scr-btn" onClick={()=>setGEdit({id:g.id,name:g.name,schedule:(g.schedule||[]).map(s=>({day:s.day,start_time:s.start_time||s.time||"",end_time:s.end_time||""})),teacher_id:g.teacher_id||""})}>Edit</button>
                <button className="scr-btn danger" onClick={()=>askDeleteGroup(g)}>Delete</button>
              </div>
            </div>
          </div>
        ))}
        <button className="scr-btn primary wide" style={{marginTop:10}} onClick={()=>setGEdit({name:"",schedule:[],teacher_id:""})}>+ New Group</button>
      </div>

      {del && (
        <div onClick={()=>!busy&&setDel(null)} style={{position:"fixed",left:0,right:0,top:0,bottom:0,zIndex:300,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:360,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:18,padding:"22px 20px"}}>
            <div style={{fontSize:"1.05rem",fontWeight:800,marginBottom:8}}>Delete {del.kind}?</div>
            <div style={{fontSize:".85rem",color:"var(--text2)",fontWeight:600,lineHeight:1.5,marginBottom:4}}>“{del.name}” will be permanently removed.</div>
            {del.warn && <div style={{fontSize:".82rem",color:"var(--partial)",fontWeight:700,lineHeight:1.5,marginBottom:4}}>{del.warn}</div>}
            <div style={{display:"flex",gap:8,marginTop:16}}>
              <button className="scr-btn" style={{flex:1,textAlign:"center"}} onClick={()=>setDel(null)} disabled={busy}>Cancel</button>
              {/* Filled red, not outlined: this is the confirm, so it should
                  look like the thing that does the deleting. */}
              <button className="scr-btn" style={{flex:1,textAlign:"center",background:"var(--red)",borderColor:"var(--red)",color:"#fff",fontWeight:800}} onClick={confirmDelete} disabled={busy}>{busy?"…":"Delete"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
// Public self-registration, owner side. One screen with two halves: the
// requests waiting on a decision (the thing that needs doing) sit above the
// links that produce them (set up once, touched rarely).
function PgRegistrations({ biz, onBack, onCreateLink, onSetLinkActive, onDeleteLink, onApprove, onReject, onUnreject }) {
  const p = bizPal(biz);
  const ABBR = {Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thu",Friday:"Fri",Saturday:"Sat",Sunday:"Sun"};
  const groups = biz.groups || [];
  const levels = biz.levels || [];
  const links = biz.regLinks || [];
  const requests = biz.regRequests || [];
  const pending  = requests.filter(r=>r.status==="pending");
  const rejected = requests.filter(r=>r.status==="rejected");

  const [form, setForm] = useState(null);        // {groupId,label} while creating a link
  const [busy, setBusy] = useState(false);
  const [del, setDel] = useState(null);          // link awaiting delete confirmation
  const [decide, setDecide] = useState(null);    // {req, groupId} approval sheet
  const [copied, setCopied] = useState(null);    // link id whose URL was just copied
  const [showRejected, setShowRejected] = useState(false);

  const groupName = (id)=>{ const g=groups.find(x=>x.id===id); return g?g.name:null; };
  const levelOf   = (id)=>{ const l=levels.find(x=>x.id===id); return l||null; };
  const schedOf = (id)=>{ const g=groups.find(x=>x.id===id); if(!g||!(g.schedule||[]).length) return ""; return g.schedule.map(s=>(ABBR[s.day]||s.day||"")+" "+(s.start_time||"")+(s.end_time?("–"+s.end_time):"")).join(", "); };
  // The link points at whichever site produced it, so a link made on staging
  // stays on staging instead of quietly sending families to production.
  const urlOf = (t)=> location.origin + "/join/?r=" + t;
  // 'YYYY-MM-DD' formatted by hand: new Date("2015-04-02") is UTC midnight, and
  // toLocaleDateString would shift it a day west of Greenwich.
  const fmtDob = (d)=>{ if(!d) return ""; const b=String(d).slice(0,10).split("-"); return b.length===3 ? (b[2]+"/"+b[1]+"/"+b[0]) : String(d); };
  const digitsOf = (ph)=> (ph||"").replace(/\D/g,"");

  function copyLink(text, id){
    const done=()=>{ setCopied(id); setTimeout(()=>setCopied(c=>c===id?null:c), 1800); };
    const manual=()=>{ try{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); done(); }catch(e){} };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, manual);
    else manual();
  }
  function shareLink(url, label){
    if(navigator.share) navigator.share({ title:biz.name+" — registration", text:"Register for "+biz.name+(label?(" — "+label):""), url }).catch(()=>{});
  }

  async function createLink(){ setBusy(true); const ok=await onCreateLink({ groupId:form.groupId||null, label:form.label }); setBusy(false); if(ok) setForm(null); }
  async function confirmDelete(){ setBusy(true); const ok=await onDeleteLink(del.id); setBusy(false); if(ok) setDel(null); }
  async function confirmApprove(){ setBusy(true); await onApprove(decide.req, decide.groupId||null, decide.levelId||null); setBusy(false); setDecide(null); }

  const lbl = {fontSize:".68rem",fontWeight:800,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".1em",margin:"14px 0 6px"};
  const secTitle = {fontSize:".72rem",fontWeight:800,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".16em",marginBottom:12};
  // Same content-sized row buttons PgManage uses — .btn-ghost/.btn-add are
  // full-width form buttons and would stretch across the row.
  const rowActions = {display:"flex",gap:8,marginTop:12,flexWrap:"wrap"};
  const rowBtn = {flex:"0 0 auto",width:"auto",padding:"9px 16px",borderRadius:10,border:"1px solid var(--border)",background:"var(--bg3)",color:"var(--text)",fontFamily:"var(--f)",fontWeight:700,fontSize:".8rem",cursor:"pointer",margin:0};
  const rowBtnDanger = {...rowBtn,background:"transparent",color:"var(--red)",fontWeight:800};
  const rowBtnPrimary = {...rowBtn,background:"var(--accent)",color:"var(--accent-ink)",border:"none",fontWeight:800};
  const rowCard = {padding:"13px 15px",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,marginBottom:8};
  const meta = {fontSize:".72rem",color:"var(--text2)",fontWeight:600,marginTop:3,lineHeight:1.5,overflowWrap:"anywhere"};
  const emptyNote = {fontSize:".82rem",color:"var(--text3)",fontWeight:600,lineHeight:1.6};
  const linkA = {color:"var(--accent)",fontWeight:700,textDecoration:"none"};

  // ---- New link form ----
  if (form) {
    return (
      <div className="page" style={{"--accent":p.acc}}>
        <div className="topbar">
          <button className="tb-back" onClick={()=>setForm(null)}>←</button>
          <h2>New Link</h2>
          <div style={{width:24}} />
        </div>
        <div className="section">
          <div className="scr-lbl" style={{marginTop:16}}>Who is this link for?</div>
          <select className="inp" value={form.groupId||""} onChange={e=>setForm(f=>({...f,groupId:e.target.value}))}>
            <option value="">Any class — the family chooses</option>
            {groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
          </select>
          <div style={{...meta,marginTop:8}}>
            {form.groupId
              ? "Everyone using this link is registered for that one class."
              : (groups.length ? "The form shows your classes and their times so the family can pick one." : "You have no classes yet, so the form will just take the student's details.")}
          </div>
          <div className="scr-lbl" style={{marginTop:16}}>Label <span style={{textTransform:"none",letterSpacing:0,fontWeight:600,color:"var(--text3)"}}>— optional, only you see it</span></div>
          <input className="inp" placeholder="e.g. Autumn flyer" value={form.label} onChange={e=>setForm(f=>({...f,label:e.target.value}))} />
          <div style={{...meta,marginTop:8}}>Handy when you have several links out and want to know which one people used.</div>
          <button className="btn" style={{marginTop:20}} onClick={createLink} disabled={busy}>{busy?"…":"Create Link"}</button>
        </div>
      </div>
    );
  }

  return (
    <div className="page" style={{"--accent":p.acc}}>
      <div className="topbar">
        <button className="tb-back" onClick={onBack}>←</button>
        <h2>Registration</h2>
        <div style={{width:24}} />
      </div>

      {/* ---- Requests ---- */}
      <div className="section">
        <div style={secTitle}>{pending.length ? ("Pending · "+pending.length) : "Pending"}</div>
        {pending.length===0 && (
          <div style={emptyNote}>
            Nothing waiting. Registrations sent through your links land here, and
            no student is created until you approve one.
          </div>
        )}
        {pending.map(r=>{
          const asked = groupName(r.group_id);
          const ph = digitsOf(r.phone);
          return (
            <div key={r.id} style={rowCard}>
              <div style={{fontWeight:800,fontSize:".95rem",overflowWrap:"anywhere"}}>{r.first_name+" "+r.last_name}</div>
              <div style={meta}>
                {relTime(r.created_at)}
                {asked ? (" · "+asked) : (groups.length ? " · no class chosen" : "")}
                {r.date_of_birth ? (" · born "+fmtDob(r.date_of_birth)) : ""}
              </div>
              {(r.phone || r.email) && (
                <div style={meta}>
                  {r.phone && <a style={linkA} href={"tel:"+r.phone}>{r.phone}</a>}
                  {r.phone && r.email ? " · " : ""}
                  {r.email && <a style={linkA} href={"mailto:"+r.email}>{r.email}</a>}
                </div>
              )}
              <div style={rowActions}>
                <button style={rowBtnPrimary} onClick={()=>setDecide({ req:r, groupId:r.group_id||"", levelId:"" })}>Approve</button>
                <button style={rowBtn} onClick={()=>onReject(r.id)}>Reject</button>
                {ph && <a style={{...rowBtn,textDecoration:"none",display:"inline-block"}} href={"https://wa.me/"+ph} target="_blank" rel="noopener noreferrer">WhatsApp</a>}
              </div>
            </div>
          );
        })}
      </div>

      {/* .section carries no vertical margin — spacing normally comes from its
          content, and collapsed this one has none, so without the explicit
          margin its heading sits directly on top of "Your links". */}
      {rejected.length>0 && (
        <div className="section" style={{marginBottom:22}}>
          <div onClick={()=>setShowRejected(v=>!v)} style={{...secTitle,marginBottom:showRejected?12:0,cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
            <span>Rejected · {rejected.length}</span>
            <span style={{color:"var(--text3)",letterSpacing:0}}>{showRejected?"▲":"▼"}</span>
          </div>
          {showRejected && rejected.map(r=>(
            <div key={r.id} style={{...rowCard,opacity:.65}}>
              <div style={{fontWeight:700,fontSize:".9rem",overflowWrap:"anywhere"}}>{r.first_name+" "+r.last_name}</div>
              <div style={meta}>Rejected {relTime(r.decided_at||r.created_at).toLowerCase()}</div>
              <div style={rowActions}>
                <button style={rowBtn} onClick={()=>onUnreject(r.id)}>Undo</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ---- Links ---- */}
      <div className="section">
        <div style={secTitle}>Your links</div>
        {links.length===0 && (
          <div style={emptyNote}>
            A registration link is a web address you can put on a flyer, a
            WhatsApp group or your social media. Anyone who opens it fills in
            the student's details — no login, no app to install — and it arrives
            here for you to approve.
          </div>
        )}
        {links.map(l=>{
          const url = urlOf(l.token);
          const gn = groupName(l.group_id);
          const sched = schedOf(l.group_id);
          const used = requests.filter(r=>r.link_id===l.id).length;
          // An unlabelled class link is already titled by its class, so naming
          // the class again underneath just reads as a stutter.
          const where = gn ? [l.label ? gn : null, sched].filter(Boolean).join(" · ") : "Family picks the class";
          const sub = [where, used>0 ? (used+" registration"+(used>1?"s":"")) : null].filter(Boolean).join(" · ");
          return (
            <div key={l.id} style={{...rowCard,opacity:l.is_active?1:.6}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <div style={{fontWeight:800,fontSize:".95rem",overflowWrap:"anywhere"}}>{l.label || gn || "Any class"}</div>
                {!l.is_active && <span style={{fontSize:".62rem",fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"var(--text2)",background:"var(--bg3)",borderRadius:99,padding:"3px 9px"}}>Off</span>}
              </div>
              {sub && <div style={meta}>{sub}</div>}
              <div style={{...meta,color:"var(--text3)",fontFamily:"monospace",fontSize:".68rem"}}>{url}</div>
              <div style={rowActions}>
                <button style={rowBtnPrimary} onClick={()=>copyLink(url,l.id)}>{copied===l.id?"Copied ✓":"Copy link"}</button>
                {navigator.share && <button style={rowBtn} onClick={()=>shareLink(url,l.label)}>Share</button>}
                <button style={rowBtn} onClick={()=>onSetLinkActive(l.id, !l.is_active)}>{l.is_active?"Switch off":"Switch on"}</button>
                <button style={rowBtnDanger} onClick={()=>setDel(l)}>Delete</button>
              </div>
            </div>
          );
        })}

  );
}

function PgGroups({ biz, onBack }) {
  const p = bizPal(biz);
  const [sel, setSel] = useState(null);
  const DAYS = [["Monday","Mon"],["Tuesday","Tue"],["Wednesday","Wed"],["Thursday","Thu"],["Friday","Fri"],["Saturday","Sat"],["Sunday","Sun"]];
  const ABBR = {Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thu",Friday:"Fri",Saturday:"Sat",Sunday:"Sun"};
  const COLORS = ["#6366f1","#10b981","#f59e0b","#ec4899","#06b6d4","#a855f7","#ef4444","#84cc16","#f97316","#0ea5e9","#14b8a6","#eab308"];
  const HOUR_PX = 60, HDR = 24, DEFAULT_DUR = 60;
  const toMin = (t)=>{ if(t==null||t==="") return null; const p=String(t).split(":"); const h=parseInt(p[0],10), m=parseInt(p[1]||"0",10); return isNaN(h)?null:h*60+(isNaN(m)?0:m); };
  // Canonicalize a day value to a full English name. The grid columns are keyed
  // by "Monday".."Sunday", but stored schedules may use abbreviations ("Mon"),
  // different casing, or stray whitespace — any of which would otherwise miss
  // the column lookup and drop the block silently.
  const DAYNAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const normDay = (d)=>{ if(d==null) return null; const k=String(d).trim().toLowerCase(); if(!k) return null; return DAYNAMES.find(n=>{const ln=n.toLowerCase(); return ln===k || ln.slice(0,3)===k.slice(0,3);}) || null; };
  // Normalize one schedule slot to {day, sm, em} in minutes. Reads the current
  // start_time/end_time shape AND the legacy single-time field; if no end is
  // recorded, assume a default duration so the block still has height. day is
  // canonicalized so the column lookup matches regardless of stored spelling.
  const slotMin = (s)=>{
    const sm = toMin((s.start_time!=null && s.start_time!=="") ? s.start_time : s.time);
    if(sm==null) return null;
    let em = toMin(s.end_time);
    if(em==null||em<=sm) em = sm + DEFAULT_DUR;
    return { day:normDay(s.day), sm, em };
  };

  // Render one session per REAL group (from the groups table) — its schedule is
  // the single source of truth, so a group is one clean block per scheduled slot
  // (no more scattered per-student blocks).
  const groups = biz.groups || [];
  const allCards = Object.values(biz.cards || {});
  const teacherName = (id)=>{ const t=(biz.teachers||[]).find(x=>x.id===id); return t ? t.name : null; };
  // Students belong to a group by group_id; legacy students (no group_id) match
  // by their old free-text group_name so they still appear until reassigned.
  const studentsOf = (g)=> allCards.filter(c=> c.groupId ? c.groupId===g.id : ((c.groupName||"").trim()===(g.name||"").trim())).map(c=>c.name||"Unnamed");
  // Stable color per group id, assigned in alphabetical name order.
  const ordered = [...groups].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const colorOf = {}; ordered.forEach((g,i)=>{ colorOf[g.id] = COLORS[i%COLORS.length]; });
  const sessions = ordered.map(g=>({ key:g.id, name:g.name||"", schedule:g.schedule||[], teacherId:g.teacher_id||null, color:colorOf[g.id], students:studentsOf(g) }));

  // Visible window defaults to 16:00–21:00, but auto-fits (expands) to include
  // any session whose times fall outside that band — so no group is ever
  // silently clipped out of the grid.
  let lo = 16*60, hi = 21*60;
  sessions.forEach(g=>(g.schedule||[]).forEach(s=>{ const m=slotMin(s); if(m){ lo=Math.min(lo,m.sm); hi=Math.max(hi,m.em); } }));
  const START_H = Math.floor(lo/60), END_H = Math.ceil(hi/60);
  const HOURS = END_H - START_H, GRID_H = HOURS*HOUR_PX, RANGE = HOURS*60;

  const byDay = {}; DAYS.forEach(([d])=>byDay[d]=[]);
  const rendered = new Set();
  sessions.forEach(g=>{
    (g.schedule||[]).forEach(s=>{
      const m=slotMin(s);
      if(!m||!byDay[m.day]) return;
      let top=((m.sm-START_H*60)/RANGE)*GRID_H;
      let bot=((m.em-START_H*60)/RANGE)*GRID_H;
      if(bot<=0||top>=GRID_H) return;
      top=Math.max(0,top); bot=Math.min(GRID_H,bot);
      byDay[m.day].push({ key:g.key, name:g.name, color:g.color, top, h:Math.max(16,bot-top) });
      rendered.add(g.key);
    });
  });

  // Calendar-style overlap layout: within each day, blocks that overlap in time
  // are split into side-by-side lanes instead of stacking on top of each other.
  // Each block gets _lane (its column index) and _lanes (columns in its overlap
  // cluster); a block with no overlaps keeps the full column width (_lanes=1).
  DAYS.forEach(([d])=>{
    const evs = byDay[d].map(b=>({ b, s:b.top, e:b.top+b.h })).sort((x,y)=>x.s-y.s||x.e-y.e);
    let i=0;
    while(i<evs.length){
      let j=i, clusterEnd=evs[i].e; const cluster=[evs[i]];
      while(j+1<evs.length && evs[j+1].s < clusterEnd){ j++; cluster.push(evs[j]); clusterEnd=Math.max(clusterEnd, evs[j].e); }
      const colEnd=[];
      cluster.forEach(ev=>{
        let c=0; for(; c<colEnd.length; c++){ if(colEnd[c] <= ev.s){ break; } }
        ev.col=c; colEnd[c]=ev.e;
      });
      const cols=colEnd.length;
      cluster.forEach(ev=>{ ev.b._lane=ev.col; ev.b._lanes=cols; });
      i=j+1;
    }
  });

  const selG = sessions.find(g=>g.key===sel) || null;
  const schedStr = selG ? (selG.schedule||[]).map(s=>{const a=(s.start_time||s.time||""); const b=(s.end_time||""); return (ABBR[normDay(s.day)]||s.day||"")+" "+a+(b?("–"+b):"");}).join(", ") : "";
  // Catch-all: any group present in the data but with no block on the grid —
  // covers both a missing/unparseable schedule and an unrecognized day — so a
  // group can never be silently invisible again.
  const noSched = [...new Set(sessions.filter(g=>!rendered.has(g.key)).map(g=>g.name))];
  // Legacy students still on a free-text group_name that has no matching real
  // group — surfaced so they can be reassigned in Manage (not lost silently).
  const realNames = new Set(groups.map(g=>(g.name||"").trim()));
  const legacyGroups = [...new Set(allCards.filter(c=>!c.groupId && (c.groupName||"").trim() && !realNames.has((c.groupName||"").trim())).map(c=>(c.groupName||"").trim()))];

  return (
    <div className="page" style={{"--accent":p.acc}}>
      <div className="topbar">
        <button className="tb-back" onClick={onBack}>←</button>
        <h2>Groups</h2>
        <div style={{width:24}} />
      </div>
      {sessions.length===0 ? (
        <div className="empty">No groups yet. Create groups in Settings → 🗂️ Manage.</div>
      ) : (
        <div className="section">
          <div style={{fontSize:".72rem",color:"var(--text2)",fontWeight:600,marginBottom:12,lineHeight:1.5}}>Weekly schedule, {String(START_H).padStart(2,"0")+":00"}–{String(END_H).padStart(2,"0")+":00"}. Tap a block for details.</div>
          <div style={{display:"flex"}}>
            <div style={{width:34,flexShrink:0,position:"relative",height:HDR+GRID_H}}>
              {Array.from({length:HOURS+1}).map((_,i)=>(
                <div key={i} style={{position:"absolute",top:HDR+i*HOUR_PX-6,right:4,fontSize:".55rem",color:"var(--text3)",fontWeight:700}}>{String(START_H+i).padStart(2,"0")+":00"}</div>
              ))}
            </div>
            <div style={{flex:1,display:"flex"}}>
              {DAYS.map(([d,short])=>(
                <div key={d} style={{flex:1,minWidth:0,borderLeft:"1px solid var(--border)"}}>
                  <div style={{height:HDR,display:"flex",alignItems:"center",justifyContent:"center",fontSize:".58rem",fontWeight:800,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".04em"}}>{short}</div>
                  <div style={{position:"relative",height:GRID_H,background:"var(--bg2)"}}>
                    {Array.from({length:HOURS+1}).map((_,i)=>(
                      <div key={i} style={{position:"absolute",left:0,right:0,top:i*HOUR_PX,height:1,background:"rgba(255,255,255,.05)"}} />
                    ))}
                    {byDay[d].map((b,bi)=>{
                      const on = b.key===sel;
                      const lanes = b._lanes||1, lane = b._lane||0, wPct = 100/lanes;
                      return (
                        <div key={bi} onClick={()=>setSel(x=>x===b.key?null:b.key)}
                          style={{position:"absolute",left:"calc("+(lane*wPct)+"% + 1px)",width:"calc("+wPct+"% - 2px)",top:b.top,height:b.h,background:b.color,borderRadius:5,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",textAlign:"center",padding:"1px 2px",overflow:"hidden",zIndex:on?5:1,transform:on?"scale(1.06)":"none",boxShadow:on?("0 0 0 2px #fff, 0 0 12px "+b.color):"none",transition:"transform .15s ease-out, box-shadow .15s ease-out"}}>
                          <span style={{fontSize:"8px",lineHeight:"9px",fontWeight:800,color:"#fff",wordBreak:"break-word",whiteSpace:"normal"}}>{b.name}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{maxHeight:selG?640:0,opacity:selG?1:0,overflow:"hidden",transition:"max-height .3s ease-out, opacity .3s ease-out"}}>
            {selG && (
              <div style={{marginTop:14,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:16,padding:"16px 18px"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <span style={{width:12,height:12,borderRadius:4,background:selG.color,flexShrink:0}} />
                  <div style={{fontSize:"1.05rem",fontWeight:800}}>{selG.name}</div>
                </div>
                <div style={{fontSize:".78rem",color:"var(--text2)",fontWeight:700,marginBottom:4}}>{teacherName(selG.teacherId) ? ("👤 "+teacherName(selG.teacherId)) : "No teacher"}</div>
                <div style={{fontSize:".82rem",color:"var(--text2)",fontWeight:700,marginBottom:12}}>{schedStr||"No schedule set"}</div>
                <div style={{fontSize:".62rem",fontWeight:800,color:"var(--text3)",textTransform:"uppercase",letterSpacing:".12em",marginBottom:8}}>Students ({selG.students.length})</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {selG.students.map((s,si)=>(<span key={si} style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:99,padding:"5px 12px",fontSize:".78rem",fontWeight:700,color:"var(--text)"}}>{s}</span>))}
                </div>
              </div>
            )}
          </div>

          {noSched.length>0 && (
            <div style={{marginTop:16,fontSize:".72rem",color:"var(--text3)",fontWeight:600,lineHeight:1.5}}>No schedule set: {noSched.join(", ")}</div>
          )}
          {legacyGroups.length>0 && (
            <div style={{marginTop:8,fontSize:".72rem",color:"var(--text3)",fontWeight:600,lineHeight:1.5}}>Legacy groups (reassign students in 🗂️ Manage): {legacyGroups.join(", ")}</div>
          )}
        </div>
      )}
    </div>
  );
}
function App() {
  const [session, setSession] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [db, setDb] = useState({businesses:{}});
  const [view, setView] = useState("landing");
  const [bizId, setBizId] = useState(null);
  const [cardId, setCardId] = useState(null);

  const [toast, setToast] = useState(null);
  const [bizLoaded, setBizLoaded] = useState(false);
  const [myCards, setMyCards] = useState([]);
  const [children, setChildren] = useState([]);
  const [ann, setAnn] = useState([]);
  const [annRead, setAnnRead] = useState([]);
  const [dashFilter, setDashFilter] = useState("all");
  const [dashSort, setDashSort] = useState("name");
  // Dashboard view mode and per-section expand state live here rather than in
  // PgDashboard: that component unmounts whenever you open a student, so state
  // held inside it would reset on every card round-trip.
  const [dashViewBy, setDashViewBy] = useState("all");
  const [dashExpanded, setDashExpanded] = useState({});
  const [approval, setApproval] = useState(null);
  const [mode, setMode] = useState("teacher");

  const pop = (msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2800);};

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{ setSession(data.session); }).catch(()=>{}).finally(()=>{ setAuthReady(true); });
    const { data: sub } = sb.auth.onAuthStateChange((_e,s)=>{ setSession(s); setAuthReady(true); });
    return ()=>{ sub.subscription.unsubscribe(); };
  },[]);

  async function loadInto() {
    let b = await loadMyBusiness();
    if (!b) {
      const rawp = localStorage.getItem("pending_biz");
      if (rawp) {
        try {
          const pv = JSON.parse(rawp);
          await sb.from("businesses").insert({ biz_code:genBizId(), name:pv.name, type:pv.type, fee:+pv.fee, year:new Date().getFullYear(), contact_email:pv.email, inactive_months:[], levels:[] });
          localStorage.removeItem("pending_biz");
          b = await loadMyBusiness();
        } catch(e){}
      }
    }
    if (b) { setDb({businesses:{[b.id]:b}}); setBizId(b.id); }
    return b;
  }

  useEffect(()=>{
    if (!session) { setDb({businesses:{}}); setBizId(null); setMyCards([]); setAnn([]); setMode("teacher"); setApproval(null); setBizLoaded(false); return; }
    setBizLoaded(false);
    (async()=>{
      try {
        const role = session.user && session.user.user_metadata && session.user.user_metadata.role;
        let b = null;
        if (role === "parent") {
          setApproval("approved"); // parents are not gated
        } else {
          // Admin approval gate. This effect only runs once a user is
          // authenticated (it early-returns above when !session), so the
          // status check NEVER runs before auth. It also fails OPEN: only an
          // explicit 'pending'/'rejected' shows the gate — any other result
          // (approved, no business yet, or an RPC error) loads the app, so a
          // hiccup can never black-screen or lock out a logged-in user.
          let status = await loadMyApproval();
          if (status === "pending" || status === "rejected") {
            setApproval(status);
          } else {
            b = await loadInto();                 // approved / no-biz-yet / unknown → load
            if (status === null) {                // a brand-new signup may have lazily created a pending biz
              const recheck = await loadMyApproval();
              status = (recheck === "pending" || recheck === "rejected") ? recheck : "approved";
            } else {
              status = "approved";

            setApproval(status);
          }
        }
        const links = await loadMyCards();
        setMyCards(links);
        try { setChildren(await loadMyChildren()); } catch(e){ setChildren([]); }
        try { setAnn(await loadMyAnnouncements()); } catch(e){ setAnn([]); }
        try { setAnnRead(await loadMyAnnReads()); } catch(e){ setAnnRead([]); }
        let m;
        if (role === "parent") m = "parent";
        else if (b) m = "teacher";
        else if (links.length > 0) m = "parent";
        else m = "teacher";
        setMode(m);
        setView(v=>(v==="landing"||v==="login"||v==="register"||v==="forgot"||v==="parentAuth")
          ? (m==="parent" ? "parentDash" : "dashboard") : v);
      } catch(e){ pop(e.message||"Load failed","err"); }
      finally { setBizLoaded(true); }
    })();
  },[session]);

  const biz = bizId ? db.businesses[bizId] : null;
  const card = biz && cardId ? biz.cards[cardId] : null;

  // --- scroll restoration -------------------------------------------------
  // This app has no router: `view` (plus cardId) IS the route. Navigating used
  // to keep the window's scroll offset, so opening a student from far down the
  // list landed you partway down their card. Scroll to top on every view
  // change, except when returning to the dashboard, where the list's previous
  // offset is restored so you come back to the student you tapped.
  const scrollMem = useRef({});
  const prevRoute = useRef(null);
  const routeKey = view + (view==="card" ? (":"+cardId) : "");
  useEffect(()=>{
    const prev = prevRoute.current;
    if (prev !== null && prev !== routeKey) {
      if (view === "dashboard" && scrollMem.current.dashboard != null) {
        const y = scrollMem.current.dashboard;
        // The dashboard list isn't tall enough to scroll to yet at this point —
        // React has committed but the browser is still laying out ~N cards, so
        // an immediate scrollTo gets clamped to the old (short) page height.
        // Re-apply each frame until it sticks, giving up after ~20 frames so a
        // genuinely shorter list (e.g. after deletions) can't loop forever.
        const restore = (tries)=>{

  // Remember where the dashboard was scrolled to as we leave it.
  function goView(next){
    if (view === "dashboard") scrollMem.current.dashboard = window.scrollY || window.pageYOffset || 0;
    setView(next);
  }

  async function refresh(){ try{ const b=await loadMyBusiness(); if(b){setDb({businesses:{[b.id]:b}});} }catch(e){} }
  async function doSaveTeacher(t){ const name=(t.name||"").trim(); if(!name){ pop("Enter a teacher name","err"); return false; } let error; if(t.id){ ({error}=await sb.from("teachers").update({name}).eq("id",t.id)); } else { ({error}=await sb.from("teachers").insert({business_id:bizId,name})); } if(error){ pop(error.message,"err"); return false; } await refresh(); return true; }
  async function doDeleteTeacher(id){ const { error }=await sb.from("teachers").delete().eq("id",id); if(error){ pop(error.message,"err"); return false; } await refresh(); return true; }
  async function doSaveGroup(g){ const name=(g.name||"").trim(); if(!name){ pop("Enter a group name","err"); return false; } const row={ name, schedule:(g.schedule||[]).filter(r=>r.day&&r.start_time), teacher_id:g.teacher_id||null }; let error; if(g.id){ ({error}=await sb.from("groups").update(row).eq("id",g.id)); } else { ({error}=await sb.from("groups").insert({business_id:bizId,name:row.name,schedule:row.schedule,teacher_id:row.teacher_id})); } if(error){ pop(/duplicate|unique/i.test(error.message)?"A group with that name already exists.":error.message,"err"); return false; } await refresh(); return true; }
  async function doDeleteGroup(id){ const { error }=await sb.from("groups").delete().eq("id",id); if(error){ pop(error.message,"err"); return false; } await refresh(); return true; }

  // --- self-registration --------------------------------------------------
  // The token is generated by the column default in the database, not here, so
  // it is never a value the browser chose. insert().select() returns the row so
  // the new link can be shown immediately.
  async function doCreateRegLink({ groupId, label }){
    const { error } = await sb.from("registration_links").insert({ business_id:bizId, group_id:groupId||null, label:(label||"").trim()||null }).select("id").single();
    if(error){ pop(error.message,"err"); return false; }
    await refresh(); pop("Link created"); return true;
  }
  async function doSetRegLinkActive(id, active){
    const { error } = await sb.from("registration_links").update({ is_active:!!active }).eq("id",id);
    if(error){ pop(error.message,"err"); return false; }
    await refresh(); pop(active?"Link is live again":"Link switched off"); return true;
  }
  async function doDeleteRegLink(id){
    const { error } = await sb.from("registration_links").delete().eq("id",id);
    if(error){ pop(error.message,"err"); return false; }
    await refresh(); pop("Link deleted"); return true;
  }
  // Approval is the same create-and-reveal loop doAddCard runs: generate the
  // code and PIN here so they match what the rest of the app produces, let the
  // RPC insert the card and flip the request in one transaction, then land on
  // the very same PgReveal screen a hand-added student shows.
  // levelId is an id from biz.levels, not a fee: the RPC looks the level up in
  // the business's own list, so the browser can name one of the school's levels
  // but can never state a price. Null means "no level" — the business default
  // fee — which is what every student created before this had.
  async function doApproveRegistration(req, groupId, levelId){
    const shareCode = genShareCode(), pin = genPin();
    const { data, error } = await sb.rpc("approve_registration", { p_request_id:req.id, p_share_code:shareCode, p_pin:pin, p_group_id:groupId||null, p_level_id:levelId||null });
    if(error){ pop(error.message,"err"); return false; }
    if(!data || !data.ok){
      // already_approved / already_rejected: someone (or a second tap) got
      // there first. Refresh so the list stops offering a stale action.
      pop(data && /^already_/.test(data.error||"") ? "That request was already handled." : "Could not approve this request.","err");
      await refresh(); return false;
    }
    const c = data.card || {};
    await refresh();
    setRevealCard({ id:c.id, name:c.name, shareCode:c.share_code, pin:c.pin, phone:req.phone||"", level:c.level||null,
      preferredChannel:"whatsapp", language:"EN", enrollmentStart:null, groupId:c.group_id||null, groupName:"",
      lessonSchedule:[], pausedMonths:[], feeHistory:[], payments:{}, history:[] });
    setView("reveal");
    return true;
  }
  async function doRejectRegistration(id){
    const { error } = await sb.from("registration_requests").update({ status:"rejected", decided_at:new Date().toISOString() }).eq("id",id);
    if(error){ pop(error.message,"err"); return false; }
    await refresh(); return true;
  }
  // Undo a rejection. decided_at goes back to null so a restored request is
  // indistinguishable from one that was never touched.
  async function doUnrejectRegistration(id){
    const { error } = await sb.from("registration_requests").update({ status:"pending", decided_at:null }).eq("id",id);
    if(error){ pop(error.message,"err"); return false; }
    await refresh(); return true;
  }

  async function doLogout(){ await sb.auth.signOut(); setBizId(null); setDb({businesses:{}}); setMyCards([]); setChildren([]); setDashFilter("all"); setDashSort("name"); setApproval(null); setMode("teacher"); setView("landing"); }

  // GDPR right-to-erasure. Both RPCs are SECURITY DEFINER and also delete the
  // auth.users row so the email can be re-registered. Nothing is deleted until
  // the user explicitly confirms here.
  async function doDeleteBusiness(){
    if (!biz) return;
    const typed = window.prompt("Permanently delete this business, all students and all payment records? This cannot be undone. Type the business name exactly to confirm:");
    if (typed === null) return;
    if (typed !== (biz.name||"")) { pop("Name did not match — nothing was deleted.","err"); return; }
    const { error } = await sb.rpc("delete_my_business_account");
    if (error) { pop(error.message||"Delete failed","err"); return; }
    try { await sb.auth.signOut(); } catch(e){}
    setSession(null); setBizId(null); setDb({businesses:{}}); setMyCards([]); setChildren([]); setApproval(null); setMode("teacher"); setView("landing");
    pop("Business account deleted.");
  }
  // Mark an announcement read for this parent. Optimistic: the UI flips
  // immediately and the row is written in the background — a failed write just
  // means it shows unread again after a reload, which is the safe direction.
  async function doMarkAnnRead(id){
    if (!id || annRead.indexOf(id) >= 0) return;
    setAnnRead(r=>r.indexOf(id)>=0 ? r : r.concat([id]));
    const uid = session && session.user && session.user.id;
    if (!uid) return;
    await sb.from("announcement_reads").upsert({ parent_id: uid, announcement_id: id }, { onConflict: "parent_id,announcement_id", ignoreDuplicates: true });
  }

  // Confirmation now lives in PgParentSettings' dialog, so no window.confirm here.
  async function doDeleteFamily(){
    const { error } = await sb.rpc("delete_my_family_account");
    if (error) { pop(error.message||"Delete failed","err"); return; }
    try { await sb.auth.signOut(); } catch(e){}
    setSession(null); setBizId(null); setDb({businesses:{}}); setMyCards([]); setChildren([]); setApproval(null); setMode("teacher"); setView("landing");
    pop("Family account deleted.");
  }

  async function refreshChildren(){ try { setChildren(await loadMyChildren()); } catch(e){} }
  async function doCreateChild(name){
    const { data, error } = await sb.rpc("create_child", { p_name: name });
    if (error) { pop(error.message,"err"); return null; }
    await refreshChildren();
    return (data && data.ok) ? data : null;
  }
  async function doRenameChild(id, name){
    const { error } = await sb.rpc("rename_child", { p_id:id, p_name:name });
    if (error) { pop(error.message,"err"); return; }
    await refreshChildren();
  }
  async function doDeleteChild(id){
    const { error } = await sb.rpc("delete_child", { p_id:id });
    if (error) { pop(error.message,"err"); return; }
    await refreshChildren(); await refreshMyCards();
  }
  async function doAssignCard(cardId, childId){
    const { error } = await sb.rpc("assign_card", { p_card_id:cardId, p_child_id:childId });
    if (error) { pop(error.message,"err"); return; }
    await refreshMyCards();
  }

  async function refreshMyCards(){ try { const items = await loadMyCards(); setMyCards(items); } catch(e){} }
  async function doLinkChild(code, pin){
    const { data, error } = await sb.rpc("link_card", { p_code: code, p_pin: pin });
    if (error) return { error: error.message };
    if (data && data.ok) { await refreshMyCards(); pop("Linked "+(data.name||"card")+"!"); }
    return data || { ok:false };
  }
  async function doUnlinkCard(cardId, name){
    if (!window.confirm("Unlink "+(name||"this card")+"?")) return;
    const { error } = await sb.rpc("unlink_card", { p_card_id: cardId });
    if (error) { pop(error.message,"err"); return; }
    await refreshMyCards(); pop("Unlinked");
  }

  function onRegistered(res){
    if (res && res.needsConfirm){ pop("Check your email to confirm, then log in."); setView("login"); }
    else if (res && res.bizCode){ pop("Business created! Code: "+res.bizCode); }
  }

  async function afterBizCreated(code){
    // New accounts are created 'pending' — show the approval gate, not the app.
    setBizLoaded(false);
    try {
      const status = await loadMyApproval();
      setApproval(status);
      if (status === "approved") { const b = await loadInto(); if (b) setView("dashboard"); }
      else { pop("Account created — pending approval."); }
    } catch(e){ pop(e.message||"Load failed","err"); }
    finally { setBizLoaded(true); }
  }

  async function doAddCard(data){
    if(!data.name.trim()){ pop("Enter a name","err"); return; }
    const shareCode=genShareCode(), pin=genPin();
    const { data: ins, error } = await sb.from("cards").insert({ business_id:bizId, name:data.name.trim(), level:data.level||null, share_code:shareCode, pin, phone:data.phone||null, preferred_channel:data.preferredChannel||"whatsapp", language:data.language||"EN", enrollment_start_month:data.enrollmentStart||null, group_id:data.groupId||null, lesson_schedule:data.lessonSchedule||[], payments:{}, history:[] }).select("id").single();
    if(error){ pop(error.message,"err"); return; }
    const newCard={id:ins.id,name:data.name.trim(),level:data.level||null,shareCode,pin,phone:data.phone||"",preferredChannel:data.preferredChannel||"whatsapp",language:data.language||"EN",enrollmentStart:data.enrollmentStart||null,groupId:data.groupId||null,groupName:"",lessonSchedule:data.lessonSchedule||[],pausedMonths:[],feeHistory:[],payments:{},history:[]};
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards:{...d.businesses[bizId].cards,[ins.id]:newCard}}}}));
    setRevealCard(newCard); setView("reveal");
  }
  // Bulk import batch insert. `payload` rows are fully-formed by PgImport
  // (which owns the mapping/defaults); this just does the single atomic
  // multi-row insert and merges the results into local state, mirroring
  // doAddCard's optimistic-update shape. A single INSERT with N value rows is
  // one SQL statement — if ANY row violates a constraint, Postgres rolls the
  // whole statement back and NOTHING is inserted, which is what gives this
  // its all-or-nothing guarantee without a separate RPC/transaction.
  async function doImportStudents(payload) {
    const { data: ins, error } = await sb.from("cards").insert(payload).select("id, share_code");
    if (error) return { ok:false, error: error.message || "Import failed." };
    const byCode = {}; payload.forEach(p => { byCode[p.share_code] = p; });
    const newCards = {};
    ins.forEach(row => {
      const p = byCode[row.share_code]; if (!p) return;
      newCards[row.id] = { id:row.id, name:p.name, level:null, shareCode:p.share_code, pin:p.pin, phone:p.phone||"", preferredChannel:p.preferred_channel, language:p.language, enrollmentStart:p.enrollment_start_month, groupId:p.group_id, groupName:"", lessonSchedule:[], pausedMonths:[], feeHistory:p.fee_history||[], payments:{}, history:[] };
    });
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards:{...d.businesses[bizId].cards,...newCards}}}}));
    return { ok:true, count: ins.length };
  }

async function doUpdateCard(updates){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards:{...d.businesses[bizId].cards,[cardId]:{...d.businesses[bizId].cards[cardId],...updates}}}}}));
    const patch={};
    if("name" in updates) patch.name=updates.name;
    if("payments" in updates) patch.payments=updates.payments;
    if("history" in updates) patch.history=updates.history;
    if("level" in updates) patch.level=updates.level;
    if("phone" in updates) patch.phone=updates.phone;
    if("preferredChannel" in updates) patch.preferred_channel=updates.preferredChannel;
    if("language" in updates) patch.language=updates.language;
    if("enrollmentStart" in updates) patch.enrollment_start_month=updates.enrollmentStart;
    if("pausedMonths" in updates) patch.paused_months=updates.pausedMonths;
    if("feeHistory" in updates) patch.fee_history=updates.feeHistory;
    if("groupId" in updates) patch.group_id=updates.groupId;
    if("groupName" in updates) patch.group_name=updates.groupName;
    if("lessonSchedule" in updates) patch.lesson_schedule=updates.lessonSchedule;
    const { error } = await sb.from("cards").update(patch).eq("id",cardId);
    if(error){ pop(error.message,"err"); refresh(); }
  }

  async function doRemoveCard(){
    if(!window.confirm("Remove this student?")) return;
    const id=cardId;
    setDb(d=>{const cards={...d.businesses[bizId].cards};delete cards[id];return {businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards}}};});
    setView("dashboard");
    const { error } = await sb.from("cards").delete().eq("id",id);
    if(error){pop(error.message,"err");} else {pop("Student removed");}
  }

  // Bulk delete from the student list. One DELETE ... in (...) statement, so it
  // either removes every selected student or none (same all-or-nothing property
  // the bulk import relies on). Local state is only updated after the server
  // confirms, so a failure leaves the list exactly as it was.
  async function doRemoveCards(ids){
    if(!ids || !ids.length) return { ok:false, error:"Nothing selected." };
    const { error } = await sb.from("cards").delete().in("id", ids);
    if(error){ pop(error.message,"err"); return { ok:false, error:error.message }; }
    setDb(d=>{ const cards={...d.businesses[bizId].cards}; ids.forEach(id=>{delete cards[id];}); return {businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards}}}; });
    pop(ids.length+(ids.length===1?" student removed":" students removed"));
    return { ok:true, count:ids.length };
  }

  async function doSaveMonths(inactive){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],inactiveMonths:inactive}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({inactive_months:inactive}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop("Months saved!");}
  }
  async function doSaveLevels(levels){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],levels}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({levels}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop("Levels saved!");}
  }
  async function doSaveAccent(accent){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],accent}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({accent}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop(accent?"Colour saved!":"Back to your category colour");}
  }
  async function doSaveIcon(icon){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],icon}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({icon}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop(icon?"Icon saved!":"Back to your category icon");}
  }
  async function doSaveCard(img){
    let url=img;
    if (img && img.indexOf("data:")===0){
      try{
        const blob = await (await fetch(img)).blob();
        const path = bizId+"/card-"+Date.now();
        const { error: ue } = await sb.storage.from("card-images").upload(path, blob, {upsert:true, contentType:blob.type||"image/png"});
        if(ue) throw ue;
        url = sb.storage.from("card-images").getPublicUrl(path).data.publicUrl;
      }catch(e){ pop(e.message||"Upload failed","err"); return; }
    }
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],customCardImage:url}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({custom_card_image:url}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop(url?"Card image saved!":"Image removed");}
  }

  // New Year rollover: owner-initiated only. Increments biz.year by 1 so the
  // grid re-renders a fresh Jan–Dec for the next year. No card/payment/history
  // data is deleted — prior-year payments stay keyed under their own year.
  async function doStartNewYear(){
    const cur = (biz && biz.year) || new Date().getFullYear();
    const next = cur + 1;
    if (!window.confirm("This will start "+next+". Your "+cur+" payment history is safe and stays in records. This cannot be undone. Continue?")) return;
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],year:next}}}));
    const { error } = await sb.from("businesses").update({year:next}).eq("id",bizId);
    if(error){ pop(error.message,"err"); } else { pop("New year started: "+next); }
  }

  return (
    <>
      <style>{CSS}</style>
      <div className={"app"+(view==="dashboard"?" app--wide":"")}>
        {!authReady ? <div className="empty" style={{paddingTop:80}}>Loading…</div>
         : session && !bizLoaded ? <div className="empty" style={{paddingTop:80}}>Loading…</div>
         : session && approval==="pending" ? <PgPending email={session.user&&session.user.email} onLogout={doLogout} />
         : session && approval==="rejected" ? <PgRejected onLogout={doLogout} />
         : session && mode==="parent" ? (view==="linkChild"
             ? <PgLinkChild onBack={()=>setView("parentDash")} onLink={doLinkChild} kids={children} onAssign={doAssignCard} onCreateChild={doCreateChild} />
             : view==="parentSettings"
             ? <PgParentSettings email={session.user&&session.user.email} onBack={()=>setView("parentDash")} onDeleteAccount={doDeleteFamily} />
             : <PgParentDashboard items={myCards} kids={children} announcements={ann} annRead={annRead} onMarkAnnRead={doMarkAnnRead} onLink={()=>setView("linkChild")} onUnlink={doUnlinkCard} onAssign={doAssignCard} onCreateChild={doCreateChild} onRenameChild={doRenameChild} onDeleteChild={doDeleteChild} onLogout={doLogout} onSettings={()=>setView("parentSettings")} onTeacher={biz?(()=>{setMode("teacher");setView("dashboard");}):null} />)
         : session && bizLoaded && !biz ? <PgCreateBusiness email={session.user&&session.user.email} onCreated={afterBizCreated} onLogout={doLogout} />
         : <>
        {view==="landing" && <PgLanding onTeacher={()=>setView(session?"dashboard":"login")} onParent={()=>setView("parentAuth")} onStudent={()=>setView("student")} />}
        {view==="login" && <PgLogin onLogin={()=>{}} onBack={()=>setView("landing")} onRegister={()=>setView("register")} onForgot={()=>setView("forgot")} />}
        {view==="forgot" && <PgForgot onBack={()=>setView("login")} />}
        {view==="register" && <PgRegister onBack={()=>setView("login")} onCreated={onRegistered} />}
        {view==="student" && <PgStudent onBack={()=>setView("landing")} />}
        {view==="parentAuth" && <PgParentAuth onBack={()=>setView("landing")} />}
        {view==="dashboard" && biz && <PgDashboard biz={biz} onCard={id=>{setCardId(id);goView("card");}} onAdd={()=>goView("addCard")} onMonths={()=>goView("months")} onLevels={()=>goView("levels")} onCustomCard={()=>goView("customCard")} onTheme={()=>goView("theme")} onIcon={()=>goView("icon")} onExport={()=>goView("export")} onRemind={()=>goView("remind")} onFamily={()=>{setMode("parent");goView("parentDash");}} showFamily={myCards.length>0} onLogout={doLogout} levelFilter={dashFilter} setLevelFilter={setDashFilter} sort={dashSort} setSort={setDashSort} viewBy={dashViewBy} setViewBy={setDashViewBy} expanded={dashExpanded} setExpanded={setDashExpanded} onNewYear={doStartNewYear} onDeleteAccount={doDeleteBusiness} onAnnouncements={()=>goView("announcements")} onGroups={()=>goView("groups")} onManage={()=>goView("manage")} onRegistrations={()=>goView("registrations")} onImport={()=>goView("import")} onRemoveCards={doRemoveCards} />}
        {view==="addCard" && biz && <PgAddCard biz={biz} onBack={()=>setView("dashboard")} onCreate={doAddCard} />}
        {view==="import" && biz && <PgImport biz={biz} onBack={()=>setView("dashboard")} onImport={doImportStudents} />}
        {view==="reveal" && revealCard && <PgReveal biz={biz} card={revealCard} onDone={()=>{setRevealCard(null);setView("dashboard");}} />}
        {view==="card" && biz && card && <PgCard biz={biz} card={card} onBack={()=>setView("dashboard")} onUpdate={doUpdateCard} onRemove={doRemoveCard} />}
        {view==="months" && biz && <PgManageMonths biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveMonths} />}
        {view==="levels" && biz && <PgManageLevels biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveLevels} />}
        {view==="customCard" && biz && <PgCustomCard biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveCard} />}
        {view==="theme" && biz && <PgTheme biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveAccent} />}
        {view==="icon" && biz && <PgIcon biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveIcon} />}
        {view==="export" && biz && <PgExport biz={biz} onBack={()=>setView("dashboard")} />}
        {view==="remind" && biz && <PgRemind biz={biz} onBack={()=>setView("dashboard")} />}
        {view==="announcements" && biz && <PgAnnouncements biz={biz} onBack={()=>setView("dashboard")} />}
        {view==="groups" && biz && <PgGroups biz={biz} onBack={()=>setView("dashboard")} />}
        {view==="manage" && biz && <PgManage biz={biz} onBack={()=>setView("dashboard")} onSaveTeacher={doSaveTeacher} onDeleteTeacher={doDeleteTeacher} onSaveGroup={doSaveGroup} onDeleteGroup={doDeleteGroup} />}
        {view==="registrations" && biz && <PgRegistrations biz={biz} onBack={()=>setView("dashboard")} onCreateLink={doCreateRegLink} onSetLinkActive={doSetRegLinkActive} onDeleteLink={doDeleteRegLink} onApprove={doApproveRegistration} onReject={doRejectRegistration} onUnreject={doUnrejectRegistration} />}
        </>}
        {toast && <div className={"toast t-"+toast.type}>{toast.msg}</div>}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
