<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Privacy Policy — PayStamp</title>
<style>html,body{margin:0;padding:0;background:#f7f8fa;}</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useMemo } = React;

/**
 * LegalPage — renders a markdown legal document (Privacy, Terms, or DPA).
 *
 * Usage:
 *   <LegalPage title="Privacy Policy" markdown={privacyMarkdown} onBack={() => navigate("/")} />
 *
 * Pass the .md file content as a string in `markdown`. A tiny built-in parser
 * handles the subset of markdown these documents use (# headings, **bold**,
 * - bullets, paragraphs). No external markdown library required.
 */
function LegalPage({ title, markdown, onBack }) {
  const blocks = useMemo(() => parseMarkdown(markdown), [markdown]);

  return (
    <div style={styles.page}>
      <div style={styles.container}>
        {onBack && (
          <button onClick={onBack} style={styles.back}>
            ← Back
          </button>
        )}
        <article style={styles.article}>
          {blocks.map((block, i) => renderBlock(block, i))}
        </article>
      </div>
    </div>
  );
}

/* ---------- minimal markdown parsing ---------- */

function parseMarkdown(md = "") {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  const blocks = [];
  let paragraph = [];
  let list = [];

  const flushParagraph = () => {
    if (paragraph.length) {
      blocks.push({ type: "p", text: paragraph.join(" ") });
      paragraph = [];
    }
  };
  const flushList = () => {
    if (list.length) {
      blocks.push({ type: "ul", items: [...list] });
      list = [];
    }
  };

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (!line.trim()) {
      flushParagraph();
      flushList();
      continue;
    }
    if (line.startsWith("# ")) {
      flushParagraph(); flushList();
      blocks.push({ type: "h1", text: line.slice(2) });
    } else if (line.startsWith("## ")) {
      flushParagraph(); flushList();
      blocks.push({ type: "h2", text: line.slice(3) });
    } else if (line.startsWith("### ")) {
      flushParagraph(); flushList();
      blocks.push({ type: "h3", text: line.slice(4) });
    } else if (/^[-*]\s+/.test(line)) {
      flushParagraph();
      list.push(line.replace(/^[-*]\s+/, ""));
    } else {
      flushList();
      paragraph.push(line);
    }
  }
  flushParagraph();
  flushList();
  return blocks;
}

// Inline **bold** -> <strong>, leaving the rest as text.
function renderInline(text) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith("**") && part.endsWith("**")) {
      return <strong key={i}>{part.slice(2, -2)}</strong>;
    }
    return <span key={i}>{part}</span>;
  });
}

function renderBlock(block, i) {
  switch (block.type) {
    case "h1":
      return <h1 key={i} style={styles.h1}>{renderInline(block.text)}</h1>;
    case "h2":
      return <h2 key={i} style={styles.h2}>{renderInline(block.text)}</h2>;
    case "h3":
      return <h3 key={i} style={styles.h3}>{renderInline(block.text)}</h3>;
    case "ul":
      return (
        <ul key={i} style={styles.ul}>
          {block.items.map((item, j) => (
            <li key={j} style={styles.li}>{renderInline(item)}</li>
          ))}
        </ul>
      );
    default:
      return <p key={i} style={styles.p}>{renderInline(block.text)}</p>;
  }
}

/* ---------- styles (inline so the component is drop-in) ---------- */

const styles = {
  page: {
    minHeight: "100vh",
    background: "#f7f8fa",
    padding: "32px 16px",
    boxSizing: "border-box",
  },
  container: {
    maxWidth: 720,
    margin: "0 auto",
  },
  back: {
    background: "none",
    border: "none",
    color: "#2563eb",
    fontSize: 15,
    cursor: "pointer",
    padding: "4px 0",
    marginBottom: 16,
  },
  article: {
    background: "#ffffff",
    borderRadius: 12,
    padding: "40px 36px",
    boxShadow: "0 1px 3px rgba(0,0,0,0.06)",
    color: "#1f2937",
    lineHeight: 1.65,
    fontSize: 16,
    fontFamily:
      "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif",
  },
  h1: { fontSize: 26, fontWeight: 700, margin: "0 0 8px", color: "#111827" },
  h2: { fontSize: 19, fontWeight: 600, margin: "28px 0 8px", color: "#111827" },
  h3: { fontSize: 16, fontWeight: 600, margin: "20px 0 6px", color: "#111827" },
  p: { margin: "0 0 14px" },
  ul: { margin: "0 0 14px", paddingLeft: 22 },
  li: { margin: "0 0 6px" },
};


const MARKDOWN = "# Privacy Policy\n\n**Last updated: 14 June 2026**\n\nThis Privacy Policy explains how PayStamp (\"we\", \"us\", \"the Service\"), operated by **Antonis Christodoulou, Cyprus** (\"the Operator\"), handles personal data when a lesson-based business (a \"Business\" — for example a swimming school, music school or sports club) uses PayStamp to manage student payment records.\n\nPayStamp is a tool that Businesses use to track which of their students have paid for lessons. **The Business that you are a customer of is the Data Controller** of your personal data. PayStamp acts as a **Data Processor**, storing and processing that data on the Business's behalf and under its instructions.\n\nIf you are a parent or student and have questions about your data, the first point of contact is the Business you deal with directly (for example, your child's swimming school).\n\n## 1. What data we process\n\nDepending on what the Business enters, PayStamp may store:\n\n- Student name (and, where the Business records it, a parent or guardian name)\n- The lessons or programme the student is enrolled in\n- Enrolment start month and any paused months\n- Payment records (which months have been confirmed as paid, in cash, by the Business owner)\n- A contact identifier for sending receipts (for example a phone number used for a WhatsApp or Viber message), where the Business chooses to use this feature\n- Language preference (English or Greek)\n\nPayStamp does **not** process payment card data or bank details. Payments are handled in cash directly between the parent and the Business; PayStamp only records that a payment was confirmed.\n\n## 2. Why we process it (legal basis)\n\nThe data is processed so that the Business can run its service — keeping track of enrolment and payments, and optionally sending payment receipts. The legal basis is the **performance of the contract** between the Business and its customers, and the **legitimate interests** of the Business in administering its lessons (Article 6(1)(b) and 6(1)(f) GDPR). The Operator processes this data only on the Business's instructions as a processor.\n\n## 3. Where data is stored\n\nData is stored in a database hosted in the **European Union (Frankfurt, Germany)** by our infrastructure provider, Supabase. Data is transmitted over encrypted connections (HTTPS/TLS). Access to records is restricted so that each Business can only see its own students' data.\n\n## 4. Who can see the data\n\n- The **Business owner** and any staff they authorise.\n- Where a parent portal is used, a **parent** can see the records relating to their own children.\n- The **Operator**, only where strictly necessary to maintain, support or secure the Service.\n- Our hosting **sub-processor** (Supabase), which stores the data on our behalf within the EU.\n\nWe do not sell personal data and we do not share it for advertising.\n\n## 5. How long we keep it\n\nData is retained for as long as the Business keeps its account active and needs the records for administering its lessons. When a Business deletes a student record, or closes its account, the associated data is deleted. A Business can request deletion of its data at any time.\n\n## 6. Your rights\n\nUnder the GDPR you have the right to access, correct, delete, restrict or object to the processing of your personal data, and the right to data portability. Because the Business is the Data Controller, please direct these requests to the Business you deal with. If you contact the Operator directly, we will pass the request to the relevant Business and assist them in responding.\n\nYou also have the right to lodge a complaint with the Cyprus data protection authority, the **Office of the Commissioner for Personal Data Protection** (www.dataprotection.gov.cy).\n\n## 7. Security\n\nWe apply appropriate technical and organisational measures to protect the data, including encrypted connections, access controls that isolate each Business's data, EU-based hosting, and regular review of our security configuration. No system connected to the internet can be guaranteed to be completely secure, but we work to keep the risk low and to respond promptly to any issue.\n\n## 8. Changes to this policy\n\nWe may update this Privacy Policy from time to time. The \"Last updated\" date at the top shows when it was last changed.\n\n## 9. Contact\n\nFor questions about this policy or about how PayStamp handles data, contact:\n**paystampapp@gmail.com**\n";
ReactDOM.createRoot(document.getElementById("root")).render(
  <LegalPage title="Privacy Policy" markdown={MARKDOWN} onBack={()=>{ window.location.href = "/"; }} />
);
</script>
</body>
</html>
