function PgParentAuth({ onBack }) {
  const [tab, setTab] = useState("login");
  const [email, setEmail] = useState("");
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);
  async function go() {
    setErr(""); setInfo("");
    if (!email.trim()||!email.includes("@")) { setErr("Enter a valid email."); return; }
    if (!pwd) { setErr("Enter your password."); return; }
    if (tab==="register" && pwd.length<6) { setErr("Password must be at least 6 characters."); return; }
    setBusy(true);
    if (tab==="login") {
      const { error } = await sb.auth.signInWithPassword({ email:email.trim(), password:pwd });
      setBusy(false);
      if (error) { setErr(error.message); return; }
    } else {
      const { error } = await sb.auth.signUp({ email:email.trim(), password:pwd, options:{ data:{ role:"parent" } } });
      setBusy(false);
      if (error) { setErr(error.message); return; }
      setInfo("Account created. Check your email to confirm, then log in.");
      setTab("login"); setPwd("");
    }
  }
  return (
    <div className="login-page">
      <button className="tb-back" style={{marginBottom:16}} onClick={onBack}>← Back</button>
      <h1>Family Account</h1>
      <p>Log in to see all your children's cards in one place.</p>
      <div style={{display:"flex",gap:8,marginBottom:18}}>
        {[["login","Log In"],["register","Sign Up"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setTab(v);setErr("");setInfo("");}} style={{flex:1,padding:"10px",borderRadius:12,border:"1px solid "+(tab===v?"var(--violet)":"var(--border)"),background:tab===v?"var(--violet)":"var(--bg2)",color:tab===v?"#fff":"var(--text2)",fontFamily:"var(--f)",fontWeight:800,fontSize:".82rem",cursor:"pointer",textTransform:"uppercase",letterSpacing:".1em"}}>{l}</button>
        ))}
      </div>
      <div className="ig"><label>Email</label>
        <input className="inp" type="email" placeholder="you@example.com" value={email}
          onChange={e=>{setEmail(e.target.value);setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&go()} /></div>
      <div className="ig"><label>Password</label>
        <input className="inp" type="password" placeholder={tab==="register"?"At least 6 characters":"Your password"} value={pwd}
          onChange={e=>{setPwd(e.target.value);setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&go()} /></div>
      {err && <div className="err">{err}</div>}
      {info && <div className="info-box" style={{marginBottom:12}}>{info}</div>}
      <button className="btn" onClick={go} disabled={busy}>{busy?"…":(tab==="login"?"Log In":"Create Account")}</button>
      <p style={{fontSize:".72rem",color:"var(--text2)",textAlign:"center",marginTop:18,lineHeight:1.5}}>By continuing, you acknowledge our <a href="/privacy" style={{color:"var(--violet-glow)"}}>Privacy Policy</a> and <a href="/terms" style={{color:"var(--violet-glow)"}}>Terms of Service</a>.</p>
    </div>
  );
}

function PgLinkChild({ onBack, onLink, kids, onAssign, onCreateChild }) {
  const [code, setCode] = useState("");
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [linked, setLinked] = useState(null);
  const [newChild, setNewChild] = useState("");
  async function doLink() {
    if (!code.trim()) { setErr("Enter the share code."); return; }
    if (!pin) { setErr("Enter the PIN."); return; }
    setBusy(true); setErr("");
    const res = await onLink(code.trim(), pin);
    setBusy(false);
    if (res && res.locked) { setErr("Too many attempts. Try again in 15 minutes."); return; }
    if (res && res.error) { setErr("Please log in again."); return; }
    if (!res || !res.ok) { setErr("Wrong code or PIN."); return; }
    setLinked({ cardId: res.card_id, name: res.name || "Card" });
  }
  async function assignTo(childId) { if (linked) await onAssign(linked.cardId, childId); onBack(); }
  async function createAndAssign() {
    if (!newChild.trim()) return;
    const c = await onCreateChild(newChild.trim());
    if (c && c.id && linked) await onAssign(linked.cardId, c.id);
    onBack();
  }
  if (linked) {
    return (
      <div className="reg-page">
        <h2 style={{marginBottom:6}}>Card Linked</h2>
        <p>Assign <strong style={{color:"var(--text)"}}>{linked.name}</strong> to a child? Optional.</p>
        {kids.length>0 && (
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18}}>
            {kids.map(k=>(
              <button key={k.id} onClick={()=>assignTo(k.id)} style={{padding:"10px 16px",borderRadius:20,border:"1px solid var(--violet)",background:"var(--bg2)",color:"#fff",fontFamily:"var(--f)",fontWeight:700,fontSize:".85rem",cursor:"pointer"}}>{k.name}</button>
            ))}
          </div>
        )}
        <div className="ig"><label>Or create a new child</label>
          <div style={{display:"flex",gap:8}}>
            <input className="inp" style={{flex:1}} placeholder="Child name" value={newChild} onChange={e=>setNewChild(e.target.value)} />
            <button className="btn" style={{width:"auto",padding:"0 22px",marginTop:0}} onClick={createAndAssign}>Add</button>
          </div>
        </div>
        <button className="btn-ghost" onClick={()=>onBack()}>Skip — leave Unassigned</button>
      </div>
    );
  }
  return (
    <div className="reg-page">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <button className="tb-back" onClick={onBack}>←</button>
        <h2>Link a Child</h2>
      </div>
      <div className="info-box" style={{marginBottom:20}}>Enter the share code and PIN your child's teacher gave you.</div>
      <div className="ig"><label>Share Code</label>
        <input className="inp" placeholder="e.g. AQ3RG0" value={code}
          onChange={e=>{setCode(e.target.value.toUpperCase());setErr("");}} /></div>
      <div className="ig"><label>PIN</label>
        <input className="inp" type="password" inputMode="numeric" placeholder="4-digit PIN" maxLength={4} value={pin}
          onChange={e=>{setPin(e.target.value.replace(/\D/g,"").slice(0,4));setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&doLink()} /></div>
      {err && <div className="err">{err}</div>}
      <button className="btn" style={{marginTop:8}} onClick={doLink} disabled={busy}>{busy?"…":"Link Card"}</button>
    </div>
  );
}

function PgParentDashboard({ items, kids, onLink, onUnlink, onAssign, onCreateChild, onRenameChild, onDeleteChild, onLogout, onTeacher }) {
  const [expanded, setExpanded] = useState({});
  const [openGroups, setOpenGroups] = useState({});
  const [manage, setManage] = useState(false);
  const [newChild, setNewChild] = useState("");
  const [renaming, setRenaming] = useState(null);
  // Reuse the existing stacking logic (billableMi/billableCount/monthsPaid/totalPaid).
  const rows = items.map(it => {
    const biz = it.biz, card = it.card;
    const year = biz.year || new Date().getFullYear();
    const inactive = (biz.inactiveMonths || []).concat(card.pausedMonths || []);
    const es = card.enrollmentStart || null;
    const pmts = card.payments || {};
    const nowym = nowYM();
    let behind = false;
    for (let mi=0; mi<12; mi++) {
      if (billableMi(mi, year, inactive, es) && ymOf(year,mi) <= nowym && !(pmts[ymOf(year,mi)]||{}).paid) { behind = true; break; }
    }
    return { it, biz, card, childId:it.childId, pal:getPal(biz.type), mp:monthsPaid(pmts, year, inactive, es), bc:billableCount(year, inactive, es), paid:totalPaid(pmts, card.history||[]), behind };
  });
  rows.sort((a,b)=> a.behind===b.behind ? 0 : (a.behind ? -1 : 1));
  const need = rows.filter(r=>r.behind).length;
  const childIds = kids.map(k=>k.id);
  const assignedCount = rows.filter(r=>r.childId && childIds.includes(r.childId)).length;
  const grouped = kids.length>0 && assignedCount>0;

            <div style={{fontSize:"1rem",fontWeight:700,color:"#fff",marginBottom:2}}>{r.card.name}</div>

                {kids.map(k=>(
                  <button key={k.id} onClick={()=>onAssign(r.it.cardId, k.id)} style={{padding:"6px 12px",borderRadius:20,border:"1px solid "+(r.childId===k.id?"var(--violet)":"var(--border)"),background:r.childId===k.id?"var(--violet)":"var(--bg2)",color:r.childId===k.id?"#fff":"var(--text2)",fontFamily:"var(--f)",fontSize:".72rem",fontWeight:700,cursor:"pointer"}}>{k.name}</button>

                  <>
                    <div style={{flex:1,fontWeight:700,fontSize:".9rem"}}>{k.name}</div>
                    <button onClick={()=>setRenaming({id:k.id,name:k.name})} style={{padding:"6px 10px",borderRadius:8,border:"1px solid var(--border)",background:"transparent",color:"var(--text2)",fontFamily:"var(--f)",fontWeight:700,fontSize:".72rem",cursor:"pointer"}}>Rename</button>
                    <button onClick={()=>{ if(window.confirm("Delete child "+k.name+"? Their cards become Unassigned. Cards are not deleted.")) onDeleteChild(k.id); }} style={{padding:"6px 10px",borderRadius:8,border:"1px solid var(--border)",background:"transparent",color:"var(--red)",fontFamily:"var(--f)",fontWeight:700,fontSize:".72rem",cursor:"pointer"}}>Delete</button>
                  </>
                )}
              </div>
            ))}
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <input className="ws-inp" style={{flex:1}} placeholder="New child name" value={newChild} onChange={e=>setNewChild(e.target.value)} />
              <button onClick={async()=>{ if(newChild.trim()){ await onCreateChild(newChild.trim()); setNewChild(""); } }} style={{padding:"0 18px",borderRadius:12,border:"none",background:"var(--violet)",color:"#fff",fontFamily:"var(--f)",fontWeight:700,fontSize:".82rem",cursor:"pointer"}}>Add</button>
            </div>
          </div>
        )}

        {rows.length===0
          ? <div className="empty">No cards linked yet. Tap "+ Link".</div>
          : !grouped
            ? rows.map(renderRow)
            : <>
                {kids.map(k=>{ const sec=rows.filter(r=>r.childId===k.id); return sec.length>0 ? renderSection(k.id, k.name, sec) : null; })}
                {unassigned.length>0 ? renderSection("unassigned", "Unassigned", unassigned) : null}
              </>
        }
      </div>
    </div>
  );
}

function PgPending({ email, onLogout }) {
  return (
    <div className="login-page" style={{display:"flex",flexDirection:"column",justifyContent:"center",minHeight:"100vh",textAlign:"center",padding:"40px 28px"}}>
      <div style={{width:80,height:80,borderRadius:24,background:"rgba(99,102,241,.12)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"2.4rem",margin:"0 auto 22px"}}>⏳</div>
      <h1 style={{marginBottom:12}}>Pending approval</h1>
      <p style={{lineHeight:1.7,color:"var(--text2)",fontWeight:500}}>Your account is pending approval — you'll get access once it's approved.{email?(" Signed in as "+email+"."):""}</p>
      <button className="btn-ghost" style={{marginTop:30}} onClick={onLogout}>Log out</button>
    </div>
  );
}

function PgRejected({ onLogout }) {
  return (
    <div className="login-page" style={{display:"flex",flexDirection:"column",justifyContent:"center",minHeight:"100vh",textAlign:"center",padding:"40px 28px"}}>
      <div style={{width:80,height:80,borderRadius:24,background:"var(--bg2)",border:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"2.2rem",margin:"0 auto 22px"}}>🔒</div>
      <h1 style={{marginBottom:12}}>Access not available</h1>
      <p style={{lineHeight:1.7,color:"var(--text2)",fontWeight:500}}>This account does not currently have access.</p>
      <button className="btn-ghost" style={{marginTop:30}} onClick={onLogout}>Log out</button>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [db, setDb] = useState({businesses:{}});
  const [view, setView] = useState("landing");
  const [bizId, setBizId] = useState(null);
  const [cardId, setCardId] = useState(null);
  const [revealCard, setRevealCard] = useState(null);
  const [toast, setToast] = useState(null);
  const [bizLoaded, setBizLoaded] = useState(false);
  const [myCards, setMyCards] = useState([]);
  const [children, setChildren] = useState([]);
  const [dashFilter, setDashFilter] = useState("all");
  const [dashSort, setDashSort] = useState("name");
  const [approval, setApproval] = useState(null);
  const [mode, setMode] = useState("teacher");

  const pop = (msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2800);};

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{ setSession(data.session); }).catch(()=>{}).finally(()=>{ setAuthReady(true); });
    const { data: sub } = sb.auth.onAuthStateChange((_e,s)=>{ setSession(s); setAuthReady(true); });
    return ()=>{ sub.subscription.unsubscribe(); };
  },[]);

  async function loadInto() {
    let b = await loadMyBusiness();
    if (!b) {
      const rawp = localStorage.getItem("pending_biz");
      if (rawp) {
        try {
          const pv = JSON.parse(rawp);
          await sb.from("businesses").insert({ biz_code:genBizId(), name:pv.name, type:pv.type, fee:+pv.fee, year:new Date().getFullYear(), contact_email:pv.email, inactive_months:[], levels:[] });
          localStorage.removeItem("pending_biz");
          b = await loadMyBusiness();
        } catch(e){}
      }
    }
    if (b) { setDb({businesses:{[b.id]:b}}); setBizId(b.id); }
    return b;
  }

  useEffect(()=>{
    if (!session) { setDb({businesses:{}}); setBizId(null); setMyCards([]); setMode("teacher"); setApproval(null); setBizLoaded(false); return; }
    setBizLoaded(false);
    (async()=>{
      try {
        const role = session.user && session.user.user_metadata && session.user.user_metadata.role;
        let b = null;
        if (role === "parent") {
          setApproval("approved"); // parents are not gated
        } else {
          // Admin approval gate. This effect only runs once a user is
          // authenticated (it early-returns above when !session), so the
          // status check NEVER runs before auth. It also fails OPEN: only an
          // explicit 'pending'/'rejected' shows the gate — any other result
          // (approved, no business yet, or an RPC error) loads the app, so a
          // hiccup can never black-screen or lock out a logged-in user.
          let status = await loadMyApproval();
          if (status === "pending" || status === "rejected") {
            setApproval(status);
          } else {
            b = await loadInto();                 // approved / no-biz-yet / unknown → load
            if (status === null) {                // a brand-new signup may have lazily created a pending biz
              const recheck = await loadMyApproval();
              status = (recheck === "pending" || recheck === "rejected") ? recheck : "approved";
            } else {
              status = "approved";
            }
            setApproval(status);
          }
        }
        const links = await loadMyCards();
        setMyCards(links);
        try { setChildren(await loadMyChildren()); } catch(e){ setChildren([]); }
        let m;
        if (role === "parent") m = "parent";
        else if (b) m = "teacher";
        else if (links.length > 0) m = "parent";
        else m = "teacher";
        setMode(m);
        setView(v=>(v==="landing"||v==="login"||v==="register"||v==="forgot"||v==="parentAuth")
          ? (m==="parent" ? "parentDash" : "dashboard") : v);
      } catch(e){ pop(e.message||"Load failed","err"); }
      finally { setBizLoaded(true); }
    })();
  },[session]);

  const biz = bizId ? db.businesses[bizId] : null;
  const card = biz && cardId ? biz.cards[cardId] : null;

  async function refresh(){ try{ const b=await loadMyBusiness(); if(b){setDb({businesses:{[b.id]:b}});} }catch(e){} }

  async function doLogout(){ await sb.auth.signOut(); setBizId(null); setDb({businesses:{}}); setMyCards([]); setChildren([]); setDashFilter("all"); setDashSort("name"); setApproval(null); setMode("teacher"); setView("landing"); }

  async function refreshChildren(){ try { setChildren(await loadMyChildren()); } catch(e){} }
  async function doCreateChild(name){
    const { data, error } = await sb.rpc("create_child", { p_name: name });
    if (error) { pop(error.message,"err"); return null; }
    await refreshChildren();
    return (data && data.ok) ? data : null;
  }
  async function doRenameChild(id, name){
    const { error } = await sb.rpc("rename_child", { p_id:id, p_name:name });
    if (error) { pop(error.message,"err"); return; }
    await refreshChildren();
  }
  async function doDeleteChild(id){
    const { error } = await sb.rpc("delete_child", { p_id:id });
    if (error) { pop(error.message,"err"); return; }
    await refreshChildren(); await refreshMyCards();
  }
  async function doAssignCard(cardId, childId){
    const { error } = await sb.rpc("assign_card", { p_card_id:cardId, p_child_id:childId });
    if (error) { pop(error.message,"err"); return; }
    await refreshMyCards();
  }

  async function refreshMyCards(){ try { const items = await loadMyCards(); setMyCards(items); } catch(e){} }
  async function doLinkChild(code, pin){
    const { data, error } = await sb.rpc("link_card", { p_code: code, p_pin: pin });
    if (error) return { error: error.message };
    if (data && data.ok) { await refreshMyCards(); pop("Linked "+(data.name||"card")+"!"); }
    return data || { ok:false };
  }
  async function doUnlinkCard(cardId, name){
    if (!window.confirm("Unlink "+(name||"this card")+"?")) return;
    const { error } = await sb.rpc("unlink_card", { p_card_id: cardId });
    if (error) { pop(error.message,"err"); return; }
    await refreshMyCards(); pop("Unlinked");
  }

  function onRegistered(res){
    if (res && res.needsConfirm){ pop("Check your email to confirm, then log in."); setView("login"); }
    else if (res && res.bizCode){ pop("Business created! Code: "+res.bizCode); }
  }

  async function afterBizCreated(code){
    // New accounts are created 'pending' — show the approval gate, not the app.
    setBizLoaded(false);
    try {
      const status = await loadMyApproval();
      setApproval(status);
      if (status === "approved") { const b = await loadInto(); if (b) setView("dashboard"); }
      else { pop("Account created — pending approval."); }
    } catch(e){ pop(e.message||"Load failed","err"); }
    finally { setBizLoaded(true); }
  }

  async function doAddCard(data){
    if(!data.name.trim()){ pop("Enter a name","err"); return; }
    const shareCode=genShareCode(), pin=genPin();
    const { data: ins, error } = await sb.from("cards").insert({ business_id:bizId, name:data.name.trim(), level:data.level||null, share_code:shareCode, pin, phone:data.phone||null, preferred_channel:data.preferredChannel||"whatsapp", language:data.language||"EN", enrollment_start_month:data.enrollmentStart||null, payments:{}, history:[] }).select("id").single();
    if(error){ pop(error.message,"err"); return; }
    const newCard={id:ins.id,name:data.name.trim(),level:data.level||null,shareCode,pin,phone:data.phone||"",preferredChannel:data.preferredChannel||"whatsapp",language:data.language||"EN",enrollmentStart:data.enrollmentStart||null,pausedMonths:[],feeHistory:[],payments:{},history:[]};
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards:{...d.businesses[bizId].cards,[ins.id]:newCard}}}}));
    setRevealCard(newCard); setView("reveal");
  }

  async function doUpdateCard(updates){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards:{...d.businesses[bizId].cards,[cardId]:{...d.businesses[bizId].cards[cardId],...updates}}}}}));
    const patch={};
    if("payments" in updates) patch.payments=updates.payments;
    if("history" in updates) patch.history=updates.history;
    if("level" in updates) patch.level=updates.level;
    if("phone" in updates) patch.phone=updates.phone;
    if("preferredChannel" in updates) patch.preferred_channel=updates.preferredChannel;
    if("language" in updates) patch.language=updates.language;
    if("enrollmentStart" in updates) patch.enrollment_start_month=updates.enrollmentStart;
    if("pausedMonths" in updates) patch.paused_months=updates.pausedMonths;
    if("feeHistory" in updates) patch.fee_history=updates.feeHistory;
    const { error } = await sb.from("cards").update(patch).eq("id",cardId);
    if(error){ pop(error.message,"err"); refresh(); }
  }

  async function doRemoveCard(){
    if(!window.confirm("Remove this student?")) return;
    const id=cardId;
    setDb(d=>{const cards={...d.businesses[bizId].cards};delete cards[id];return {businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards}}};});
    setView("dashboard");
    const { error } = await sb.from("cards").delete().eq("id",id);
    if(error){pop(error.message,"err");} else {pop("Student removed");}
  }

  async function doSaveMonths(inactive){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],inactiveMonths:inactive}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({inactive_months:inactive}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop("Months saved!");}
  }
  async function doSaveLevels(levels){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],levels}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({levels}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop("Levels saved!");}
  }
  async function doSaveCard(img){
    let url=img;
    if (img && img.indexOf("data:")===0){
      try{
        const blob = await (await fetch(img)).blob();
        const path = bizId+"/card-"+Date.now();
        const { error: ue } = await sb.storage.from("card-images").upload(path, blob, {upsert:true, contentType:blob.type||"image/png"});
        if(ue) throw ue;
        url = sb.storage.from("card-images").getPublicUrl(path).data.publicUrl;
      }catch(e){ pop(e.message||"Upload failed","err"); return; }
    }
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],customCardImage:url}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({custom_card_image:url}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop(url?"Card image saved!":"Image removed");}
  }

  return (
    <>
      <style>{CSS}</style>
      <div className={"app"+(view==="dashboard"?" app--wide":"")}>
        {!authReady ? <div className="empty" style={{paddingTop:80}}>Loading…</div>
         : session && !bizLoaded ? <div className="empty" style={{paddingTop:80}}>Loading…</div>
         : session && approval==="pending" ? <PgPending email={session.user&&session.user.email} onLogout={doLogout} />
         : session && approval==="rejected" ? <PgRejected onLogout={doLogout} />
         : session && mode==="parent" ? (view==="linkChild"
             ? <PgLinkChild onBack={()=>setView("parentDash")} onLink={doLinkChild} kids={children} onAssign={doAssignCard} onCreateChild={doCreateChild} />
             : <PgParentDashboard items={myCards} kids={children} onLink={()=>setView("linkChild")} onUnlink={doUnlinkCard} onAssign={doAssignCard} onCreateChild={doCreateChild} onRenameChild={doRenameChild} onDeleteChild={doDeleteChild} onLogout={doLogout} onTeacher={biz?(()=>{setMode("teacher");setView("dashboard");}):null} />)
         : session && bizLoaded && !biz ? <PgCreateBusiness email={session.user&&session.user.email} onCreated={afterBizCreated} onLogout={doLogout} />
         : <>
        {view==="landing" && <PgLanding onTeacher={()=>setView(session?"dashboard":"login")} onParent={()=>setView("parentAuth")} onStudent={()=>setView("student")} />}
        {view==="login" && <PgLogin onLogin={()=>{}} onBack={()=>setView("landing")} onRegister={()=>setView("register")} onForgot={()=>setView("forgot")} />}
        {view==="forgot" && <PgForgot onBack={()=>setView("login")} />}
        {view==="register" && <PgRegister onBack={()=>setView("login")} onCreated={onRegistered} />}
        {view==="student" && <PgStudent onBack={()=>setView("landing")} />}
        {view==="parentAuth" && <PgParentAuth onBack={()=>setView("landing")} />}
        {view==="dashboard" && biz && <PgDashboard biz={biz} onCard={id=>{setCardId(id);setView("card");}} onAdd={()=>setView("addCard")} onMonths={()=>setView("months")} onLevels={()=>setView("levels")} onCustomCard={()=>setView("customCard")} onExport={()=>setView("export")} onRemind={()=>setView("remind")} onFamily={()=>{setMode("parent");setView("parentDash");}} showFamily={myCards.length>0} onLogout={doLogout} levelFilter={dashFilter} setLevelFilter={setDashFilter} sort={dashSort} setSort={setDashSort} />}
        {view==="addCard" && biz && <PgAddCard biz={biz} onBack={()=>setView("dashboard")} onCreate={doAddCard} />}
        {view==="reveal" && revealCard && <PgReveal card={revealCard} onDone={()=>{setRevealCard(null);setView("dashboard");}} />}
        {view==="card" && biz && card && <PgCard biz={biz} card={card} onBack={()=>setView("dashboard")} onUpdate={doUpdateCard} onRemove={doRemoveCard} />}
        {view==="months" && biz && <PgManageMonths biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveMonths} />}
        {view==="levels" && biz && <PgManageLevels biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveLevels} />}
        {view==="customCard" && biz && <PgCustomCard biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveCard} />}
        {view==="export" && biz && <PgExport biz={biz} onBack={()=>setView("dashboard")} />}
        {view==="remind" && biz && <PgRemind biz={biz} onBack={()=>setView("dashboard")} />}
        </>}
        {toast && <div className={"toast t-"+toast.type}>{toast.msg}</div>}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
