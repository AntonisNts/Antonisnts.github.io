  return await new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      const s = Math.min(1, (maxEdge||1280) / Math.max(w, h));
      w = Math.max(1, Math.round(w*s)); h = Math.max(1, Math.round(h*s));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      cv.toBlob(b => { b ? resolve(b) : reject(new Error("Image compression failed")); }, "image/jpeg", quality||0.7);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read image")); };
    img.src = url;
  });
}

/* ===================== Family portal =======================================
   Scoped to this one page. The rest of the app keeps --bg/--bg2 until the
   other portals follow, so nothing here can recolour the business dashboard
   or the student portal by accident.

   The live page painted four backgrounds in three hues — and the notes boxes
   were a purple gradient while the cards beside them were flat, which is what
   made the dark read as muddy rather than deep. One neutral charcoal family
   here: ground, card, and a slightly raised strip. Five type sizes, not
   fourteen. */
.page.fam{
  --fam-bg:#0B0B0C; --fam-card:#161618; --fam-raise:#1D1D20;
  --fam-line:rgba(255,255,255,.07); --fam-line2:rgba(255,255,255,.045);
  --fam-t1:#F6F6F5; --fam-t2:#A3A3A9; --fam-t3:#6F6F77; --fam-ok:#4FD1A5;
  background:var(--fam-bg);min-height:100vh;color:var(--fam-t1);
  font-variant-numeric:tabular-nums;
}
.fam .topbar{padding:18px 18px 20px;gap:10px;}
.fam .topbar h2{font-size:1.06rem;font-weight:600;letter-spacing:-.01em;flex:1;}
.fam .tb-act{
  width:32px;height:32px;border-radius:99px;background:var(--fam-card);
  border:1px solid var(--fam-line);color:var(--fam-t2);font-size:.8rem;
  display:flex;align-items:center;justify-content:center;padding:0;flex:none;
}
.fam .fam-out{
  background:transparent;border:1px solid var(--fam-line);border-radius:99px;
  color:var(--fam-t2);padding:7px 14px;font-family:var(--f);font-size:.82rem;
  font-weight:500;cursor:pointer;flex:none;white-space:nowrap;
}
.fam .sec-title{font-size:.7rem;font-weight:600;color:var(--fam-t3);letter-spacing:.14em;}
.fam .empty{color:var(--fam-t3);}

/* The amount is the message. It had a box, a border, and a full-width filled
   button under it for an action the app cannot actually perform. */
.fam-due{padding:0 2px 20px;border-bottom:1px solid var(--fam-line2);margin-bottom:20px;}
.fam-due-lbl{
  display:block;font-size:.7rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fam-t3);margin-bottom:7px;
}
.fam-due-line{display:flex;align-items:flex-end;gap:12px;}
.fam-due-amt{font-size:2.6rem;font-weight:600;letter-spacing:-.035em;line-height:.92;color:var(--owed);}
.fam-due-who{flex:1;min-width:0;font-size:.82rem;color:var(--fam-t2);line-height:1.35;padding-bottom:3px;overflow-wrap:anywhere;}
.fam-due-who b{display:block;color:var(--fam-t1);font-weight:600;}
.fam-acts{display:flex;align-items:center;gap:18px;margin-top:16px;flex-wrap:wrap;}
.fam-link{
  background:none;border:none;padding:0 0 2px;font-family:var(--f);font-size:.82rem;
  font-weight:600;color:var(--fam-t1);border-bottom:1px solid var(--fam-t3);cursor:pointer;
}
.fam-link.quiet{color:var(--fam-t2);border-bottom-color:var(--fam-line);}
.fam-fine{font-size:.7rem;color:var(--fam-t3);line-height:1.5;margin-top:14px;max-width:36ch;}

.fam-pill{
  background:transparent;border:1px solid var(--fam-line);border-radius:99px;padding:6px 13px;
  font-family:var(--f);font-size:.76rem;font-weight:600;color:var(--fam-t2);cursor:pointer;white-space:nowrap;
}
.fam-pill.solid{background:var(--fam-t1);border-color:var(--fam-t1);color:#0B0B0C;}

/* One child, one object: name, school, progress, and their latest note. The
   note strip used to be a separate floating box, which is why it read as an
   unloaded element rather than as part of anything. */
.fam-kid{background:var(--fam-card);border:1px solid var(--fam-line);border-radius:18px;margin-bottom:12px;overflow:hidden;}
.fam-kid-main{display:flex;align-items:center;gap:14px;padding:15px 16px 14px;cursor:pointer;}
.fam-kid-mid{flex:1;min-width:0;}
.fam-kid-name{font-size:1.06rem;font-weight:600;letter-spacing:-.012em;line-height:1.25;overflow-wrap:anywhere;}
.fam-kid-school{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--fam-t2);margin-top:3px;overflow-wrap:anywhere;}
.fam-dot{width:7px;height:7px;border-radius:99px;flex:none;}
.fam-kid-amt{font-size:1.35rem;font-weight:600;color:var(--owed);line-height:1;letter-spacing:-.02em;text-align:right;}
.fam-kid-amt u{display:block;text-decoration:none;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:5px;opacity:.85;}
.fam-ok{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--fam-t2);font-weight:500;white-space:nowrap;}
/* A row is a way in now, so it says so: a chevron, and — where there is
   something they have not read on the page behind it — one dot. */
.fam-chev{color:var(--fam-t3);font-size:1.3rem;font-weight:400;line-height:1;flex:none;}
.fam-push{background:var(--fam-bg2,var(--bg2));border:1px solid var(--fam-line2,var(--border));border-radius:16px;padding:16px;margin-bottom:16px;}
.fam-push-t{font-size:.9rem;font-weight:700;color:var(--fam-t1,var(--text));margin-bottom:6px;}
.fam-push-b{font-size:.8rem;color:var(--fam-t2,var(--text2));line-height:1.6;}
.fam-unread{width:8px;height:8px;border-radius:99px;background:var(--accent);flex:none;}
.fam-ok::before{
  content:"";width:15px;height:15px;border-radius:99px;flex:none;border:1.5px solid var(--fam-ok);opacity:.75;
  background:
    linear-gradient(45deg,transparent 46%,var(--fam-ok) 46%,var(--fam-ok) 60%,transparent 60%) no-repeat 3px 6px/5px 5px,
    linear-gradient(-45deg,transparent 46%,var(--fam-ok) 46%,var(--fam-ok) 60%,transparent 60%) no-repeat 5px 4px/7px 7px;
}
/* This product IS a stamp card. "1/7 months" makes a parent do arithmetic; a
   row of seven marks with one filled says it before it is read — and puts the
   school's colour somewhere legible, which a 10px uppercase caption was not. */
.fam-track{display:flex;gap:3px;padding:0 16px 14px;}
.fam-track i{height:4px;border-radius:99px;flex:1;background:rgba(255,255,255,.08);}
.fam-track i.on{background:var(--fam-paid,var(--fam-t2));opacity:.9;}
.fam-foot{display:flex;align-items:center;gap:9px;padding:11px 16px;border-top:1px solid var(--fam-line2);background:var(--fam-raise);cursor:pointer;}
.fam-foot-k{font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fam-t3);flex:none;}
.fam-foot-p{flex:1;min-width:0;font-size:.82rem;color:var(--fam-t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fam-foot-n{flex:none;font-size:.68rem;font-weight:700;color:#0B0B0C;background:var(--fam-t2);border-radius:99px;padding:1px 7px;}
.fam-foot-c{flex:none;color:var(--fam-t3);font-size:.78rem;}
.fam-note{border-top:1px solid var(--fam-line2);padding:12px 16px;cursor:pointer;background:var(--fam-raise);}
.fam-note-t{font-size:.86rem;line-height:1.35;overflow-wrap:anywhere;}
.fam-note-m{font-size:.7rem;color:var(--fam-t3);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.fam-note-b{font-size:.82rem;color:var(--fam-t2);line-height:1.5;white-space:pre-wrap;margin-top:8px;overflow-wrap:anywhere;}
.fam-tag{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--fam-line);border-radius:6px;padding:1px 6px;}
.fam-more{width:100%;text-align:left;background:var(--fam-raise);border:none;border-top:1px solid var(--fam-line2);padding:11px 16px;font-family:var(--f);font-size:.76rem;font-weight:600;color:var(--fam-t2);cursor:pointer;}
/* A child with several cards keeps a heading — that is where it earns its
   place, because it carries their combined total. */
.fam-sec-head{display:flex;align-items:center;gap:8px;padding:10px 4px;cursor:pointer;}
.fam-sec-head b{font-size:.88rem;font-weight:600;color:var(--fam-t1);}
.fam-sec-head span{font-size:.76rem;font-weight:500;color:var(--fam-t3);}
.fam-sec-head em{font-style:normal;font-size:.76rem;font-weight:600;color:var(--owed);}
.fam-sec-head i{margin-left:auto;font-style:normal;color:var(--fam-t3);font-size:.78rem;}
/* The details panel: what the total is made of, and who is clear. */
.fam-det{padding:13px 0 12px;border-bottom:1px solid var(--fam-line2);}
.fam-det:last-child{border-bottom:none;padding-bottom:2px;}
.fam-det-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.fam-det-nm{font-size:.88rem;font-weight:600;color:var(--fam-t1);overflow-wrap:anywhere;}
.fam-det-sch{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--fam-t3);margin-top:2px;overflow-wrap:anywhere;}
.fam-det-amt{font-size:.88rem;font-weight:600;color:var(--owed);flex:none;}
.fam-det-ok{font-size:.78rem;color:var(--fam-t2);flex:none;}
.fam-det-note{font-size:.76rem;color:var(--fam-t3);padding:6px 0 0 14px;}
.fam-mth{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0 0 14px;}
.fam-mth-nm{font-size:.82rem;color:var(--fam-t2);}
.fam-mth-part{font-size:.7rem;color:var(--fam-t3);margin-left:7px;}
.fam-mth-amt{font-size:.82rem;font-weight:600;color:var(--owed);flex:none;}

/* ===================== Student portal =====================================
   Scoped to .page.stu, the same way the family portal is scoped to .page.fam,
   and on the same tokens — so the two screens outside the school office match.
   The business dashboard is deliberately left on --bg/--bg2.

   Both panels here were --surface, a gradient running #14172A -> #0A0C16:
   blue 22 points ahead of red at the top, which is the cast they carried
   against the near-black ground. Flat charcoal now. */
.page.stu{
  --stu-bg:#0B0B0C; --stu-card:#161618; --stu-raise:#1D1D20;
  --stu-line:rgba(255,255,255,.07); --stu-line2:rgba(255,255,255,.045);
  --stu-t1:#F6F6F5; --stu-t2:#A3A3A9; --stu-t3:#6F6F77;
  background:var(--stu-bg);min-height:100vh;color:var(--stu-t1);
  font-variant-numeric:tabular-nums;
}
.stu .topbar h2{font-weight:600;letter-spacing:-.01em;}
/* Padding moves off the panel and onto the rows, so a divider can run the full
   width of the card instead of floating inside it. */
.stu .wsec{
  background:var(--stu-card);border:1px solid var(--stu-line);border-radius:18px;
  padding:0;margin:0 16px 12px;overflow:hidden;
}
.stu .ws-t{
  display:flex;align-items:center;gap:8px;margin:0;padding:13px 16px 12px;
  font-size:.7rem;font-weight:600;letter-spacing:.14em;color:var(--stu-t3);
}
/* One count on the heading, rather than a NEW pill on every row — a badge that
   marks all of them marks none of them. */
.stu-new{
  margin-left:auto;letter-spacing:0;text-transform:none;
  font-size:.7rem;font-weight:700;color:var(--accent-ink);background:var(--accent);
  border-radius:99px;padding:1px 7px;
}
.stu-ann{border-top:1px solid var(--stu-line2);padding:12px 16px;}
.stu-ann-t{font-size:.88rem;font-weight:500;color:var(--stu-t2);line-height:1.35;overflow-wrap:anywhere;}
.stu-ann.unread .stu-ann-t{font-weight:600;color:var(--stu-t1);}
.stu-ann-m{font-size:.7rem;color:var(--stu-t3);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.stu-tag{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--stu-line);border-radius:6px;padding:1px 6px;}
.stu-dot{width:6px;height:6px;border-radius:99px;background:var(--accent);flex:none;}
.stu-ann-b{font-size:.82rem;color:var(--stu-t2);line-height:1.5;white-space:pre-wrap;margin-top:7px;overflow-wrap:anywhere;}
/* Was centred, accent-coloured and heavier than the titles above it: the
   loudest thing in the card for the least important action in it. */
.stu-more{
  display:block;width:100%;text-align:left;background:var(--stu-raise);
  border:none;border-top:1px solid var(--stu-line2);padding:11px 16px;
  font-family:var(--f);font-size:.76rem;font-weight:600;color:var(--stu-t2);cursor:pointer;
}
/* Each payment row used background:var(--bg) — the PAGE colour — inside a
   panel lighter than it, so a child element was darker than its container and
   read as a hole punched through the card. Divided rows instead: nothing here
   is tappable, so nothing needs to look like a button. */
.stu .hist-item{
  background:none;border:none;border-top:1px solid var(--stu-line2);border-radius:0;
  padding:13px 16px;margin:0;align-items:baseline;gap:12px;
}
.stu .hi-amt{font-size:.95rem;font-weight:600;letter-spacing:-.01em;color:var(--stu-t1);}
.stu .hi-lbl{font-size:.7rem;color:var(--stu-t3);font-weight:500;margin-top:2px;}
.stu .hi-dt{font-size:.7rem;color:var(--stu-t3);font-weight:500;flex:none;}

/* ===================== Business dashboard =================================
   Scoped to .dash-shell. Rather than a new set of token names, this redefines
   the app's own tokens LOCALLY: custom properties inherit, so the several
   hundred inline var(--bg2) styles on this screen pick up the charcoal
   without any of them being rewritten. Nothing outside .dash-shell is
   affected — the landing page, login, and every other screen keep the global
   values. */
.dash-shell{
  --bg:#0B0B0C; --bg2:#161618; --bg3:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.06); --elev:#1D1D20;
  --surface:linear-gradient(160deg,#1D1D20 0%,#141416 100%);
  background:var(--bg);min-height:100vh;font-variant-numeric:tabular-nums;
}
/* Every card the same, with a lit top edge and a short sheen falling from it.
   The alternating row it replaces composited to rgb(20,22,27) against
   rgb(13,15,27) — blue landed on 27 either way, so the two rows differed in
   hue rather than value, and above 1024px the two-column grid turned
   "every other row" into "the right-hand column". */
.dash-shell .card{
  background-image:linear-gradient(180deg,rgba(255,255,255,.038) 0%,rgba(255,255,255,0) 38%);
  border-top-color:rgba(255,255,255,.14);
}
.dc-name{font-size:1.06rem;font-weight:600;color:#fff;letter-spacing:-.012em;overflow-wrap:anywhere;}
.dc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--text2);margin-top:3px;}
.dc-lev{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);}
/* What an owner scans this list for is who owes. It used to be the third line
   at 10.5px while the right-hand slot held a percentage the bar already drew
   and the fraction already stated. */
.dc-owed{font-size:1.06rem;font-weight:600;color:var(--owed);letter-spacing:-.02em;text-align:right;flex:none;}
.dc-owed u{display:block;text-decoration:none;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-top:4px;}
.dc-ok{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text2);font-weight:500;white-space:nowrap;flex:none;}
.dc-ok::before{
  content:"";width:15px;height:15px;border-radius:99px;flex:none;border:1.5px solid var(--green);opacity:.75;
  background:
    linear-gradient(45deg,transparent 46%,var(--green) 46%,var(--green) 60%,transparent 60%) no-repeat 3px 6px/5px 5px,
    linear-gradient(-45deg,transparent 46%,var(--green) 46%,var(--green) 60%,transparent 60%) no-repeat 5px 4px/7px 7px;
}
.dc-track{display:flex;gap:3px;margin-top:11px;}
.dc-track i{height:4px;border-radius:99px;flex:1;background:rgba(255,255,255,.08);}
.dc-track i.on{background:var(--accent);opacity:.9;}

/* ===================== Owner screens: one shared skin =====================
   Every secondary screen the dashboard opens — Manage, Groups, Remind,
   Announcements, Export, Levels, Months — grew its own inline card and button
   styles, so the same control looks different depending on which screen you
   reached it from, and none of them match the student list.

   This is one skin they adopt a screen at a time, by adding scr to the page
   root. Tokens are the same values .dash-shell uses, so stepping from the
   dashboard into a screen it opened is not a change of surface. */
.page.scr, .reg-page.scr, .login-page.scr{
  --bg:#0B0B0C; --bg2:#161618; --bg3:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.06); --elev:#1D1D20;
  --surface:linear-gradient(160deg,#1D1D20 0%,#141416 100%);
  background:var(--bg);min-height:100vh;
}
/* Section labels take the school's accent, exactly as the settings sidebar
   group labels do. They were --text2 grey, which read as disabled. */
.scr-lbl{
  font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 12px;
}
/* A second section used to start immediately under the last control of the
   first, so its label read as a caption for the row above it. */
.scr .section + .section{margin-top:26px;}
.scr .topbar + .section{margin-top:6px;}
/* One card treatment, the student list's: charcoal with a lit top edge. */
.scr-card{
  background:var(--bg2);
  background-image:linear-gradient(180deg,rgba(255,255,255,.038) 0%,rgba(255,255,255,0) 38%);
  border:1px solid var(--border);border-top-color:rgba(255,255,255,.14);
  border-radius:20px;padding:14px 16px;margin-bottom:10px;
}
.scr-card-t{font-size:1.06rem;font-weight:600;color:#fff;letter-spacing:-.012em;overflow-wrap:anywhere;}
.scr-card-s{font-size:.82rem;color:var(--text2);margin-top:4px;line-height:1.5;overflow-wrap:anywhere;}
.scr-empty{font-size:.82rem;color:var(--text3);font-weight:500;margin-bottom:12px;}
/* One button family, at the radius the dashboard's + New already uses.
   Quiet by default; accent when it starts something; red when it destroys
   something. Destructive stays semantic and never follows the accent, the same
   way "owes" stays red whatever colour a school picks. */
.scr-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.scr-btn{
  flex:0 0 auto;width:auto;margin:0;background:var(--bg3);
  border:1px solid var(--border);border-radius:12px;padding:10px 18px;
  font-family:var(--f);font-size:.85rem;font-weight:700;color:var(--text);cursor:pointer;
  transition:background .12s,border-color .12s;
}
.scr-btn:hover{background:rgba(255,255,255,.1);}
.scr-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800;}
.scr-btn.primary:hover{filter:brightness(1.08);background:var(--accent);}
.scr-btn.danger{background:transparent;color:var(--red);border-color:rgba(239,68,68,.32);font-weight:800;}
.scr-btn.danger:hover{background:rgba(239,68,68,.1);}
.scr-btn:disabled{opacity:.45;cursor:not-allowed;}
.scr-btn.primary:disabled{background:var(--bg3);border-color:var(--border);color:var(--text3);opacity:1;}
.scr-btn.wide{width:100%;padding:14px;}
.scr-btn.tall{align-self:stretch;padding:0 20px;}
/* A selectable filter chip is not a button — it reports state rather than
   performing an action — so it gets its own shape instead of being forced
   into the button family. */
.scr-chip{
  flex:0 0 auto;background:var(--bg3);border:1px solid var(--border);border-radius:99px;
  padding:7px 14px;font-family:var(--f);font-size:.75rem;font-weight:700;color:var(--text2);
  text-transform:uppercase;letter-spacing:.08em;cursor:pointer;
}
.scr-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
/* A text action: quieter than a button, for things that toggle a view rather
   than commit anything. */
.scr-link{
  background:none;border:none;padding:0;font-family:var(--f);font-size:.78rem;font-weight:700;
  color:var(--accent);cursor:pointer;text-transform:uppercase;letter-spacing:.1em;
}
/* Panel headings on a skinned screen take the accent, the same as .scr-lbl —
   done by selector so the markup does not have to change on every screen. */
.scr .ws-t{color:var(--accent);} .info-box{background:var(--bg);border-radius:14px;padding:16px 18px;font-size:.84rem;color:var(--text2);line-height:1.7;font-weight:500;border:1px solid var(--border);} .mth-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0;} .mth-btn{border-radius:12px;padding:14px 6px;text-align:center;border:1px solid var(--border);cursor:pointer;font-family:var(--f);font-weight:700;background:var(--bg2);color:var(--text);transition:all .15s;} .mth-btn:hover{border-color:var(--accent);} .mth-btn.off{background:var(--bg);color:var(--text3);border-color:transparent;} .mth-btn-lbl{font-size:.6rem;margin-bottom:4px;letter-spacing:.14em;text-transform:uppercase;} .mth-btn-char{font-size:.9rem;font-weight:800;} .hero-stats{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid rgba(255,255,255,.1);} .hero-stats>div{grid-column:span 2;padding:12px 8px;text-align:center;border-right:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);} .hero-stats>div:nth-child(4),.hero-stats>div:nth-child(5){grid-column:span 3;} .hero-stats>div:nth-child(3),.hero-stats>div:nth-child(5){border-right:none;} .hero-stats>div:nth-child(4),.hero-stats>div:nth-child(5){border-bottom:none;} @media (min-width:768px){.hero-stats{grid-template-columns:repeat(5,1fr);} .hero-stats>div,.hero-stats>div:nth-child(4),.hero-stats>div:nth-child(5){grid-column:span 1;border-bottom:none;} .hero-stats>div:nth-child(3){border-right:1px solid rgba(255,255,255,.1);} .hero-stats>div:nth-child(5){border-right:none;}} 
/* Settings. On a phone: the bottom sheet, unchanged — these classes carry the
   exact values that used to sit inline, so nothing about the phone rendering
   depends on anything below. On a desktop: a docked column, and the sheet is
   switched off entirely rather than restyled. */
/* touch-action:none on the backdrop so a drag started on the dim area is not a
   page scroll; overscroll-behavior:contain on the panel so reaching the end of
   the list does not hand the gesture to the page behind it. */
.set-ov{position:fixed;left:0;right:0;top:0;bottom:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;touch-action:none;overscroll-behavior:none;}
.set-pan{width:100%;max-width:430px;margin:0 auto;background:var(--menu-bg);border-top-left-radius:24px;border-top-right-radius:24px;padding:10px 0 24px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;box-shadow:0 -8px 40px rgba(0,0,0,.5);}
.set-grab{width:40px;height:5px;border-radius:99px;background:var(--text3);margin:0 auto 10px;}
.set-title{padding:4px 20px 10px;font-size:.7rem;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.16em;}
/* One grouping, one label, rendered by both the sheet and the column — the two
   read from the same SET_GROUPS, so they cannot drift apart. The label takes
   the school's own accent, the same variable the progress bars and the "owes
   €X" figures already read. */
.set-grp + .set-grp{margin-top:14px;}
.set-gl{padding:0 20px 4px;font-size:.6rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;}

/* The docked sidebar does not exist below the breakpoint at all. */
.dash-side{display:none;}
.dash-shell{display:block;}

@media (min-width:1024px){
  /* 1024px is where the dashboard already becomes app--wide and the card list
     goes two-up, so settings dock at the width the rest of the screen changes
     at rather than introducing a second breakpoint. */
  .dash-shell{display:flex;align-items:flex-start;}
  .dash-side{display:block;flex:none;width:250px;align-self:stretch;
    position:sticky;top:0;max-height:100vh;overflow-y:auto;
    background:var(--menu-bg);border-right:1px solid var(--border);padding:18px 0 24px;}
  .dash-side .set-gl{padding:0 18px 4px;}
  .dash-shell > .page{flex:1;min-width:0;}
  /* The sheet and its trigger are the phone's interaction; on desktop the
     settings are simply on the screen, so neither has anything left to do. */
  .set-ov{display:none;}
  .dash-gear{display:none;}
}

.ds-brand{padding:0 18px 16px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.ds-brand-name{font-size:.95rem;font-weight:800;color:#fff;overflow-wrap:anywhere;}
.ds-brand-code{font-size:.68rem;font-weight:600;color:var(--text3);margin-top:2px;}
.ds-head{padding:0 18px 16px;font-size:.62rem;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.16em;}
.ds-item{display:flex;align-items:center;gap:11px;padding:9px 18px;cursor:pointer;
  border-left:2px solid transparent;transition:background .12s,border-color .12s;}
.ds-item:hover{background:var(--bg3);border-left-color:var(--accent);}

/* The switch itself. `compact` is the version that sits on the family portal
   until it has been dealt with; the full one lives in Account and stays there.

   Deliberately never automatic. A permission prompt that appears unasked is
   the one people dismiss forever, and "denied" cannot be undone by us -- only
   by the parent, in browser settings, which is a support call nobody wants.
   So: a button, pressed on purpose, and the browser is only asked after that. */
function PushSwitch({ compact, onDone }) {
  const [cap, setCap]   = useState("none");
  const [on, setOn]     = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr]   = useState("");
  const [ready, setReady] = useState(false);
  /* Whether they were already on when this screen opened. The compact panel
     removes itself once notifications are on -- but not in the same breath as
     being switched on, or the only feedback for pressing the button is the
     button disappearing. It confirms now and is gone next time. */
  const [wasOn, setWasOn] = useState(false);

  useEffect(() => {
    let alive = true;
    (async () => {
      const c = pushCapability();
      if (!alive) return;
      setCap(c);
      if (c !== "ready") { setReady(true); return; }
      try {
        // Ask the browser what it already has, then ask the database whether we
        // ever stored it. A subscription the browser kept but we never
        // recorded -- cleared data, a restored backup -- is not "on": nothing
        // would ever be sent to it.
        const reg = await navigator.serviceWorker.getRegistration("/app/");
        const sub = reg && await reg.pushManager.getSubscription();
        if (!sub) { if (alive) { setOn(false); setReady(true); } return; }
        const { data } = await sb.rpc("push_status", { p_endpoint: sub.endpoint });
        if (alive) { const v = !!(data && data.on); setOn(v); setWasOn(v); setReady(true); }
      } catch (e) { if (alive) { setOn(false); setReady(true); } }
    })();
    return () => { alive = false; };
  }, []);

  async function turnOn() {
    setErr(""); setBusy(true);
    try {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") {
        setCap(perm === "denied" ? "blocked" : "ready");
        setBusy(false);
        return;
      }
      const reg = await pushRegistration();
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8(VAPID_PUBLIC_KEY),
      });
      const j = sub.toJSON();
      const { data, error } = await sb.rpc("push_subscribe", {
        p_endpoint: sub.endpoint,
        p_p256dh: j.keys && j.keys.p256dh,
        p_auth: j.keys && j.keys.auth,
        p_user_agent: navigator.userAgent,
      });
      if (error || (data && data.error)) {
        // Do not leave the browser subscribed to something we failed to record:
        // it would look on and never ring.
        try { await sub.unsubscribe(); } catch (e2) {}
        throw new Error("not saved");
      }
      setOn(true); onDone && onDone();
    } catch (e) {
      setErr("Notifications could not be switched on. Try again in a moment.");
    }
    setBusy(false);
  }

  async function turnOff() {
    setErr(""); setBusy(true);
    try {
      const reg = await navigator.serviceWorker.getRegistration("/app/");
      const sub = reg && await reg.pushManager.getSubscription();
      if (sub) {
        await sb.rpc("push_unsubscribe", { p_endpoint: sub.endpoint });
        try { await sub.unsubscribe(); } catch (e) {}
      }
      setOn(false); onDone && onDone();
    } catch (e) { setErr("Could not switch them off."); }
    setBusy(false);
  }

  if (!ready) return null;
  // Nothing to offer and nothing to fix: say nothing rather than explain a
  // browser limitation to somebody who cannot act on it.
  if (cap === "none") return compact ? null : (
    <div style={{fontSize:".82rem",color:"var(--text2)",lineHeight:1.6}}>
      This browser cannot show notifications.
    </div>
  );

  // The compact one has done its job once notifications are on -- but only
  // once the parent has seen that they are.
  if (compact && ((on && wasOn) || cap === "blocked")) return null;

  const wrap = (kids) => compact
    ? <div className="fam-push">{kids}</div>
    : <div>{kids}</div>;

  if (cap === "install") return wrap(<>
    <div className="fam-push-t">🔔 Get told about announcements</div>
    <div className="fam-push-b">
      On an iPhone this only works once PayStamp is on your Home Screen.
      Tap <strong>Share</strong> at the bottom of Safari, then
      {" "}<strong>Add to Home Screen</strong> — then open it from there and
      come back here.
    </div>
  </>);

  if (cap === "blocked") return wrap(<>
    <div className="fam-push-t">Notifications are blocked</div>
    <div className="fam-push-b">
      Your phone is set to refuse notifications from PayStamp. Only you can
      change that, in your browser or phone settings — we cannot ask again.
    </div>
  </>);

  if (on) return wrap(<>
    <div className="fam-push-t">Notifications are on</div>
    <div className="fam-push-b">
      You will be told when one of your schools posts an announcement. Nothing
      else sends a notification.
    </div>
    <button className="fam-pill" style={{marginTop:10}} disabled={busy} onClick={turnOff}>
      {busy ? "…" : "Turn Off"}
    </button>
  </>);

  return wrap(<>
    <div className="fam-push-t">🔔 Get told about announcements</div>
    <div className="fam-push-b">
      Instead of opening PayStamp to check. Only announcements from your
      children's schools — nothing else.
    </div>
    {err && <div className="err" style={{margin:"8px 0"}}>{err}</div>}
    <button className="fam-pill solid" style={{marginTop:10}} disabled={busy} onClick={turnOn}>
      {busy ? "…" : "Turn On Notifications"}
    </button>
  </>);
}

/* ===========================================================================
   SHOP MODULE — BEGIN
   ---------------------------------------------------------------------------
   Optional. Uniforms, shoes and accessories a school sells to its own
   students, collected at the school.

   Everything between these markers is the module. To remove it, delete this
   block and every line marked "SHOP MODULE mount" — there are four, each one
   whole line, so the removal is literally that grep.

   What survives is two handler props on PgDashboard (onShopItems,
   onShopOrders): a name in its signature that nothing reads, and an arrow at
   its call site that nothing calls. Neither refers to anything the removal
   deletes, so neither can break. app/test/shop.js performs the removal on a
   copy and checks exactly that, so a fifth reference creeping in somewhere
   unmarked fails there rather than in somebody's hands.

   The database half is migration-shop.sql, which alters no existing table.
=========================================================================== */

/* How many orders are waiting on the owner, for the badge on the settings row.
   A hook rather than state in App, so the settings row can ask for the number
   on the same line it draws — and so removing the module takes the counter
   with it instead of leaving an orphan behind. The dashboard unmounts whenever
   a screen opens over it, so coming back re-counts. */
function useShopPending() {
  const [n, setN] = useState(0);
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const { data: r } = await sb.rpc("shop_orders_queue");
        if (alive) setN(r && r.ok
          ? (r.orders || []).filter(o => o.status === "new" || o.payment_status === "claimed").length
          : 0);
      } catch (e) { /* module's SQL not run yet — no badge, no noise */ }
    })();
    return () => { alive = false; };
  }, []);
  return n;
}

/* The owner's side: what is for sale, and the switch. */
function PgShopItems({ biz, onBack }) {
  const p = bizPal(biz);
  const [items, setItems]   = useState([]);
  const [enabled, setEnabled] = useState(false);
  const [busy, setBusy]     = useState(true);
  const [err, setErr]       = useState("");
  const [note, setNote]     = useState("");
  const [edit, setEdit]     = useState(null);   // the item being written

  async function load() {
    const { data: r, error } = await sb.rpc("shop_items_list");
    setBusy(false);
    if (error) { setErr(error.message); return; }
    if (r && r.ok) { setItems(r.items || []); setEnabled(!!r.enabled); }
  }
  useEffect(() => { load(); }, []);

  async function toggle() {
    setErr(""); setNote("");
    const { data: r, error } = await sb.rpc("shop_settings_set", { p_enabled: !enabled });
    if (error) { setErr(error.message); return; }
    if (r.error) { setErr("Could not change that."); return; }
    setEnabled(!!r.enabled);
    setNote(r.enabled
      ? "Shop is on. Parents will see it next time they open PayStamp."
      : "Shop is off. It has gone from your parents' portal — nothing you have sold is deleted.");
  }

  async function save() {
    const e = edit;
    setErr(""); setNote("");
    const price = parseFloat(e.price);
    if (!e.name || !e.name.trim()) { setErr("Give the item a name."); return; }
    if (isNaN(price) || price < 0)  { setErr("Give the item a price."); return; }
    const sizes = (e.sizesText || "").split(",").map(x => x.trim()).filter(Boolean);
    const stock = e.stockText === "" || e.stockText == null ? null : parseInt(e.stockText, 10);
    if (stock !== null && (isNaN(stock) || stock < 0)) { setErr("Stock must be a whole number, or blank."); return; }

    const { data: r, error } = await sb.rpc("shop_item_save", {
      p_id: e.id || null, p_name: e.name.trim(), p_description: e.description || null,
      p_price: price, p_sizes: sizes, p_stock: stock, p_image_url: e.image_url || null });
    if (error)                  { setErr(error.message); return; }
    if (r.error === "bad_image"){ setErr("A picture link has to start with https://"); return; }
    if (r.error)                { setErr("Could not save that item."); return; }
    setEdit(null); setNote("Saved."); load();
  }

  async function archive(it) {
    const { error } = await sb.rpc("shop_item_archive", { p_id: it.id, p_archived: !it.archived });
    if (error) { setErr(error.message); return; }
    load();
  }

  const blank = { id:null, name:"", description:"", price:"", sizesText:"", stockText:"", image_url:"" };

  return (
    <div className="reg-page scr" style={{"--accent":p.acc}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:6}}>
        <button className="tb-back" onClick={onBack}>←</button>
        <h2>Shop</h2>
      </div>
      <p>Sell uniforms, shoes and accessories to your own students. Parents order here and collect at the school — nothing is posted, and nobody outside your school sees any of it.</p>

      {err  && <div className="err" style={{marginBottom:10}}>{err}</div>}
      {note && <div className="info-box" style={{marginBottom:14}}>{note}</div>}

      <div className="scr-card" style={{marginBottom:16,padding:16}}>
        <div className="scr-lbl">Shop</div>
        <div style={{fontSize:".78rem",color:"var(--text2)",lineHeight:1.6,marginBottom:12}}>
          {enabled
            ? "On. Parents of your students can see the items below and place orders."
            : "Off. Your parents see nothing at all — no section, no heading."}
        </div>
        <button className={"scr-btn wide"+(enabled?" danger":" primary")} onClick={toggle}>
          {enabled ? "Switch Shop Off" : "Switch Shop On"}
        </button>
      </div>

      {busy ? <div className="empty">Loading…</div> : <>
        {items.length === 0 && !edit && <div className="empty">Nothing for sale yet.</div>}

        {items.map(it => (
          <div key={it.id} className="scr-card" style={{marginBottom:10,padding:16,
                opacity: it.archived ? .55 : 1}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
              <div style={{minWidth:0}}>
                <div className="scr-card-t">{it.name}{it.archived ? " · archived" : ""}</div>
                {it.description && <div className="scr-card-s">{it.description}</div>}
                <div style={{fontSize:".72rem",color:"var(--text2)",marginTop:4}}>
                  {(it.sizes || []).length ? "Sizes: " + it.sizes.join(", ") : "No sizes"}
                  {" · "}
                  {/* null and 0 are different things and must read differently:
                      "not counting" versus "counted, none left". */}
                  {it.stock == null ? "stock not counted"
                    : it.stock === 0 ? "out of stock" : (it.stock + " in stock")}
                </div>
              </div>
              <div style={{fontSize:"1rem",fontWeight:800,color:"var(--accent)",flexShrink:0}}>
                {"€"+Number(it.price).toFixed(2)}
              </div>
            </div>
            <div style={{display:"flex",gap:8,marginTop:12}}>
              <button className="scr-btn" style={{flex:1}} onClick={()=>setEdit({
                id:it.id, name:it.name, description:it.description||"", price:String(it.price),
                sizesText:(it.sizes||[]).join(", "),
                stockText: it.stock == null ? "" : String(it.stock),
                image_url: it.image_url||"" })}>Edit</button>
              <button className="scr-btn" style={{flex:1}} onClick={()=>archive(it)}>
                {it.archived ? "Restore" : "Archive"}
              </button>
            </div>
          </div>
        ))}

        {!edit && <button className="scr-btn primary wide" style={{marginTop:6}}
          onClick={()=>setEdit(blank)}>+ Add Item</button>}
      </>}

      {edit && (
        <div className="scr-card" style={{marginTop:14,padding:16}}>
          <div className="scr-lbl">{edit.id ? "Edit Item" : "New Item"}</div>
          <div className="ig"><label>Name</label>
            <input className="inp" placeholder="e.g. School Jumper" value={edit.name}
              onChange={e=>setEdit(x=>({...x,name:e.target.value}))} /></div>
          <div className="ig"><label>Description (optional)</label>
            <input className="inp" placeholder="e.g. Navy, embroidered" value={edit.description}
              onChange={e=>setEdit(x=>({...x,description:e.target.value}))} /></div>
          <div className="ig"><label>Price</label>
            <input className="inp" type="number" inputMode="decimal" placeholder="0" value={edit.price}
              onChange={e=>setEdit(x=>({...x,price:e.target.value}))} /></div>
          <div className="ig"><label>Sizes (optional, comma separated)</label>
            <input className="inp" placeholder="S, M, L" value={edit.sizesText}
              onChange={e=>setEdit(x=>({...x,sizesText:e.target.value}))} /></div>
          <div className="ig"><label>Stock (optional — leave blank not to count)</label>
            <input className="inp" type="number" inputMode="numeric" placeholder="not counted" value={edit.stockText}
              onChange={e=>setEdit(x=>({...x,stockText:e.target.value}))} /></div>
          <div className="ig"><label>Picture Link (optional)</label>
            <input className="inp" type="url" placeholder="https://…" value={edit.image_url}
              onChange={e=>setEdit(x=>({...x,image_url:e.target.value}))} /></div>
          <button className="scr-btn primary wide" onClick={save}>Save Item</button>
          <button className="scr-btn wide" style={{marginTop:10}} onClick={()=>{setEdit(null);setErr("");}}>Cancel</button>
        </div>
      )}
    </div>
  );
}

    if (error) { setErr(error.message); return; }

            {o.payment_status !== "paid" && <button className="scr-btn primary" style={{flex:"1 1 45%"}} disabled={busy}
              onClick={()=>call("shop_order_mark_paid_owner",
                {p_order_id:o.id, p_via: o.payment_status === "claimed" ? "link" : "manual"},
                "Marked paid.")}>
              {o.payment_status === "claimed" ? "Confirm Payment" : "Mark Paid"}
            </button>}
            {o.payment_status === "paid" && <button className="scr-btn" style={{flex:"1 1 45%"}} disabled={busy}
              onClick={()=>call("shop_order_unmark_paid",{p_order_id:o.id},"Set back to unpaid.")}>
              Undo Paid
            </button>}
            {o.status !== "cancelled" && o.status !== "collected" &&
              <button className="scr-btn danger" style={{flex:"1 1 45%"}} disabled={busy}
                onClick={()=>call("shop_order_set_status",{p_order_id:o.id,p_status:"cancelled"},
                  "Cancelled. Any counted stock has gone back.")}>
                Cancel
              </button>}
          </div>
        </div>
      ))}
    </div>
  );
}


/* The parent's side. Renders nothing at all unless a school they deal with
   has the shop switched on — which is what "off leaves no trace" means. */
/* `cards`, when given, narrows the panel to those card ids — which is how one
   child's page shows one child's shop. Without it the panel shows everything,
   as it did when the portal was a single scroll.

   This is also the fix for the same jumper appearing twice: the catalogue comes
   back per card, so two siblings at one school meant the item listed twice.
   Showing one child at a time makes that impossible rather than deduplicated. */
function ShopPanel({ accent, cards }) {
  const [cat, setCat]       = useState(null);
  const [orders, setOrders] = useState([]);
  const [open, setOpen]     = useState(null);   // {card_id, item, size, qty}
  const [err, setErr]       = useState("");
  const [note, setNote]     = useState("");
  const [busy, setBusy]     = useState(false);
  /* The school's payment link, if they publish one. Read, never owned: the
     module asks for it and carries on without it, so neither feature has to
     be removed with the other. */
  const [links, setLinks]   = useState({});
  const [claim, setClaim]   = useState(null);   // {order_id, opened, form, ...}

  async function load() {
    try {
      const { data: c } = await sb.rpc("shop_catalogue_mine");
      setCat(c || []);
      const { data: o } = await sb.rpc("shop_orders_mine");
      setOrders(o || []);
    } catch (e) { setCat([]); }
    try {
      const { data: l } = await sb.rpc("payment_links_mine");
      const m = {}; (l || []).forEach(x => { m[x.card_id] = x; }); setLinks(m);
    } catch (e) { setLinks({}); }
  }
  useEffect(() => { load(); }, []);

  /* Telling the school you paid for kit. It settles nothing: the order goes to
     'claimed', which is not 'paid', and the school's kit-owed total does not
     move until they confirm it against their statement. */
  async function sendClaim(o) {
    const amt = parseFloat(claim.amount);
    if (!amt || amt <= 0) { setClaim(c => ({...c, err:"How much did you pay?"})); return; }
    setClaim(c => ({...c, err:"", busy:true}));
    const { data: r, error } = await sb.rpc("shop_order_claim_paid", {
      p_order_id: o.id, p_amount: amt, p_paid_on: claim.when,
      p_reference: (claim.ref || "").trim() || null });
    if (error || (r && r.error)) {
      setClaim(c => ({...c, busy:false,
        err: (r && r.error === "bad_date") ? "That date is not one we can use — check the day."
           : "That did not go through. Try again."}));
      return;
    }
    setClaim(null);
    setNote("Told the school. They will confirm it once they have checked.");
    load();
  }

  async function place() {
    const o = open;
    if (o.item.sizes && o.item.sizes.length && !o.size) { setErr("Choose a size."); return; }
    setErr(""); setBusy(true);
    const { data: r, error } = await sb.rpc("shop_order_place", {
      p_card_id: o.card_id,
      p_lines: [{ item_id: o.item.id, size: o.size || null, qty: o.qty }],
      p_note: null });
    setBusy(false);
    if (error)                      { setErr(error.message); return; }
    if (r.error === "out_of_stock") { setErr("That has just sold out."); load(); return; }
    if (r.error === "shop_off")     { setErr("The shop is closed."); load(); return; }
    if (r.error)                    { setErr("Could not place that order."); return; }
    setOpen(null);
    setNote("Ordered. The school will let you know when it is ready to collect.");
    load();
  }

  const only = cards ? (cat || []).filter(s => cards.indexOf(s.card_id) >= 0) : cat;
  if (!only || only.length === 0) return null;   // no shop, no section
  const mineOrders = cards ? orders.filter(o => cards.indexOf(o.card_id) >= 0) : orders;
  // On one child's page the name above each block is the name at the top of
  // the page. Only worth printing when the panel spans more than one card.
  const named = only.length > 1;

  return (
    <div style={{marginTop:18}}>
      <div className="sec-row"><div className="sec-title">Shop</div></div>
      {note && <div className="info-box" style={{margin:"8px 0"}}>{note}</div>}

      {only.map(school => (
        <div key={school.card_id} style={{marginBottom:14}}>
          {named && <div style={{fontSize:".72rem",color:"var(--fam-t3)",fontWeight:700,
                textTransform:"uppercase",letterSpacing:".1em",margin:"6px 0 8px"}}>
            {school.student}
          </div>}

          {(school.items || []).length === 0
            ? <div style={{fontSize:".8rem",color:"var(--fam-t3)"}}>Nothing for sale just now.</div>
            : school.items.map(it => (
            <div key={it.id} className="scr-card" style={{marginBottom:8,padding:14}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
                <div style={{minWidth:0}}>
                  <div className="scr-card-t">{it.name}</div>
                  {it.description && <div className="scr-card-s">{it.description}</div>}
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:"1rem",fontWeight:800,color:"var(--accent)"}}>{"€"+Number(it.price).toFixed(2)}</div>
                  {it.out_of_stock && <div style={{fontSize:".62rem",fontWeight:800,color:"var(--owed)",
                        textTransform:"uppercase",letterSpacing:".06em",marginTop:4}}>Out of stock</div>}
                </div>
              </div>
              {!it.out_of_stock && (
                <button className="scr-btn wide" style={{marginTop:10}}
                  onClick={()=>{setErr("");setNote("");setOpen({card_id:school.card_id,item:it,size:null,qty:1});}}>
                  Order
                </button>
              )}
            </div>
          ))}
        </div>
      ))}

      {mineOrders.length > 0 && (
        <div className="scr-card" style={{padding:14,marginTop:6}}>
          <div className="scr-lbl">Your Orders</div>
          {mineOrders.map(o => (
            /* Named so it can be told apart from the fee card's pay-online
               panel, which now sits on the same page and says almost the same
               words. */
            <div key={o.id} className="shop-my-order" style={{padding:"6px 0"}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:10,
                    fontSize:".8rem",color:"var(--text2)"}}>
                <span style={{minWidth:0}}>
                  {(o.lines||[]).map(l => l.qty + " × " + l.name + (l.size ? " (" + l.size + ")" : "")).join(", ")}
                </span>
                <span style={{flexShrink:0,textAlign:"right"}}>
                  {"€"+Number(o.total).toFixed(2)}
                  <span style={{display:"block",fontSize:".62rem",fontWeight:800,textTransform:"uppercase",
                        letterSpacing:".06em",
                        color: o.status==="collected" ? "var(--green)"
                             : o.status==="cancelled" ? "var(--red)" : "var(--partial)"}}>
                    {o.status === "ready" ? "Ready to collect" : o.status}
                    {o.payment_status === "paid" ? " · paid" : ""}
                  </span>
                </span>
              </div>

              {/* Claimed is not paid, and has to read that way here too. */}
              {o.payment_status === "claimed" && (
                <div style={{fontSize:".74rem",color:"var(--partial)",lineHeight:1.6,marginTop:4}}>
                  {"You told the school you paid €" + Number(o.claim_amount||0).toFixed(2) + ". "}
                  <strong style={{color:"var(--text)"}}>Not marked paid yet</strong>
                  {" — they will confirm it against their statement."}
                </div>
              )}

              {/* Same two steps as the fee side: the link opens first, and only
                  then is there anything to claim. */}
              {o.payment_status === "unpaid" && o.status !== "cancelled" && links[o.card_id] && (
                <div style={{marginTop:6}}>
                  <a href={links[o.card_id].link} target="_blank" rel="noopener noreferrer"
                     onClick={()=>setClaim({order_id:o.id, opened:true, form:false, amount:String(Number(o.total).toFixed(2)),
                       when:new Date().toISOString().slice(0,10), ref:"", err:"", busy:false})}
                     style={{fontSize:".74rem",color:"var(--accent)",fontWeight:700,textDecoration:"none"}}>
                    {"Pay online" + (links[o.card_id].name ? " · " + links[o.card_id].name : "")}
                  </a>
                  {claim && claim.order_id === o.id && claim.opened && !claim.form && (
                    <button className="scr-btn wide" style={{marginTop:8}}
                      onClick={()=>setClaim(c=>({...c, form:true}))}>I've paid</button>
                  )}
                  {claim && claim.order_id === o.id && claim.form && (
                    <div style={{marginTop:8}}>
                      <div className="ig"><label>Amount Paid</label>
                        <input className="inp" type="number" inputMode="decimal" value={claim.amount}
                          onChange={e=>setClaim(c=>({...c,amount:e.target.value,err:""}))} /></div>
                      <div className="ig"><label>Date Paid</label>
                        <input className="inp" type="date" value={claim.when}
                          max={new Date().toISOString().slice(0,10)}
                          onChange={e=>setClaim(c=>({...c,when:e.target.value,err:""}))} /></div>
                      <div className="ig"><label>Reference (optional)</label>
                        <input className="inp" placeholder="Helps the school find it" value={claim.ref}
                          onChange={e=>setClaim(c=>({...c,ref:e.target.value,err:""}))} /></div>
                      {claim.err && <div className="err" style={{marginBottom:8}}>{claim.err}</div>}
                      <button className="scr-btn primary wide" disabled={claim.busy}
                        onClick={()=>sendClaim(o)}>{claim.busy ? "…" : "Tell The School"}</button>
                      <div style={{fontSize:".72rem",color:"var(--text2)",lineHeight:1.6,marginTop:8}}>
                        This tells the school — it does not mark anything paid.
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {open && (
        <div onClick={()=>setOpen(null)} style={{position:"fixed",left:0,right:0,top:0,bottom:0,zIndex:300,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div onClick={e=>e.stopPropagation()} className="scr-card" style={{maxWidth:360,padding:22,width:"100%"}}>
            <div className="scr-card-t" style={{marginBottom:4}}>{open.item.name}</div>
            <div className="scr-card-s" style={{marginBottom:14}}>{"€"+Number(open.item.price).toFixed(2)+" each"}</div>

            {(open.item.sizes || []).length > 0 && (
              <div className="ig">
                <label>Size</label>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {open.item.sizes.map(sz => (
                    <button key={sz} className={"scr-chip"+(open.size===sz?" on":"")}
                      onClick={()=>{setOpen(o=>({...o,size:sz}));setErr("");}}>{sz}</button>
                  ))}
                </div>
              </div>
            )}

            <div className="ig">
              <label>How Many</label>
              <input className="inp" type="number" inputMode="numeric" min="1" max="50" value={open.qty}
                onChange={e=>setOpen(o=>({...o,qty:Math.max(1,Math.min(50,parseInt(e.target.value,10)||1))}))} />
            </div>

            <div style={{fontSize:".9rem",fontWeight:800,marginBottom:12}}>
              {"Total €" + (Number(open.item.price) * open.qty).toFixed(2)}
            </div>
            {err && <div className="err" style={{marginBottom:8}}>{err}</div>}

            <button className="scr-btn primary wide" onClick={place} disabled={busy}>
              {busy ? "…" : "Place Order"}
            </button>
            <div style={{fontSize:".72rem",color:"var(--text2)",lineHeight:1.6,marginTop:10}}>
              You collect this at the school. Pay the school as you normally would — this is separate from your lesson fees.
            </div>
            <button className="scr-btn wide" style={{marginTop:10}} onClick={()=>setOpen(null)}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}
