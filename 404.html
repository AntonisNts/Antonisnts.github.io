<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — PayStamp</title>
<!--
  GitHub Pages and Netlify both serve this file for any address that does not
  match a real one. That is what makes /stamp/TOKEN work: there is no file at
  that path, so this page is served and forwards the token to /stamp/.

  It has to stay a plain 404 for everything else. Rewriting unknown addresses
  into the app would turn every typo into a blank React screen.
-->
<style>
  html,body{margin:0;padding:0;background:#05070C;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .w{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .c{max-width:340px;}
  h1{font-size:1.3rem;font-weight:800;margin:0 0 10px;}
  p{font-size:.9rem;line-height:1.6;color:rgba(255,255,255,.6);margin:0 0 22px;}
  a.btn{display:inline-block;background:#818cf8;color:#08110B;text-decoration:none;
    border-radius:12px;padding:14px 28px;font-weight:800;font-size:.95rem;}
</style>
<script>
(function () {
  var m = location.pathname.match(/^\/stamp\/([^\/?#]+)\/?$/);
  if (m) {
    var to = "/stamp/?t=" + encodeURIComponent(decodeURIComponent(m[1]));
    var n = new URLSearchParams(location.search).get("n");
    if (n) to += "&n=" + encodeURIComponent(n);
    location.replace(to);
  }
})();
</script>
</head>
<body>
<div class="w"><div class="c">
  <h1>Page not found</h1>
  <p>That address does not exist on PayStamp.</p>
  <a class="btn" href="/">Go to PayStamp</a>
</div></div>
</body>
</html>
