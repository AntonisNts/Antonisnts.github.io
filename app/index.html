  // Confirmation now lives in PgParentSettings' dialog, so no window.confirm here.
  async function doDeleteFamily(){
    const { error } = await sb.rpc("delete_my_family_account");
    if (error) { pop(error.message||"Delete failed","err"); return; }
    try { await sb.auth.signOut(); } catch(e){}
    setSession(null); setBizId(null); setDb({businesses:{}}); setMyCards([]); setChildren([]); setApproval(null); setMode("teacher"); setView("landing");
    pop("Family account deleted.");
  }

  async function refreshChildren(){ try { setChildren(await loadMyChildren()); } catch(e){} }
  async function doCreateChild(name){
    const { data, error } = await sb.rpc("create_child", { p_name: name });
    if (error) { pop(error.message,"err"); return null; }
    await refreshChildren();
    return (data && data.ok) ? data : null;
  }
  async function doRenameChild(id, name){
    const { error } = await sb.rpc("rename_child", { p_id:id, p_name:name });
    if (error) { pop(error.message,"err"); return; }
    await refreshChildren();
  }
  async function doDeleteChild(id){
    const { error } = await sb.rpc("delete_child", { p_id:id });
    if (error) { pop(error.message,"err"); return; }
    await refreshChildren(); await refreshMyCards();
  }
  async function doAssignCard(cardId, childId){
    const { error } = await sb.rpc("assign_card", { p_card_id:cardId, p_child_id:childId });
    if (error) { pop(error.message,"err"); return; }
    await refreshMyCards();
  }

  async function refreshMyCards(){ try { const items = await loadMyCards(); setMyCards(items); } catch(e){} }
  async function doLinkChild(code, pin){
    const { data, error } = await sb.rpc("link_card", { p_code: code, p_pin: pin });
    if (error) return { error: error.message };
    if (data && data.ok) { await refreshMyCards(); pop("Linked "+(data.name||"card")+"!"); }
    return data || { ok:false };
  }
  async function doUnlinkCard(cardId, name){
    if (!window.confirm("Unlink "+(name||"this card")+"?")) return;
    const { error } = await sb.rpc("unlink_card", { p_card_id: cardId });
    if (error) { pop(error.message,"err"); return; }
    await refreshMyCards(); pop("Unlinked");
  }

  function onRegistered(res){
    if (res && res.needsConfirm){ pop("Check your email to confirm, then log in."); setView("login"); }
    else if (res && res.bizCode){ pop("Business created! Code: "+res.bizCode); }
  }

  async function afterBizCreated(code){
    // New accounts are created 'pending' — show the approval gate, not the app.
    setBizLoaded(false);
    try {
      const status = await loadMyApproval();
      setApproval(status);
      if (status === "approved") { const b = await loadInto(); if (b) setView("dashboard"); }
      else { pop("Account created — pending approval."); }
    } catch(e){ pop(e.message||"Load failed","err"); }
    finally { setBizLoaded(true); }
  }

  async function doAddCard(data){
    if(!data.name.trim()){ pop("Enter a name","err"); return; }
    const shareCode=genShareCode(), pin=genPin();
    const { data: ins, error } = await sb.from("cards").insert({ business_id:bizId, name:data.name.trim(), level:data.level||null, share_code:shareCode, pin, phone:data.phone||null, preferred_channel:data.preferredChannel||"whatsapp", language:data.language||"EN", enrollment_start_month:data.enrollmentStart||null, group_id:data.groupId||null, lesson_schedule:data.lessonSchedule||[], payments:{}, history:[] }).select("id").single();
    if(error){ pop(error.message,"err"); return; }
    const newCard={id:ins.id,name:data.name.trim(),level:data.level||null,shareCode,pin,phone:data.phone||"",preferredChannel:data.preferredChannel||"whatsapp",language:data.language||"EN",enrollmentStart:data.enrollmentStart||null,groupId:data.groupId||null,groupName:"",lessonSchedule:data.lessonSchedule||[],pausedMonths:[],feeHistory:[],payments:{},history:[]};
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards:{...d.businesses[bizId].cards,[ins.id]:newCard}}}}));
    setRevealCard(newCard); setView("reveal");
  }
  // Bulk import batch insert. `payload` rows are fully-formed by PgImport
  // (which owns the mapping/defaults); this just does the single atomic
  // multi-row insert and merges the results into local state, mirroring
  // doAddCard's optimistic-update shape. A single INSERT with N value rows is
  // one SQL statement — if ANY row violates a constraint, Postgres rolls the
  // whole statement back and NOTHING is inserted, which is what gives this
  // its all-or-nothing guarantee without a separate RPC/transaction.
  async function doImportStudents(payload) {
    const { data: ins, error } = await sb.from("cards").insert(payload).select("id, share_code");
    if (error) return { ok:false, error: error.message || "Import failed." };
    const byCode = {}; payload.forEach(p => { byCode[p.share_code] = p; });
    const newCards = {};
    ins.forEach(row => {
      const p = byCode[row.share_code]; if (!p) return;
      newCards[row.id] = { id:row.id, name:p.name, level:null, shareCode:p.share_code, pin:p.pin, phone:p.phone||"", preferredChannel:p.preferred_channel, language:p.language, enrollmentStart:p.enrollment_start_month, groupId:p.group_id, groupName:"", lessonSchedule:[], pausedMonths:[], feeHistory:p.fee_history||[], payments:{}, history:[] };
    });
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards:{...d.businesses[bizId].cards,...newCards}}}}));
    return { ok:true, count: ins.length };
  }

async function doUpdateCard(updates){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards:{...d.businesses[bizId].cards,[cardId]:{...d.businesses[bizId].cards[cardId],...updates}}}}}));
    const patch={};
    if("name" in updates) patch.name=updates.name;
    if("payments" in updates) patch.payments=updates.payments;
    if("history" in updates) patch.history=updates.history;
    if("level" in updates) patch.level=updates.level;
    if("phone" in updates) patch.phone=updates.phone;
    if("preferredChannel" in updates) patch.preferred_channel=updates.preferredChannel;
    if("language" in updates) patch.language=updates.language;
    if("enrollmentStart" in updates) patch.enrollment_start_month=updates.enrollmentStart;
    if("pausedMonths" in updates) patch.paused_months=updates.pausedMonths;
    if("feeHistory" in updates) patch.fee_history=updates.feeHistory;
    if("groupId" in updates) patch.group_id=updates.groupId;
    if("groupName" in updates) patch.group_name=updates.groupName;
    if("lessonSchedule" in updates) patch.lesson_schedule=updates.lessonSchedule;
    const { error } = await sb.from("cards").update(patch).eq("id",cardId);
    if(error){ pop(error.message,"err"); refresh(); }
  }

  async function doRemoveCard(){
    if(!window.confirm("Remove this student?")) return;
    const id=cardId;
    setDb(d=>{const cards={...d.businesses[bizId].cards};delete cards[id];return {businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards}}};});
    setView("dashboard");
    const { error } = await sb.from("cards").delete().eq("id",id);
    if(error){pop(error.message,"err");} else {pop("Student removed");}
  }

  // Bulk delete from the student list. One DELETE ... in (...) statement, so it
  // either removes every selected student or none (same all-or-nothing property
  // the bulk import relies on). Local state is only updated after the server
  // confirms, so a failure leaves the list exactly as it was.
  async function doRemoveCards(ids){
    if(!ids || !ids.length) return { ok:false, error:"Nothing selected." };
    const { error } = await sb.from("cards").delete().in("id", ids);
    if(error){ pop(error.message,"err"); return { ok:false, error:error.message }; }
    setDb(d=>{ const cards={...d.businesses[bizId].cards}; ids.forEach(id=>{delete cards[id];}); return {businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards}}}; });
    pop(ids.length+(ids.length===1?" student removed":" students removed"));
    return { ok:true, count:ids.length };
  }

  async function doSaveMonths(inactive){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],inactiveMonths:inactive}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({inactive_months:inactive}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop("Months saved!");}
  }
  async function doSaveLevels(levels){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],levels}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({levels}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop("Levels saved!");}
  }
  async function doSaveCard(img){
    let url=img;
    if (img && img.indexOf("data:")===0){
      try{
        const blob = await (await fetch(img)).blob();
        const path = bizId+"/card-"+Date.now();
        const { error: ue } = await sb.storage.from("card-images").upload(path, blob, {upsert:true, contentType:blob.type||"image/png"});
        if(ue) throw ue;
        url = sb.storage.from("card-images").getPublicUrl(path).data.publicUrl;
      }catch(e){ pop(e.message||"Upload failed","err"); return; }
    }
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],customCardImage:url}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({custom_card_image:url}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop(url?"Card image saved!":"Image removed");}
  }

  // New Year rollover: owner-initiated only. Increments biz.year by 1 so the
  // grid re-renders a fresh Jan–Dec for the next year. No card/payment/history
  // data is deleted — prior-year payments stay keyed under their own year.
  async function doStartNewYear(){
    const cur = (biz && biz.year) || new Date().getFullYear();
    const next = cur + 1;
    if (!window.confirm("This will start "+next+". Your "+cur+" payment history is safe and stays in records. This cannot be undone. Continue?")) return;
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],year:next}}}));
    const { error } = await sb.from("businesses").update({year:next}).eq("id",bizId);
    if(error){ pop(error.message,"err"); } else { pop("New year started: "+next); }
  }

  return (
    <>
      <style>{CSS}</style>
      <div className={"app"+(view==="dashboard"?" app--wide":"")}>
        {!authReady ? <div className="empty" style={{paddingTop:80}}>Loading…</div>
         : session && !bizLoaded ? <div className="empty" style={{paddingTop:80}}>Loading…</div>
         : session && approval==="pending" ? <PgPending email={session.user&&session.user.email} onLogout={doLogout} />
         : session && approval==="rejected" ? <PgRejected onLogout={doLogout} />
         : session && mode==="parent" ? (view==="linkChild"
             ? <PgLinkChild onBack={()=>setView("parentDash")} onLink={doLinkChild} kids={children} onAssign={doAssignCard} onCreateChild={doCreateChild} />
             : view==="parentSettings"
             ? <PgParentSettings email={session.user&&session.user.email} onBack={()=>setView("parentDash")} onDeleteAccount={doDeleteFamily} />
             : <PgParentDashboard items={myCards} kids={children} announcements={ann} annRead={annRead} onMarkAnnRead={doMarkAnnRead} onLink={()=>setView("linkChild")} onUnlink={doUnlinkCard} onAssign={doAssignCard} onCreateChild={doCreateChild} onRenameChild={doRenameChild} onDeleteChild={doDeleteChild} onLogout={doLogout} onSettings={()=>setView("parentSettings")} onTeacher={biz?(()=>{setMode("teacher");setView("dashboard");}):null} />)
         : session && bizLoaded && !biz ? <PgCreateBusiness email={session.user&&session.user.email} onCreated={afterBizCreated} onLogout={doLogout} />
         : <>
        {view==="landing" && <PgLanding onTeacher={()=>setView(session?"dashboard":"login")} onParent={()=>setView("parentAuth")} onStudent={()=>setView("student")} />}
        {view==="login" && <PgLogin onLogin={()=>{}} onBack={()=>setView("landing")} onRegister={()=>setView("register")} onForgot={()=>setView("forgot")} />}
        {view==="forgot" && <PgForgot onBack={()=>setView("login")} />}
        {view==="register" && <PgRegister onBack={()=>setView("login")} onCreated={onRegistered} />}
        {view==="student" && <PgStudent onBack={()=>setView("landing")} />}
        {view==="parentAuth" && <PgParentAuth onBack={()=>setView("landing")} />}
        {view==="dashboard" && biz && <PgDashboard biz={biz} onCard={id=>{setCardId(id);goView("card");}} onAdd={()=>goView("addCard")} onMonths={()=>goView("months")} onLevels={()=>goView("levels")} onCustomCard={()=>goView("customCard")} onExport={()=>goView("export")} onRemind={()=>goView("remind")} onFamily={()=>{setMode("parent");goView("parentDash");}} showFamily={myCards.length>0} onLogout={doLogout} levelFilter={dashFilter} setLevelFilter={setDashFilter} sort={dashSort} setSort={setDashSort} viewBy={dashViewBy} setViewBy={setDashViewBy} expanded={dashExpanded} setExpanded={setDashExpanded} onNewYear={doStartNewYear} onDeleteAccount={doDeleteBusiness} onAnnouncements={()=>goView("announcements")} onGroups={()=>goView("groups")} onManage={()=>goView("manage")} onImport={()=>goView("import")} onRemoveCards={doRemoveCards} />}
        {view==="addCard" && biz && <PgAddCard biz={biz} onBack={()=>setView("dashboard")} onCreate={doAddCard} />}
        {view==="import" && biz && <PgImport biz={biz} onBack={()=>setView("dashboard")} onImport={doImportStudents} />}
        {view==="reveal" && revealCard && <PgReveal card={revealCard} onDone={()=>{setRevealCard(null);setView("dashboard");}} />}
        {view==="card" && biz && card && <PgCard biz={biz} card={card} onBack={()=>setView("dashboard")} onUpdate={doUpdateCard} onRemove={doRemoveCard} />}
        {view==="months" && biz && <PgManageMonths biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveMonths} />}
        {view==="levels" && biz && <PgManageLevels biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveLevels} />}
        {view==="customCard" && biz && <PgCustomCard biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveCard} />}
        {view==="export" && biz && <PgExport biz={biz} onBack={()=>setView("dashboard")} />}
        {view==="remind" && biz && <PgRemind biz={biz} onBack={()=>setView("dashboard")} />}
        {view==="announcements" && biz && <PgAnnouncements biz={biz} onBack={()=>setView("dashboard")} />}
        {view==="groups" && biz && <PgGroups biz={biz} onBack={()=>setView("dashboard")} />}
        {view==="manage" && biz && <PgManage biz={biz} onBack={()=>setView("dashboard")} onSaveTeacher={doSaveTeacher} onDeleteTeacher={doDeleteTeacher} onSaveGroup={doSaveGroup} onDeleteGroup={doDeleteGroup} />}
        </>}
        {toast && <div className={"toast t-"+toast.type}>{toast.msg}</div>}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
