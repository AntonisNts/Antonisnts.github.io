        <button className="btn" onClick={doPin} disabled={busy}>{busy?"…":"View My Card"}</button>
      </div>
    );
  }
  return (
    <div className="login-page">
      <button className="tb-back" style={{marginBottom:16}} onClick={onBack}>← Back</button>
      <h1>My Card</h1>
      <p>Enter the unique code your teacher gave you.</p>
      <div className="ig"><label>Your Unique Code</label>
        <input className="inp" placeholder="e.g. AQ3RG0" value={code}
          onChange={e=>{setCode(e.target.value.toUpperCase());setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&doCode()} /></div>
      {err && <div className="err">{err}</div>}
      <button className="btn" onClick={doCode}>Find My Card</button>
    </div>
  );
}  function PgManageMonths({ biz, onBack, onSave }) {   const [inactive, setInactive] = useState(biz.inactiveMonths||[]);   function toggle(mi) { setInactive(prev=>prev.includes(mi)?prev.filter(x=>x!==mi):[...prev,mi]); }   return (     <div className="reg-page">       <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:6}}>         <button className="tb-back" onClick={onBack}>←</button>         <h2>Manage Months</h2>       </div>       <p>Tap to mark months as inactive. They will be skipped in payment distribution.</p>       <div className="mth-grid">         {MONTHS.map((m,mi)=>(           <div key={mi} className={"mth-btn"+(inactive.includes(mi)?" off":"")} onClick={()=>toggle(mi)}>             <div className="mth-btn-lbl">{m}</div>             <div className="mth-btn-char">{inactive.includes(mi)?"–":"✓"}</div>           </div>         ))}       </div>       <div className="info-box" style={{marginBottom:20}}>         <strong style={{color:"var(--text)"}}>Active: </strong>{MONTHS.filter((_,mi)=>!inactive.includes(mi)).join(", ")}         <br /><strong style={{color:"var(--text)"}}>Inactive: </strong>{inactive.length===0?"None":MONTHS.filter((_,mi)=>inactive.includes(mi)).join(", ")}       </div>       <button className="btn" onClick={()=>onSave(inactive)}>Save</button>     </div>   ); }  function PgManageLevels({ biz, onBack, onSave }) {   const [levels, setLevels] = useState(biz.levels||[]);   const [name, setName] = useState("");   const [fee, setFee] = useState("");   const [err, setErr] = useState("");   function addLevel() {     if (!name.trim()) { setErr("Enter a level name."); return; }     if (!fee||+fee<=0) { setErr("Enter a valid fee."); return; }     setLevels(prev=>[...prev,{id:"l"+Date.now(),name:name.trim(),fee:+fee}]);     setName(""); setFee(""); setErr("");   }   return (     <div className="reg-page">       <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:6}}>         <button className="tb-back" onClick={onBack}>←</button>         <h2>Manage Levels</h2>       </div>       <p>Define levels with their own monthly fees.</p>       {levels.length===0 ? <div className="empty" style={{padding:"20px 0"}}>No levels yet.</div>         : levels.map(l=>(           <div key={l.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg3)",borderRadius:14,padding:"14px 16px",marginBottom:8,border:"1px solid var(--border)"}}>             <div><div style={{fontWeight:900,fontSize:".95rem"}}>{l.name}</div><div style={{fontSize:".78rem",color:"var(--orange)",fontWeight:800,marginTop:2}}>{"€"+l.fee+"/mo"}</div></div>             <button onClick={()=>setLevels(prev=>prev.filter(x=>x.id!==l.id))} style={{background:"none",border:"none",color:"var(--text3)",fontSize:"1.1rem",cursor:"pointer",padding:"4px 8px"}}>✕</button>           </div>         ))       }       <div style={{background:"var(--bg3)",borderRadius:16,padding:16,marginTop:8,marginBottom:16,border:"1px solid var(--border)"}}>         <div style={{fontSize:".8rem",fontWeight:800,color:"var(--text2)",marginBottom:12,textTransform:"uppercase",letterSpacing:".04em"}}>Add New Level</div>         <div className="ig" style={{marginBottom:10}}><label>Level Name</label><input className="inp" placeholder="e.g. Beginner / Age 6-10" value={name} onChange={e=>{setName(e.target.value);setErr("");}} /></div>         <div className="ig" style={{marginBottom:10}}><label>Monthly Fee</label><input className="inp" type="number" placeholder={"e.g. "+biz.fee} value={fee} onChange={e=>{setFee(e.target.value);setErr("");}} /></div>         {err && <div className="err" style={{marginBottom:8}}>{err}</div>}         <button onClick={addLevel} style={{width:"100%",padding:"11px",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,fontFamily:"var(--f)",fontWeight:800,fontSize:".88rem",cursor:"pointer",color:"var(--text)"}}>+ Add Level</button>       </div>       <button className="btn" onClick={()=>onSave(levels)}>Save Levels</button>     </div>   ); }  function PgCustomCard({ biz, onBack, onSave }) {   const [preview, setPreview] = useState(biz.customCardImage||null);   const [err, setErr] = useState("");   const p = getPal(biz.type);   const fileRef = useRef(null);   function handleFile(e) {     const file = e.target.files[0];     if (!file) return;     if (file.size > 2*1024*1024) { setErr("Image must be under 2MB."); return; }     if (!file.type.startsWith("image/")) { setErr("Please select an image file."); return; }     setErr("");     const reader = new FileReader();     reader.onload = ev => setPreview(ev.target.result);     reader.readAsDataURL(file);   }   const previewBg = preview ? "#000" : "linear-gradient(135deg,"+p.bg1+","+p.bg2+")";   return (     <div className="reg-page">       <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:6}}>         <button className="tb-back" onClick={onBack}>←</button>         <h2>Card Design</h2>       </div>       <p>Upload a custom background for student cards. Max 2MB.</p>       <div style={{borderRadius:22,overflow:"hidden",boxShadow:"0 8px 32px rgba(0,0,0,.4)",marginBottom:20,position:"relative",background:previewBg}}>         {preview && <img src={preview} alt="" style={{position:"absolute",top:0,left:0,right:0,bottom:0,width:"100%",height:"100%",objectFit:"cover",opacity:0.45}} />}         <div style={{position:"absolute",top:0,left:0,right:0,bottom:0,background:"linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.75) 100%)"}} />         <div style={{position:"relative",zIndex:2,padding:20}}>           <div style={{fontSize:".7rem",fontWeight:800,color:p.acc,textTransform:"uppercase",letterSpacing:".1em",marginBottom:4}}>{p.icon} {biz.type}</div>           <div style={{fontSize:"1.2rem",fontWeight:900,color:"#fff",marginBottom:2}}>{biz.name}</div>           <div style={{fontSize:".78rem",color:"rgba(255,255,255,.5)",fontWeight:700,marginBottom:16}}>{biz.bizCode}</div>           <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:5}}>             {MONTHS.map((m,mi)=>(               <div key={mi} style={{borderRadius:10,padding:"6px 2px",textAlign:"center",background:mi<3?"rgba(255,255,255,.25)":"rgba(255,255,255,.08)"}}>                 <div style={{fontSize:".5rem",color:"rgba(255,255,255,.5)",fontWeight:700}}>{m}</div>                 <div style={{fontSize:".75rem",fontWeight:900,color:"#fff"}}>{m.slice(0,1)}</div>               </div>             ))}           </div>         </div>       </div>       {err && <div className="err" style={{marginBottom:12}}>{err}</div>}       <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFile} />       <button className="btn" onClick={()=>fileRef.current.click()}>Upload Image</button>       {preview && <button onClick={()=>setPreview(null)} className="btn-ghost" style={{color:"var(--red)"}}>Remove Custom Image</button>}       <button className="btn" style={{marginTop:10,background:"var(--green)"}} onClick={()=>onSave(preview)}>Save Card Design</button>     </div>   ); }  function PgCreateBusiness({ email, onCreated, onLogout }) {
  const [v, setV] = useState({name:"",type:TYPES[0],fee:""});
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  async function doCreate() {
    if (!v.name.trim()) { setErr("Enter a name."); return; }
    if (!v.fee||+v.fee<=0) { setErr("Enter a valid fee."); return; }
    setBusy(true); setErr("");
    const bizCode = genBizId();
    const { error } = await sb.from("businesses").insert({ biz_code:bizCode, name:v.name.trim(), type:v.type, fee:+v.fee, year:new Date().getFullYear(), contact_email:email||null, inactive_months:[], levels:[] });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    onCreated(bizCode);
  }
  return (
    <div className="reg-page">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <h2>Create Your Business</h2>
        <button className="tb-act" onClick={onLogout}>Log out</button>
      </div>
      <p>You're logged in{email?(" as "+email):""}, but don't have a business yet. Set one up to continue.</p>
      <div className="ig"><label>Business Name</label><input className="inp" placeholder="e.g. Swim Smooth" value={v.name} onChange={e=>setV(p=>({...p,name:e.target.value}))} /></div>
      <div className="ig"><label>Type</label>
        <select className="inp" value={v.type} onChange={e=>setV(p=>({...p,type:e.target.value}))}>
          {TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
      <div className="ig"><label>Monthly Fee</label><input className="inp" type="number" placeholder="e.g. 50" value={v.fee} onChange={e=>setV(p=>({...p,fee:e.target.value}))} /></div>
      {err && <div className="err">{err}</div>}
      <button className="btn" style={{marginTop:8}} onClick={doCreate} disabled={busy}>{busy?"…":"Create Business"}</button>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [db, setDb] = useState({businesses:{}});
  const [view, setView] = useState("landing");
  const [bizId, setBizId] = useState(null);
  const [cardId, setCardId] = useState(null);
  const [revealCard, setRevealCard] = useState(null);
  const [toast, setToast] = useState(null);
  const [bizLoaded, setBizLoaded] = useState(false);

  const pop = (msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2800);};

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{ setSession(data.session); setAuthReady(true); });
    const { data: sub } = sb.auth.onAuthStateChange((_e,s)=>{ setSession(s); });
    return ()=>{ sub.subscription.unsubscribe(); };
  },[]);

  async function loadInto() {
    let b = await loadMyBusiness();
    if (!b) {
      const rawp = localStorage.getItem("pending_biz");
      if (rawp) {
        try {
          const pv = JSON.parse(rawp);
          await sb.from("businesses").insert({ biz_code:genBizId(), name:pv.name, type:pv.type, fee:+pv.fee, year:new Date().getFullYear(), contact_email:pv.email, inactive_months:[], levels:[] });
          localStorage.removeItem("pending_biz");
          b = await loadMyBusiness();
        } catch(e){}
      }
    }
    if (b) { setDb({businesses:{[b.id]:b}}); setBizId(b.id); }
    return b;
  }

  useEffect(()=>{
    if (!session) { setDb({businesses:{}}); setBizId(null); setBizLoaded(false); return; }
    setBizLoaded(false);
    (async()=>{
      try {
        const b = await loadInto();
        if (b) setView(v=>(v==="landing"||v==="login"||v==="register"||v==="forgot")?"dashboard":v);
      } catch(e){ pop(e.message||"Load failed","err"); }
      finally { setBizLoaded(true); }
    })();
  },[session]);

  const biz = bizId ? db.businesses[bizId] : null;
  const card = biz && cardId ? biz.cards[cardId] : null;

  async function refresh(){ try{ const b=await loadMyBusiness(); if(b){setDb({businesses:{[b.id]:b}});} }catch(e){} }

  async function doLogout(){ await sb.auth.signOut(); setBizId(null); setDb({businesses:{}}); setView("landing"); }

  function onRegistered(res){
    if (res && res.needsConfirm){ pop("Check your email to confirm, then log in."); setView("login"); }
    else if (res && res.bizCode){ pop("Business created! Code: "+res.bizCode); }
  }

  async function afterBizCreated(code){
    pop("Business created! Code: "+code);
    setBizLoaded(false);
    try { const b = await loadInto(); if (b) setView("dashboard"); }
    catch(e){ pop(e.message||"Load failed","err"); }
    finally { setBizLoaded(true); }
  }

  async function doAddCard(data){
    if(!data.name.trim()){ pop("Enter a name","err"); return; }
    const shareCode=genShareCode(), pin=genPin();
    const { data: ins, error } = await sb.from("cards").insert({ business_id:bizId, name:data.name.trim(), level:data.level||null, share_code:shareCode, pin, payments:{}, history:[] }).select("id").single();
    if(error){ pop(error.message,"err"); return; }
    const newCard={id:ins.id,name:data.name.trim(),level:data.level||null,shareCode,pin,payments:{},history:[]};
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards:{...d.businesses[bizId].cards,[ins.id]:newCard}}}}));
    setRevealCard(newCard); setView("reveal");
  }

  async function doUpdateCard(updates){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards:{...d.businesses[bizId].cards,[cardId]:{...d.businesses[bizId].cards[cardId],...updates}}}}}));
    const patch={};
    if("payments" in updates) patch.payments=updates.payments;
    if("history" in updates) patch.history=updates.history;
    if("level" in updates) patch.level=updates.level;
    const { error } = await sb.from("cards").update(patch).eq("id",cardId);
    if(error){ pop(error.message,"err"); refresh(); }
  }

  async function doRemoveCard(){
    if(!window.confirm("Remove this student?")) return;
    const id=cardId;
    setDb(d=>{const cards={...d.businesses[bizId].cards};delete cards[id];return {businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],cards}}};});
    setView("dashboard");
    const { error } = await sb.from("cards").delete().eq("id",id);
    if(error){pop(error.message,"err");} else {pop("Student removed");}
  }

  async function doSaveMonths(inactive){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],inactiveMonths:inactive}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({inactive_months:inactive}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop("Months saved!");}
  }
  async function doSaveLevels(levels){
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],levels}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({levels}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop("Levels saved!");}
  }
  async function doSaveCard(img){
    let url=img;
    if (img && img.indexOf("data:")===0){
      try{
        const blob = await (await fetch(img)).blob();
        const path = bizId+"/card-"+Date.now();
        const { error: ue } = await sb.storage.from("card-images").upload(path, blob, {upsert:true, contentType:blob.type||"image/png"});
        if(ue) throw ue;
        url = sb.storage.from("card-images").getPublicUrl(path).data.publicUrl;
      }catch(e){ pop(e.message||"Upload failed","err"); return; }
    }
    setDb(d=>({businesses:{...d.businesses,[bizId]:{...d.businesses[bizId],customCardImage:url}}}));
    setView("dashboard");
    const { error } = await sb.from("businesses").update({custom_card_image:url}).eq("id",bizId);
    if(error){pop(error.message,"err");} else {pop(url?"Card image saved!":"Image removed");}
  }

  return (
    <>
      <style>{CSS}</style>
      <div className={"app"+(view==="dashboard"?" app--wide":"")}>
        {!authReady ? <div className="empty" style={{paddingTop:80}}>Loading…</div>
         : session && !bizLoaded ? <div className="empty" style={{paddingTop:80}}>Loading your dashboard…</div>
         : session && bizLoaded && !biz ? <PgCreateBusiness email={session.user&&session.user.email} onCreated={afterBizCreated} onLogout={doLogout} />
         : <>
        {view==="landing" && <PgLanding onTeacher={()=>setView(session?"dashboard":"login")} onStudent={()=>setView("student")} />}
        {view==="login" && <PgLogin onLogin={()=>{}} onBack={()=>setView("landing")} onRegister={()=>setView("register")} onForgot={()=>setView("forgot")} />}
        {view==="forgot" && <PgForgot onBack={()=>setView("login")} />}
        {view==="register" && <PgRegister onBack={()=>setView("login")} onCreated={onRegistered} />}
        {view==="student" && <PgStudent onBack={()=>setView("landing")} />}
        {view==="dashboard" && biz && <PgDashboard biz={biz} onCard={id=>{setCardId(id);setView("card");}} onAdd={()=>setView("addCard")} onMonths={()=>setView("months")} onLevels={()=>setView("levels")} onCustomCard={()=>setView("customCard")} onExport={()=>setView("export")} onRemind={()=>setView("remind")} onLogout={doLogout} />}
        {view==="addCard" && biz && <PgAddCard biz={biz} onBack={()=>setView("dashboard")} onCreate={doAddCard} />}
        {view==="reveal" && revealCard && <PgReveal card={revealCard} onDone={()=>{setRevealCard(null);setView("dashboard");}} />}
        {view==="card" && biz && card && <PgCard biz={biz} card={card} onBack={()=>setView("dashboard")} onUpdate={doUpdateCard} onRemove={doRemoveCard} />}
        {view==="months" && biz && <PgManageMonths biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveMonths} />}
        {view==="levels" && biz && <PgManageLevels biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveLevels} />}
        {view==="customCard" && biz && <PgCustomCard biz={biz} onBack={()=>setView("dashboard")} onSave={doSaveCard} />}
        {view==="export" && biz && <PgExport biz={biz} onBack={()=>setView("dashboard")} />}
        {view==="remind" && biz && <PgRemind biz={biz} onBack={()=>setView("dashboard")} />}
        </>}
        {toast && <div className={"toast t-"+toast.type}>{toast.msg}</div>}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
