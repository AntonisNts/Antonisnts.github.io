async function compressImage(file, maxEdge, quality) {
  return await new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      const s = Math.min(1, (maxEdge||1280) / Math.max(w, h));
      w = Math.max(1, Math.round(w*s)); h = Math.max(1, Math.round(h*s));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      cv.toBlob(b => { b ? resolve(b) : reject(new Error("Image compression failed")); }, "image/jpeg", quality||0.7);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read image")); };
    img.src = url;
  });
}

/* ===================== Family portal =======================================
   Scoped to this one page. The rest of the app keeps --bg/--bg2 until the
   other portals follow, so nothing here can recolour the business dashboard
   or the student portal by accident.

   The live page painted four backgrounds in three hues — and the notes boxes
   were a purple gradient while the cards beside them were flat, which is what
   made the dark read as muddy rather than deep. One neutral charcoal family
   here: ground, card, and a slightly raised strip. Five type sizes, not
   fourteen. */
.page.fam{
  --fam-bg:#0B0B0C; --fam-card:#161618; --fam-raise:#1D1D20;
  --fam-line:rgba(255,255,255,.07); --fam-line2:rgba(255,255,255,.045);
  --fam-t1:#F6F6F5; --fam-t2:#A3A3A9; --fam-t3:#6F6F77; --fam-ok:#4FD1A5;
  background:var(--fam-bg);min-height:100vh;color:var(--fam-t1);
  font-variant-numeric:tabular-nums;
}
.fam .topbar{padding:18px 18px 20px;gap:10px;}
.fam .topbar h2{font-size:1.06rem;font-weight:600;letter-spacing:-.01em;flex:1;}
.fam .tb-act{
  width:32px;height:32px;border-radius:99px;background:var(--fam-card);
  border:1px solid var(--fam-line);color:var(--fam-t2);font-size:.8rem;
  display:flex;align-items:center;justify-content:center;padding:0;flex:none;
}
.fam .fam-out{
  background:transparent;border:1px solid var(--fam-line);border-radius:99px;
  color:var(--fam-t2);padding:7px 14px;font-family:var(--f);font-size:.82rem;
  font-weight:500;cursor:pointer;flex:none;white-space:nowrap;
}
.fam .sec-title{font-size:.7rem;font-weight:600;color:var(--fam-t3);letter-spacing:.14em;}
.fam .empty{color:var(--fam-t3);}

/* The amount is the message. It had a box, a border, and a full-width filled
   button under it for an action the app cannot actually perform. */
.fam-due{padding:0 2px 20px;border-bottom:1px solid var(--fam-line2);margin-bottom:20px;}
.fam-due-lbl{
  display:block;font-size:.7rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fam-t3);margin-bottom:7px;
}
.fam-due-line{display:flex;align-items:flex-end;gap:12px;}
.fam-due-amt{font-size:2.6rem;font-weight:600;letter-spacing:-.035em;line-height:.92;color:var(--owed);}
.fam-due-who{flex:1;min-width:0;font-size:.82rem;color:var(--fam-t2);line-height:1.35;padding-bottom:3px;overflow-wrap:anywhere;}
.fam-due-who b{display:block;color:var(--fam-t1);font-weight:600;}
.fam-acts{display:flex;align-items:center;gap:18px;margin-top:16px;flex-wrap:wrap;}
.fam-link{
  background:none;border:none;padding:0 0 2px;font-family:var(--f);font-size:.82rem;
  font-weight:600;color:var(--fam-t1);border-bottom:1px solid var(--fam-t3);cursor:pointer;
}
.fam-link.quiet{color:var(--fam-t2);border-bottom-color:var(--fam-line);}
.fam-fine{font-size:.7rem;color:var(--fam-t3);line-height:1.5;margin-top:14px;max-width:36ch;}

.fam-pill{
  background:transparent;border:1px solid var(--fam-line);border-radius:99px;padding:6px 13px;
  font-family:var(--f);font-size:.76rem;font-weight:600;color:var(--fam-t2);cursor:pointer;white-space:nowrap;
}
.fam-pill.solid{background:var(--fam-t1);border-color:var(--fam-t1);color:#0B0B0C;}

/* One child, one object: name, school, progress, and their latest note. The
   note strip used to be a separate floating box, which is why it read as an
   unloaded element rather than as part of anything. */
.fam-kid{background:var(--fam-card);border:1px solid var(--fam-line);border-radius:18px;margin-bottom:12px;overflow:hidden;}
.fam-kid-main{display:flex;align-items:center;gap:14px;padding:15px 16px 14px;cursor:pointer;}
.fam-kid-mid{flex:1;min-width:0;}
.fam-kid-name{font-size:1.06rem;font-weight:600;letter-spacing:-.012em;line-height:1.25;overflow-wrap:anywhere;}
.fam-kid-school{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--fam-t2);margin-top:3px;overflow-wrap:anywhere;}
.fam-dot{width:7px;height:7px;border-radius:99px;flex:none;}
.fam-kid-amt{font-size:1.35rem;font-weight:600;color:var(--owed);line-height:1;letter-spacing:-.02em;text-align:right;}
.fam-kid-amt u{display:block;text-decoration:none;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:5px;opacity:.85;}
.fam-ok{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--fam-t2);font-weight:500;white-space:nowrap;}
.fam-ok::before{
  content:"";width:15px;height:15px;border-radius:99px;flex:none;border:1.5px solid var(--fam-ok);opacity:.75;
  background:
    linear-gradient(45deg,transparent 46%,var(--fam-ok) 46%,var(--fam-ok) 60%,transparent 60%) no-repeat 3px 6px/5px 5px,
    linear-gradient(-45deg,transparent 46%,var(--fam-ok) 46%,var(--fam-ok) 60%,transparent 60%) no-repeat 5px 4px/7px 7px;
}
/* This product IS a stamp card. "1/7 months" makes a parent do arithmetic; a
   row of seven marks with one filled says it before it is read — and puts the
   school's colour somewhere legible, which a 10px uppercase caption was not. */
.fam-track{display:flex;gap:3px;padding:0 16px 14px;}
.fam-track i{height:4px;border-radius:99px;flex:1;background:rgba(255,255,255,.08);}
.fam-track i.on{background:var(--fam-paid,var(--fam-t2));opacity:.9;}
.fam-foot{display:flex;align-items:center;gap:9px;padding:11px 16px;border-top:1px solid var(--fam-line2);background:var(--fam-raise);cursor:pointer;}
.fam-foot-k{font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fam-t3);flex:none;}
.fam-foot-p{flex:1;min-width:0;font-size:.82rem;color:var(--fam-t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fam-foot-n{flex:none;font-size:.68rem;font-weight:700;color:#0B0B0C;background:var(--fam-t2);border-radius:99px;padding:1px 7px;}
.fam-foot-c{flex:none;color:var(--fam-t3);font-size:.78rem;}
.fam-note{border-top:1px solid var(--fam-line2);padding:12px 16px;cursor:pointer;background:var(--fam-raise);}
.fam-note-t{font-size:.86rem;line-height:1.35;overflow-wrap:anywhere;}
.fam-note-m{font-size:.7rem;color:var(--fam-t3);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.fam-note-b{font-size:.82rem;color:var(--fam-t2);line-height:1.5;white-space:pre-wrap;margin-top:8px;overflow-wrap:anywhere;}
.fam-tag{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--fam-line);border-radius:6px;padding:1px 6px;}
.fam-more{width:100%;text-align:left;background:var(--fam-raise);border:none;border-top:1px solid var(--fam-line2);padding:11px 16px;font-family:var(--f);font-size:.76rem;font-weight:600;color:var(--fam-t2);cursor:pointer;}
/* A child with several cards keeps a heading — that is where it earns its
   place, because it carries their combined total. */
.fam-sec-head{display:flex;align-items:center;gap:8px;padding:10px 4px;cursor:pointer;}
.fam-sec-head b{font-size:.88rem;font-weight:600;color:var(--fam-t1);}
.fam-sec-head span{font-size:.76rem;font-weight:500;color:var(--fam-t3);}
.fam-sec-head em{font-style:normal;font-size:.76rem;font-weight:600;color:var(--owed);}
.fam-sec-head i{margin-left:auto;font-style:normal;color:var(--fam-t3);font-size:.78rem;}
/* The details panel: what the total is made of, and who is clear. */
.fam-det{padding:13px 0 12px;border-bottom:1px solid var(--fam-line2);}
.fam-det:last-child{border-bottom:none;padding-bottom:2px;}
.fam-det-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.fam-det-nm{font-size:.88rem;font-weight:600;color:var(--fam-t1);overflow-wrap:anywhere;}
.fam-det-sch{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--fam-t3);margin-top:2px;overflow-wrap:anywhere;}
.fam-det-amt{font-size:.88rem;font-weight:600;color:var(--owed);flex:none;}
.fam-det-ok{font-size:.78rem;color:var(--fam-t2);flex:none;}
.fam-det-note{font-size:.76rem;color:var(--fam-t3);padding:6px 0 0 14px;}
.fam-mth{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0 0 14px;}
.fam-mth-nm{font-size:.82rem;color:var(--fam-t2);}
.fam-mth-part{font-size:.7rem;color:var(--fam-t3);margin-left:7px;}
.fam-mth-amt{font-size:.82rem;font-weight:600;color:var(--owed);flex:none;}

/* ===================== Student portal =====================================
   Scoped to .page.stu, the same way the family portal is scoped to .page.fam,
   and on the same tokens — so the two screens outside the school office match.
   The business dashboard is deliberately left on --bg/--bg2.

   Both panels here were --surface, a gradient running #14172A -> #0A0C16:
   blue 22 points ahead of red at the top, which is the cast they carried
   against the near-black ground. Flat charcoal now. */
.page.stu{
  --stu-bg:#0B0B0C; --stu-card:#161618; --stu-raise:#1D1D20;
  --stu-line:rgba(255,255,255,.07); --stu-line2:rgba(255,255,255,.045);
  --stu-t1:#F6F6F5; --stu-t2:#A3A3A9; --stu-t3:#6F6F77;
  background:var(--stu-bg);min-height:100vh;color:var(--stu-t1);
  font-variant-numeric:tabular-nums;
}
.stu .topbar h2{font-weight:600;letter-spacing:-.01em;}
/* Padding moves off the panel and onto the rows, so a divider can run the full
   width of the card instead of floating inside it. */
.stu .wsec{
  background:var(--stu-card);border:1px solid var(--stu-line);border-radius:18px;
  padding:0;margin:0 16px 12px;overflow:hidden;
}
.stu .ws-t{
  display:flex;align-items:center;gap:8px;margin:0;padding:13px 16px 12px;
  font-size:.7rem;font-weight:600;letter-spacing:.14em;color:var(--stu-t3);
}
/* One count on the heading, rather than a NEW pill on every row — a badge that
   marks all of them marks none of them. */
.stu-new{
  margin-left:auto;letter-spacing:0;text-transform:none;
  font-size:.7rem;font-weight:700;color:var(--accent-ink);background:var(--accent);
  border-radius:99px;padding:1px 7px;
}
.stu-ann{border-top:1px solid var(--stu-line2);padding:12px 16px;}
.stu-ann-t{font-size:.88rem;font-weight:500;color:var(--stu-t2);line-height:1.35;overflow-wrap:anywhere;}
.stu-ann.unread .stu-ann-t{font-weight:600;color:var(--stu-t1);}
.stu-ann-m{font-size:.7rem;color:var(--stu-t3);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.stu-tag{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--stu-line);border-radius:6px;padding:1px 6px;}
.stu-dot{width:6px;height:6px;border-radius:99px;background:var(--accent);flex:none;}
.stu-ann-b{font-size:.82rem;color:var(--stu-t2);line-height:1.5;white-space:pre-wrap;margin-top:7px;overflow-wrap:anywhere;}
/* Was centred, accent-coloured and heavier than the titles above it: the
   loudest thing in the card for the least important action in it. */
.stu-more{
  display:block;width:100%;text-align:left;background:var(--stu-raise);
  border:none;border-top:1px solid var(--stu-line2);padding:11px 16px;
  font-family:var(--f);font-size:.76rem;font-weight:600;color:var(--stu-t2);cursor:pointer;
}
/* Each payment row used background:var(--bg) — the PAGE colour — inside a
   panel lighter than it, so a child element was darker than its container and
   read as a hole punched through the card. Divided rows instead: nothing here
   is tappable, so nothing needs to look like a button. */
.stu .hist-item{
  background:none;border:none;border-top:1px solid var(--stu-line2);border-radius:0;
  padding:13px 16px;margin:0;align-items:baseline;gap:12px;
}
.stu .hi-amt{font-size:.95rem;font-weight:600;letter-spacing:-.01em;color:var(--stu-t1);}
.stu .hi-lbl{font-size:.7rem;color:var(--stu-t3);font-weight:500;margin-top:2px;}
.stu .hi-dt{font-size:.7rem;color:var(--stu-t3);font-weight:500;flex:none;}

/* ===================== Business dashboard =================================
   Scoped to .dash-shell. Rather than a new set of token names, this redefines
   the app's own tokens LOCALLY: custom properties inherit, so the several
   hundred inline var(--bg2) styles on this screen pick up the charcoal
   without any of them being rewritten. Nothing outside .dash-shell is
   affected — the landing page, login, and every other screen keep the global
   values. */
.dash-shell{
  --bg:#0B0B0C; --bg2:#161618; --bg3:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.06); --elev:#1D1D20;

  background:var(--bg);min-height:100vh;font-variant-numeric:tabular-nums;
}
/* Every card the same, with a lit top edge and a short sheen falling from it.
   The alternating row it replaces composited to rgb(20,22,27) against
   rgb(13,15,27) — blue landed on 27 either way, so the two rows differed in
   hue rather than value, and above 1024px the two-column grid turned
   "every other row" into "the right-hand column". */
.dash-shell .card{
  background-image:linear-gradient(180deg,rgba(255,255,255,.038) 0%,rgba(255,255,255,0) 38%);
  border-top-color:rgba(255,255,255,.14);
}
.dc-name{font-size:1.06rem;font-weight:600;color:#fff;letter-spacing:-.012em;overflow-wrap:anywhere;}
.dc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--text2);margin-top:3px;}
.dc-lev{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);}

.dc-owed{font-size:1.06rem;font-weight:600;color:var(--owed);letter-spacing:-.02em;text-align:right;flex:none;}
.dc-owed u{display:block;text-decoration:none;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-top:4px;}
.dc-ok{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text2);font-weight:500;white-space:nowrap;flex:none;}
.dc-ok::before{
  content:"";width:15px;height:15px;border-radius:99px;flex:none;border:1.5px solid var(--green);opacity:.75;
  background:
    linear-gradient(45deg,transparent 46%,var(--green) 46%,var(--green) 60%,transparent 60%) no-repeat 3px 6px/5px 5px,
    linear-gradient(-45deg,transparent 46%,var(--green) 46%,var(--green) 60%,transparent 60%) no-repeat 5px 4px/7px 7px;
}
.dc-track{display:flex;gap:3px;margin-top:11px;}
.dc-track i{height:4px;border-radius:99px;flex:1;background:rgba(255,255,255,.08);}
.dc-track i.on{background:var(--accent);opacity:.9;}

/* ===================== Owner screens: one shared skin =====================
   Every secondary screen the dashboard opens — Manage, Groups, Remind,
   Announcements, Export, Levels, Months — grew its own inline card and button
   styles, so the same control looks different depending on which screen you
   reached it from, and none of them match the student list.

   This is one skin they adopt a screen at a time, by adding scr to the page
   root. Tokens are the same values .dash-shell uses, so stepping from the
   dashboard into a screen it opened is not a change of surface. */
.page.scr, .reg-page.scr{
  --bg:#0B0B0C; --bg2:#161618; --bg3:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.06); --elev:#1D1D20;
  --surface:linear-gradient(160deg,#1D1D20 0%,#141416 100%);
  background:var(--bg);min-height:100vh;
}
/* Section labels take the school's accent, exactly as the settings sidebar
   group labels do. They were --text2 grey, which read as disabled. */
.scr-lbl{
  font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 12px;
}
/* A second section used to start immediately under the last control of the
   first, so its label read as a caption for the row above it. */
.scr .section + .section{margin-top:26px;}
.scr .topbar + .section{margin-top:6px;}
/* One card treatment, the student list's: charcoal with a lit top edge. */
.scr-card{
  background:var(--bg2);
  background-image:linear-gradient(180deg,rgba(255,255,255,.038) 0%,rgba(255,255,255,0) 38%);
  border:1px solid var(--border);border-top-color:rgba(255,255,255,.14);
  border-radius:20px;padding:14px 16px;margin-bottom:10px;
}
.scr-card-t{font-size:1.06rem;font-weight:600;color:#fff;letter-spacing:-.012em;overflow-wrap:anywhere;}
.scr-card-s{font-size:.82rem;color:var(--text2);margin-top:4px;line-height:1.5;overflow-wrap:anywhere;}
.scr-empty{font-size:.82rem;color:var(--text3);font-weight:500;margin-bottom:12px;}
/* One button family, at the radius the dashboard's + New already uses.
   Quiet by default; accent when it starts something; red when it destroys
   something. Destructive stays semantic and never follows the accent, the same
   way "owes" stays red whatever colour a school picks. */
.scr-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.scr-btn{

.scr-btn.danger:hover{background:rgba(239,68,68,.1);}

/* Settings. On a phone: the bottom sheet, unchanged — these classes carry the
   exact values that used to sit inline, so nothing about the phone rendering
   depends on anything below. On a desktop: a docked column, and the sheet is
   switched off entirely rather than restyled. */
/* touch-action:none on the backdrop so a drag started on the dim area is not a
   page scroll; overscroll-behavior:contain on the panel so reaching the end of
   the list does not hand the gesture to the page behind it. */
.set-ov{position:fixed;left:0;right:0;top:0;bottom:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;touch-action:none;overscroll-behavior:none;}
.set-pan{width:100%;max-width:430px;margin:0 auto;background:var(--menu-bg);border-top-left-radius:24px;border-top-right-radius:24px;padding:10px 0 24px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;box-shadow:0 -8px 40px rgba(0,0,0,.5);}
.set-grab{width:40px;height:5px;border-radius:99px;background:var(--text3);margin:0 auto 10px;}
.set-title{padding:4px 20px 10px;font-size:.7rem;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.16em;}
/* One grouping, one label, rendered by both the sheet and the column — the two
   read from the same SET_GROUPS, so they cannot drift apart. The label takes
   the school's own accent, the same variable the progress bars and the "owes
   €X" figures already read. */
.set-grp + .set-grp{margin-top:14px;}
.set-gl{padding:0 20px 4px;font-size:.6rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;}

/* The docked sidebar does not exist below the breakpoint at all. */
.dash-side{display:none;}
.dash-shell{display:block;}

@media (min-width:1024px){
  /* 1024px is where the dashboard already becomes app--wide and the card list
     goes two-up, so settings dock at the width the rest of the screen changes
     at rather than introducing a second breakpoint. */
  .dash-shell{display:flex;align-items:flex-start;}
  .dash-side{display:block;flex:none;width:250px;align-self:stretch;
    position:sticky;top:0;max-height:100vh;overflow-y:auto;
    background:var(--menu-bg);border-right:1px solid var(--border);padding:18px 0 24px;}
  .dash-side .set-gl{padding:0 18px 4px;}
  .dash-shell > .page{flex:1;min-width:0;}
  /* The sheet and its trigger are the phone's interaction; on desktop the
     settings are simply on the screen, so neither has anything left to do. */
  .set-ov{display:none;}
  .dash-gear{display:none;}
}

function PgLinkChild({ onBack, onLink, kids, onAssign, onCreateChild }) {
  const [code, setCode] = useState("");
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [linked, setLinked] = useState(null);
  const [newChild, setNewChild] = useState("");
  async function doLink() {
    if (!code.trim()) { setErr("Enter the share code."); return; }
    if (!pin) { setErr("Enter the PIN."); return; }
    setBusy(true); setErr("");
    const res = await onLink(code.trim(), pin);
    setBusy(false);
    if (res && res.locked) { setErr("Too many attempts. Try again in 15 minutes."); return; }
    if (res && res.error) { setErr("Please log in again."); return; }
    if (!res || !res.ok) { setErr("Wrong code or PIN."); return; }
    setLinked({ cardId: res.card_id, name: res.name || "Card" });
  }
  async function assignTo(childId) { if (linked) await onAssign(linked.cardId, childId); onBack(); }
  async function createAndAssign() {
    if (!newChild.trim()) return;
    const c = await onCreateChild(newChild.trim());
    if (c && c.id && linked) await onAssign(linked.cardId, c.id);
    onBack();
  }
  if (linked) {
    return (
      <div className="reg-page">
        <h2 style={{marginBottom:6}}>Card Linked</h2>
        <p>Assign <strong style={{color:"var(--text)"}}>{linked.name}</strong> to a child? Optional.</p>
        {kids.length>0 && (
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18}}>
            {kids.map(k=>(
              <button key={k.id} onClick={()=>assignTo(k.id)} style={{padding:"10px 16px",borderRadius:99,border:"1px solid var(--accent)",background:"rgba(255,255,255,.06)",color:"var(--text)",fontFamily:"var(--f)",fontWeight:700,fontSize:".85rem",cursor:"pointer"}}>{k.name}</button>
            ))}
          </div>
        )}
        <div className="ig"><label>Or create a new child</label>
          <div style={{display:"flex",gap:8}}>
            <input className="inp" style={{flex:1}} placeholder="Child name" value={newChild} onChange={e=>setNewChild(e.target.value)} />
            <button className="btn" style={{width:"auto",padding:"0 22px",marginTop:0}} onClick={createAndAssign}>Add</button>
          </div>
        </div>
        <button className="btn-ghost" onClick={()=>onBack()}>Skip — leave Unassigned</button>
      </div>
    );
  }
  return (
    <div className="reg-page">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <button className="tb-back" onClick={onBack}>←</button>
        <h2>Link a Child</h2>
      </div>
      <div className="info-box" style={{marginBottom:20}}>Enter the share code and PIN your student's business gave you.</div>
      <div className="ig"><label>Share Code</label>
        <input className="inp" placeholder="e.g. AQ3RG0" value={code}
          onChange={e=>{setCode(e.target.value.toUpperCase());setErr("");}} /></div>
      <div className="ig"><label>PIN</label>
        <input className="inp" type="password" inputMode="numeric" placeholder="4-digit PIN" maxLength={4} value={pin}
          onChange={e=>{setPin(e.target.value.replace(/\D/g,"").slice(0,4));setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&doLink()} /></div>
      {err && <div className="err">{err}</div>}
      <button className="btn" style={{marginTop:8}} onClick={doLink} disabled={busy}>{busy?"…":"Link Card"}</button>
    </div>
  );
}

function PgParentDashboard({ items, kids, announcements, annRead, onMarkAnnRead, onLink, onUnlink, onAssign, onCreateChild, onRenameChild, onDeleteChild, onLogout, onTeacher, onSettings }) {
  const [expanded, setExpanded] = useState({});
  const [openGroups, setOpenGroups] = useState({});
  const [notesOpen, setNotesOpen] = useState({});      // per "From the school" block
  const [annShowAll, setAnnShowAll] = useState({});     // per block
  const [annOpenItem, setAnnOpenItem] = useState({});   // per announcement
  const [dueOpen, setDueOpen] = useState(false);        // the combined-total breakdown
  const readSet = {}; (annRead||[]).forEach(id=>{readSet[id]=true;});
  const annAll = (announcements||[]).slice().sort((a,b)=>String(b.created_at||"").localeCompare(String(a.created_at||"")));
  const ANN_CAP = 4;

  function openAnnItem(a){
    setAnnOpenItem(s=>({ ...s, [a.id]: !s[a.id] }));
    if (!readSet[a.id] && onMarkAnnRead) onMarkAnnRead(a.id);
  }
  // Announcements carry only the school's name, so its accent is resolved via
  // the linked cards — the school label gets the same treatment here as on the
  // card rows rather than a generic colour.
  function annAccent(name){
    const it = (items||[]).find(x=>x.biz && x.biz.name===name);
    return bizPal(it && it.biz).acc;
  }

  const [manage, setManage] = useState(false);
  const [newChild, setNewChild] = useState("");
  const [renaming, setRenaming] = useState(null);

  // What is actually owed, per card. getStudentMonthStatus already knows about
  // inactive months, per-student pauses, enrolment start, fee history and
  // part-payments, so "Due now" is the same number the business side bills —
  // not a re-derivation that could drift from it. It counts a part-paid month's
  // shortfall too, which the old boolean "behind" flag missed entirely.
  const rows = items.map(it => {
    const biz = it.biz, card = it.card;
    const year = biz.year || new Date().getFullYear();
    const inactive = (biz.inactiveMonths || []).concat(card.pausedMonths || []);
    const es = card.enrollmentStart || null;
    const st = getStudentMonthStatus(card, biz, year);
    return { it, biz, card, childId:it.childId, pal:bizPal(biz),
             mp:monthsPaid(card.payments||{}, year, inactive, es),
             bc:billableCount(year, inactive, es),
             paid:totalPaid(card.payments||{}, card.history||[]),
             // Already computed and thrown away. Each entry carries the month,
             // the fee, what was paid against it and what is short — which is
             // exactly what "what is the €85 made of" needs.
             unpaid: st.unpaidMonths || [],
             due: Math.round(st.owedTotal) };
  });
  rows.sort((a,b)=> (b.due>0?1:0) - (a.due>0?1:0));

  const childIds = kids.map(k=>k.id);
  const assignedCount = rows.filter(r=>r.childId && childIds.includes(r.childId)).length;
  const grouped = kids.length>0 && assignedCount>0;
  const owing = rows.filter(r=>r.due>0);
  const totalDue = owing.reduce((a,r)=>a+r.due, 0);
  const childName = (id)=>{ const k=kids.find(x=>x.id===id); return k?k.name:null; };
  // The summary appears whenever anything is owed at all, not only when there
  // are several to combine. Hiding it for a single owing card meant the
  // top-of-screen answer to "what do I owe" disappeared the moment one child
  // paid up — and Copy summary went with it, leaving the parent who still owes
  // one school no way to send it. With one card it names who and where instead
  // of repeating a bare number.
  const showDueSummary = totalDue > 0;
  const single = owing.length === 1 ? owing[0] : null;
  // Named where there is one to name; counted, with the schools it spans,
  // where there is not.
  const owingSchools = [...new Set(owing.map(r=>r.biz.name))];


  const eyebrow = {fontSize:".64rem",fontWeight:800,textTransform:"uppercase",letterSpacing:".1em"};
  // Compares two spellings of the same person: "Afrodite Marina" vs
  // "Afrodite marina savva" are not equal, but "Christos Christou" written
  // twice with different spacing is.
  const norm = (x)=>String(x||"").toLowerCase().replace(/\s+/g," ").trim();

  // ---- one card row ------------------------------------------------------
  // The right-hand side used to be a coloured dot on every row, whether or not
  // anything was wrong. It now carries the one signal that matters: the amount
  // due, or a quiet "Up to date". Nothing owing means nothing shouting.
  function renderRow(r, titleOverride, footEl) {
    const isOpen = !!expanded[r.it.cardId];
    // "Afrodite Marina" as a heading with "Afrodite marina savva" directly
    // under it is a stutter, not two facts. Containment, not equality:
    // "Andreas" and "Andreas Christou" are one person written short and long.
    const title = titleOverride || r.card.name;
    const alsoCard = titleOverride && !norm(r.card.name).includes(norm(titleOverride)) ? r.card.name : null;
    // The months bar. bc is what this student is actually billed for — it
    // already accounts for inactive months, pauses and a mid-year start — so
    // the bar and the fraction can never disagree.
    const cells = Math.max(1, r.bc);
    return (
      <div key={r.it.cardId} className="fam-kid" style={{"--accent":r.pal.acc,"--fam-paid":r.pal.acc}}>
        <div className="fam-kid-main" onClick={()=>setExpanded(s=>({...s,[r.it.cardId]:!s[r.it.cardId]}))}>
          <div className="fam-kid-mid">
            {/* The child's name leads. The school used to sit above it in
                uppercase colour, which made the school the headline and the
                child the detail — backwards for a parent looking for their
                own child. */}
            <div className="fam-kid-name">{title}</div>
            <div className="fam-kid-school">
              <span className="fam-dot" style={{background:r.pal.acc}} />
              <span>{r.biz.name}{alsoCard ? " · "+alsoCard : ""}</span>
            </div>
          </div>
          <div style={{flex:"none"}}>
            {r.due>0
              ? <div className="fam-kid-amt">{"€"+r.due}<u>Due</u></div>
              : <div className="fam-ok">Up to date</div>}
          </div>
        </div>
        <div className="fam-track" role="img" aria-label={r.mp+" of "+cells+" months paid"}>
          {Array.from({length:cells}).map((_,i)=>(
            <i key={i} className={i < r.mp ? "on" : ""} />
          ))}
        </div>
        {footEl}
        {isOpen && (
          <div style={{padding:"0 12px 12px",borderTop:"1px solid var(--fam-line2)"}}>
            <BizCard biz={r.biz} card={r.card} isTeacher={false} onTap={null} inactiveMonths={r.biz.inactiveMonths} />
            {kids.length>0 && (
              <div style={{display:"flex",gap:6,flexWrap:"wrap",margin:"2px 0 8px",alignItems:"center"}}>
                <span style={{fontSize:".7rem",color:"var(--fam-t3)",fontWeight:600,textTransform:"uppercase",letterSpacing:".12em"}}>Child</span>
                {kids.map(k=>(
                  <button key={k.id} className={"fam-pill"+(r.childId===k.id?" solid":"")} onClick={()=>onAssign(r.it.cardId, k.id)}>{k.name}</button>
                ))}
                <button className={"fam-pill"+(!r.childId?" solid":"")} onClick={()=>onAssign(r.it.cardId, null)}>Unassigned</button>
              </div>
            )}
            <button className="fam-pill" style={{width:"100%",padding:"10px"}} onClick={()=>onUnlink(r.it.cardId, r.card.name)}>Unlink</button>
          </div>
        )}
      </div>
    );
  }

  // ---- "From the school" -------------------------------------------------
  // Notes sit with the child they concern rather than in one merged card above
  // everything, and — where a child has a single card — attached to that card
  // rather than floating under it as a box of their own.
  function renderNotes(blockId, secRows, attached) {
    // Targeting makes the per-child grouping exact rather than approximate.
    // Matching on the school alone would put "Sharks moves to Thursday" under a
    // sibling who is in Dolphins — the very confusion the targeting removes.
    const names = [], gids = [], cids = [];
    secRows.forEach(r=>{
      if (names.indexOf(r.biz.name)<0) names.push(r.biz.name);
      if (r.card.groupId && gids.indexOf(r.card.groupId)<0) gids.push(r.card.groupId);
      cids.push(r.it.cardId);
    });
    const mine = annAll.filter(a=>{
      if (names.indexOf(a.business_name)<0) return false;
      if (a.card_id)  return cids.indexOf(a.card_id)>=0;
      if (a.group_id) return gids.indexOf(a.group_id)>=0;
      return true;                                   // the whole school
    });
    if (mine.length===0) return null;
    const unread = mine.filter(a=>!readSet[a.id]).length;
    // Open when there is something unread, closed once it has all been seen —
    // and whatever the parent last chose wins over both.
    const open = (blockId in notesOpen) ? notesOpen[blockId] : unread > 0;
    const showAll = !!annShowAll[blockId];
    const shown = showAll ? mine : mine.slice(0, ANN_CAP);
    const hidden = mine.length - shown.length;
    const multi = names.length > 1;
    const body = (
      <>
        {/* Collapsed, this was an arrow and nothing else. It now carries the
            newest note's title, which is usually the whole message, and how
            many there are — so the tap is a known quantity. */}
        <div className="fam-foot" onClick={()=>setNotesOpen(s=>({...s,[blockId]:!open}))}>
          <span className="fam-foot-k">School</span>
          {/* Closed, this was an arrow and nothing else. Open, the notes speak
              for themselves and a preview would only repeat the first one. */}
          <span className="fam-foot-p" style={unread>0&&!open?{color:"var(--fam-t1)",fontWeight:600}:null}>
            {open ? "" : mine[0].title}
          </span>
          {unread>0
            ? <span className="fam-foot-n" style={{background:"var(--accent)"}} aria-label={unread+" unread"}>{unread}</span>
            : <span className="fam-foot-n" aria-label={mine.length+" notes"}>{mine.length}</span>}
          <span className="fam-foot-c">{open?"▾":"›"}</span>
        </div>
        {open && shown.map((a,idx)=>{
          const isOpen = !!annOpenItem[a.id];
          const isUnread = !readSet[a.id];
          // Only name the school when it changes from the row above, and only
          // when this block spans more than one school in the first place.
          const showSchool = multi && (idx===0 || shown[idx-1].business_name!==a.business_name);
          return (
            <div key={a.id} className="fam-note" onClick={()=>openAnnItem(a)}>
              {showSchool && (
                <div style={{fontSize:".68rem",fontWeight:600,letterSpacing:".1em",textTransform:"uppercase",color:annAccent(a.business_name),marginBottom:6}}>{a.business_name}</div>
              )}
              <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                <div style={{flex:1,minWidth:0}}>
                  <div className="fam-note-t" style={{fontWeight:isUnread?600:400,color:isUnread?"var(--fam-t1)":"var(--fam-t2)"}}>
                    {a.is_pinned && <span className="fam-tag" style={{color:"var(--accent)",marginRight:7,verticalAlign:"middle"}}>Pinned</span>}
                    {a.title}
                  </div>
                  <div className="fam-note-m">
                    <span>{relTime(a.created_at)}</span>
                    {/* Whether a note is for the school, the class or this one
                        child changes how a parent should read it, so it is
                        said rather than left to be inferred. */}
                    {a.target_kind==="group" && a.target_name && (
                      <span className="fam-tag" style={{color:annAccent(a.business_name)}}>{a.target_name}</span>
                    )}
                    {a.target_kind==="student" && (
                      <span className="fam-tag" style={{color:"var(--accent)"}}>Just for them</span>
                    )}
                  </div>
                </div>
                {isUnread && <span style={{width:7,height:7,borderRadius:99,flexShrink:0,marginTop:6,background:"var(--accent)"}} />}
                <span style={{flexShrink:0,color:"var(--fam-t3)",fontSize:".78rem",marginTop:2,display:"inline-block",transform:isOpen?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s ease-out"}}>⌄</span>
              </div>
              {isOpen && a.body && <div className="fam-note-b">{a.body}</div>}
              {isOpen && a.image_url && <img src={a.image_url} alt="" style={{display:"block",width:"100%",height:"auto",maxHeight:340,objectFit:"contain",borderRadius:12,marginTop:9,background:"var(--fam-bg)"}} />}
            </div>
          );
        })}
        {open && (hidden>0 || showAll) && (
          <button className="fam-more" onClick={()=>setAnnShowAll(s=>({...s,[blockId]:!s[blockId]}))}>
            {showAll ? "Show less" : ("Show all ("+mine.length+")")}
          </button>
        )}
      </>
    );
    // Attached: rendered inside the child's own card, so a child is one object
    // on the page rather than a card with a loose box under it.
    if (attached) return body;
    return <div key={blockId} className="fam-kid" style={{marginTop:-4}}>{body}</div>;
  }

  // ---- one child's section ----------------------------------------------
  function renderSection(id, title, secRows, nameIsChild) {
    const open = openGroups[id] !== false;
    const secDue = secRows.reduce((a,r)=>a+r.due, 0);
    // One card is the common case, and it was costing three lines: a header
    // naming the child, a "(1)" that counts nothing, and a card naming them
    // again. The child's name goes on the card and the header goes away, with
    // their school's notes attached to the same card.
    // Only for a real child: "Unassigned" is a category, not a name, so it
    // stays a heading rather than being stamped on a card as its title.
    if (secRows.length === 1 && nameIsChild) {
      return <div key={id}>{renderRow(secRows[0], title, renderNotes("notes-"+id, secRows, true))}</div>;
    }
    return (
      <div key={id} style={{marginBottom:6}}>
        <div className="fam-sec-head" onClick={()=>setOpenGroups(s=>({...s,[id]: open?false:true}))}>
          <b>{title}</b>
          <span>{"("+secRows.length+")"}</span>
          {secRows.length>1 && secDue>0 && <em>{"€"+secDue+" due"}</em>}
          <i>{open?"▾":"▸"}</i>
        </div>
        {open && <>
          {secRows.map(r=>renderRow(r))}
          {renderNotes("notes-"+id, secRows)}
        </>}
      </div>
    );
  }

  const unassigned = rows.filter(r=>!r.childId || !childIds.includes(r.childId));

  return (
    <div className="page fam">
      <div className="topbar">
        <h2 style={{minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>My Family</h2>
        {onTeacher && <button className="fam-out" onClick={onTeacher}>Business</button>}
        {onSettings && <button className="tb-act" onClick={onSettings} aria-label="Account settings">⚙</button>}
        <button className="fam-out" onClick={onLogout}>Sign out</button>
      </div>
      <div className="section">
        {/* The amount is the message. This was a bordered box whose loudest
            element was a full-width filled button for Copy summary — primary
            weight for a utility action, on a screen where the app cannot take
            the payment at all. */}
        {showDueSummary && (
          <div className="fam-due">
            <span className="fam-due-lbl">Due now</span>
            <div className="fam-due-line">
              <div className="fam-due-amt">{"€"+totalDue}</div>
              <div className="fam-due-who">
                {single
                  ? <><b>{childName(single.childId) || single.card.name}</b>{single.biz.name}</>
                  : <><b>{"across "+owing.length+" cards"}</b>{owingSchools.length>1 ? (owingSchools.length+" schools") : owingSchools[0]}</>}
              </div>
            </div>
            {/* One control, always available. The old pair was "Copy for
                school" — which put the two lines above it on the clipboard in
                worse formatting — and a "See breakdown" that only appeared when
                MORE THAN ONE card owed, so with one child owing it showed
                nothing, which is exactly when a parent asks why €85. */}
            <div className="fam-acts">
              <button className="fam-link" onClick={()=>setDueOpen(v=>!v)}>
                {dueOpen ? "Hide details" : "Show details"}
                <span style={{marginLeft:6,color:"var(--fam-t3)",fontSize:".7rem"}}>{dueOpen?"▴":"▾"}</span>
              </button>
            </div>
            {dueOpen && (
              <div style={{marginTop:14,borderTop:"1px solid var(--fam-line2)"}}>
                {/* Owing first, then the ones that are clear: the panel answers
                    both halves — what the money is, and who has paid. */}
                {rows.map(r=>{
                  const name = childName(r.childId) || r.card.name;
                  return (
                    <div key={r.it.cardId} className="fam-det">
                      <div className="fam-det-hd">
                        <div style={{minWidth:0}}>
                          <div className="fam-det-nm">{name}</div>
                          <div className="fam-det-sch">
                            <span style={{width:6,height:6,borderRadius:99,flex:"none",background:r.pal.acc}} />
                            <span>{r.biz.name}</span>
                          </div>
                        </div>
                        {r.due>0
                          ? <div className="fam-det-amt">{"€"+r.due}</div>
                          : <div className="fam-det-ok">Up to date</div>}
                      </div>
                      {r.due>0
                        ? r.unpaid.map(m=>(
                            <div key={m.ym} className="fam-mth">
                              <div className="fam-mth-nm">
                                {MONTHS[m.mi]}
                                {/* A month where part of the fee was handed over
                                    disappears into the lump sum otherwise — and
                                    it is the line a parent is least sure of. */}
                                {m.amount>0 && (
                                  <span className="fam-mth-part">{"€"+Math.round(m.amount)+" of €"+Math.round(m.fee)+" paid"}</span>
                                )}
                              </div>
                              <div className="fam-mth-amt">{"€"+Math.round(m.owed)}</div>
                            </div>
                          ))
                        : <div className="fam-det-note">{r.mp+" of "+r.bc+" months paid · €"+r.paid.toFixed(0)}</div>}
                    </div>
                  );
                })}
              </div>
            )}
            {/* PayStamp records cash a teacher has already taken. A button that
                said "Pay all" would take money from nobody while telling a
                parent they had paid, so this says where the money goes — once,
                quietly, instead of as the second-largest text in a box. */}
            <p className="fam-fine">Hand the money to your school — PayStamp keeps the record, it doesn't take payments.</p>
          </div>
        )}

        {/* Was "Cards" beside a button labelled "Children" — two words for the
            same thing, and the heading used app jargon no parent uses. */}
        <div className="sec-row">
          <div className="sec-title">{grouped ? "Children" : "Students"}</div>
          <div style={{display:"flex",gap:8}}>
            <button className="fam-pill" onClick={()=>setManage(m=>!m)}>{manage ? "Done" : "Edit"}</button>
            <button className="fam-pill solid" onClick={onLink}>Link a card</button>
          </div>
        </div>

        {manage && (
          <div className="wsec" style={{margin:"0 0 14px"}}>
            <div className="ws-t">Manage Children</div>
            {kids.length===0 && <div style={{fontSize:".8rem",color:"var(--text2)",fontWeight:600,marginBottom:10}}>No children yet. Add one to group cards.</div>}
            {kids.map(k=>(
              <div key={k.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                {renaming && renaming.id===k.id ? (
                  <>
                    <input className="ws-inp" style={{flex:1}} value={renaming.name} onChange={e=>setRenaming({id:k.id,name:e.target.value})} />
                    <button onClick={()=>{ if(renaming.name.trim()) onRenameChild(k.id, renaming.name.trim()); setRenaming(null); }} style={{padding:"8px 14px",borderRadius:10,border:"none",background:"var(--accent)",color:"var(--accent-ink)",fontFamily:"var(--f)",fontWeight:800,fontSize:".75rem",cursor:"pointer"}}>Save</button>
                  </>
                ) : (
                  <>
                    <div style={{flex:1,fontWeight:700,fontSize:".9rem"}}>{k.name}</div>
                    <button onClick={()=>setRenaming({id:k.id,name:k.name})} style={{padding:"6px 10px",borderRadius:8,border:"1px solid var(--border)",background:"transparent",color:"var(--text2)",fontFamily:"var(--f)",fontWeight:700,fontSize:".72rem",cursor:"pointer"}}>Rename</button>
                    <button onClick={()=>{ if(window.confirm("Delete child "+k.name+"? Their cards become Unassigned. Cards are not deleted.")) onDeleteChild(k.id); }} style={{padding:"6px 10px",borderRadius:8,border:"1px solid var(--border)",background:"transparent",color:"var(--red)",fontFamily:"var(--f)",fontWeight:700,fontSize:".72rem",cursor:"pointer"}}>Delete</button>
                  </>
                )}
              </div>
            ))}
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <input className="ws-inp" style={{flex:1}} placeholder="New child name" value={newChild} onChange={e=>setNewChild(e.target.value)} />
              <button onClick={async()=>{ if(newChild.trim()){ await onCreateChild(newChild.trim()); setNewChild(""); } }} style={{padding:"0 18px",borderRadius:12,border:"none",background:"var(--accent)",color:"var(--accent-ink)",fontFamily:"var(--f)",fontWeight:800,fontSize:".82rem",cursor:"pointer"}}>Add</button>
            </div>
          </div>
        )}

        {rows.length===0
          ? <div className="empty">No cards linked yet. Tap "+ Link".</div>
          : !grouped
            ? <>
                {rows.map(r=>renderRow(r))}
                {renderNotes("notes-all", rows)}
              </>
            : <>
                {kids.map(k=>{ const sec=rows.filter(r=>r.childId===k.id); return sec.length>0 ? renderSection(k.id, k.name, sec, true) : null; })}
                {unassigned.length>0 ? renderSection("unassigned", "Unassigned", unassigned) : null}
              </>
        }
      </div>
    </div>
  );
}

              Your login is removed and every student you've linked is unlinked. The schools keep their own payment records.

            <div style={{fontSize:".82rem",color:"var(--partial)",fontWeight:700}}>This cannot be undone.</div>
            <div style={{display:"flex",gap:8,marginTop:16}}>

              <button style={{flex:1,padding:"12px",background:"var(--red)",border:"none",borderRadius:12,color:"#fff",fontFamily:"var(--f)",fontWeight:800,fontSize:".92rem",cursor:"pointer"}}

function PgAnnouncements({ biz, onBack }) {
  const p = bizPal(biz);
  const [list, setList] = useState(null);
  const [editing, setEditing] = useState(null);
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");
  const [pinned, setPinned] = useState(false);
  // Audience as one string — "all", "g:<id>" or "c:<id>". Two selects, or
  // two ids kept in step by hand, both make "exactly one target" something
  // the UI has to remember; one value makes it impossible to get wrong.
  const [aud, setAud] = useState("all");
  const [expires, setExpires] = useState("");
  const [imgPreview, setImgPreview] = useState("");
  const [imgFile, setImgFile] = useState(null);
  const [removeImg, setRemoveImg] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);

  async function refresh(){ try { setList(await loadAnnouncements(biz.id)); } catch(e){ setMsg(e.message||"Load failed"); setList([]); } }
  useEffect(()=>{ refresh(); },[]);

  function openNew(){ setEditing({}); setTitle(""); setBody(""); setPinned(false); setAud("all"); setExpires(""); setImgPreview(""); setImgFile(null); setRemoveImg(false); setMsg(""); }
  function openEdit(a){ setEditing(a); setTitle(a.title||""); setBody(a.body||""); setPinned(!!a.is_pinned); setAud(a.card_id?("c:"+a.card_id):(a.group_id?("g:"+a.group_id):"all")); setExpires(a.expires_at?a.expires_at.slice(0,10):""); setImgPreview(a.image_url||""); setImgFile(null); setRemoveImg(false); setMsg(""); }
  function pickImage(e){ const f = e.target.files && e.target.files[0]; if (!f) return; setImgFile(f); setRemoveImg(false); setImgPreview(URL.createObjectURL(f)); }
  function pathOf(u){ try { return u.split("/announcement-images/")[1]||null; } catch(e){ return null; } }

  async function save(){
    if (!title.trim()) { setMsg("Title is required."); return; }
    setBusy(true); setMsg("");
    try {
      let imageUrl = editing.image_url || null;
      if (removeImg && !imgFile) { const p = editing.image_url && pathOf(editing.image_url); if (p) { try { await sb.storage.from("announcement-images").remove([p]); } catch(_){} } imageUrl = null; }
      if (imgFile) {
        const old = editing.image_url && pathOf(editing.image_url); if (old) { try { await sb.storage.from("announcement-images").remove([old]); } catch(_){} }
        const blob = await compressImage(imgFile, 1280, 0.7);
        const path = biz.id + "/ann-" + Date.now() + ".jpg";
        const { error: ue } = await sb.storage.from("announcement-images").upload(path, blob, {contentType:"image/jpeg", upsert:true});
        if (ue) throw ue;
        imageUrl = sb.storage.from("announcement-images").getPublicUrl(path).data.publicUrl;
      }
      const row = { business_id: biz.id, title: title.trim(), body: body.trim()||null, image_url: imageUrl, is_pinned: pinned, expires_at: expires ? new Date(expires+"T23:59:59").toISOString() : null,
        group_id: aud.indexOf("g:")===0 ? aud.slice(2) : null,
        card_id:  aud.indexOf("c:")===0 ? aud.slice(2) : null };
      if (pinned) { await sb.from("announcements").update({is_pinned:false}).eq("business_id", biz.id).neq("id", editing.id||"00000000-0000-0000-0000-000000000000"); }
      if (editing.id) { const { error } = await sb.from("announcements").update(row).eq("id", editing.id); if (error) throw error; }
      else { const { error } = await sb.from("announcements").insert(row); if (error) throw error; }
      setEditing(null); await refresh();
    } catch(e){ setMsg(e.message||"Save failed"); }
    finally { setBusy(false); }
  }

  async function del(a){
    if (!window.confirm("Delete this announcement? This cannot be undone.")) return;
    try { const p = a.image_url && pathOf(a.image_url); if (p) { try { await sb.storage.from("announcement-images").remove([p]); } catch(_){} }
      const { error } = await sb.from("announcements").delete().eq("id", a.id); if (error) throw error; await refresh();
    } catch(e){ setMsg(e.message||"Delete failed"); }
  }

  return (
    <div className="page" style={{"--accent":p.acc}}>
      <div className="topbar">
        <button className="tb-back" onClick={onBack}>←</button>
        <h2>Announcements</h2>
        <div style={{width:24}} />
      </div>
      {editing ? (
        <div className="section">
          <div className="wsec" style={{margin:"0 0 14px"}}>
            <div className="ws-t">{editing.id ? "Edit announcement" : "New announcement"}</div>
            <div className="ws-lbl">Title</div>
            <input className="ws-inp" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Pool closed next Monday" maxLength={120} />
            <div className="ws-lbl" style={{marginTop:12}}>Who sees this?</div>
            <select className="ws-inp" value={aud} onChange={e=>setAud(e.target.value)}>
              <option value="all">Everyone at the school</option>
              {(biz.groups||[]).length>0 && <optgroup label="One class">
                {(biz.groups||[]).map(g=><option key={g.id} value={"g:"+g.id}>{g.name}</option>)}
              </optgroup>}
              <optgroup label="One student">
                {Object.values(biz.cards||{}).slice().sort((a,b)=>(a.name||"").localeCompare(b.name||""))
                  .map(c=><option key={c.id} value={"c:"+c.id}>{c.name}</option>)}
              </optgroup>
            </select>
            {/* Say who it reaches in words as well as in a dropdown value —
                the difference between the whole school and one family is the
                kind of thing worth being sure about before tapping Post. */}
            <div style={{fontSize:".72rem",color:"var(--text2)",fontWeight:600,marginTop:6,lineHeight:1.5}}>
              {aud==="all" ? "Every family and student at the school."
               : aud.indexOf("g:")===0 ? ("Only families and students in " + (((biz.groups||[]).find(g=>g.id===aud.slice(2))||{}).name || "that class") + ".")
               : ("Only " + (((biz.cards||{})[aud.slice(2)]||{}).name || "that student") + " and their family.")}
            </div>
            <div className="ws-lbl" style={{marginTop:12}}>Message (optional)</div>
            <textarea className="ws-inp" value={body} onChange={e=>setBody(e.target.value)} placeholder="Short details…" rows={4} style={{resize:"vertical",minHeight:90}} maxLength={1000} />
            <div className="ws-lbl" style={{marginTop:12}}>Photo (optional)</div>
            {imgPreview ? (
              <div style={{position:"relative",marginBottom:8}}>
                <img src={imgPreview} alt="" style={{display:"block",width:"100%",height:"auto",maxHeight:280,objectFit:"contain",borderRadius:12,border:"1px solid var(--border)",background:"var(--bg)"}} />
                <button onClick={()=>{ setImgPreview(""); setImgFile(null); setRemoveImg(true); }} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,.7)",border:"none",color:"#fff",borderRadius:8,padding:"4px 10px",fontWeight:800,cursor:"pointer"}}>Remove</button>
              </div>
            ) : (
              <button onClick={()=>fileRef.current&&fileRef.current.click()} className="btn-undo" style={{flex:"none",width:"100%"}}>＋ Add photo</button>
            )}
            <input ref={fileRef} type="file" accept="image/*" onChange={pickImage} style={{display:"none"}} />
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:14}}>
              <div><div style={{fontWeight:800,fontSize:".9rem"}}>📌 Pin to top</div><div style={{fontSize:".72rem",color:"var(--text2)"}}>One pinned at a time</div></div>
              <button onClick={()=>setPinned(p=>!p)} style={{width:48,height:28,borderRadius:99,border:"none",cursor:"pointer",background:pinned?"var(--accent)":"var(--bg3)",position:"relative",flexShrink:0}}><span style={{position:"absolute",top:3,left:pinned?23:3,width:22,height:22,borderRadius:99,background:"#fff",transition:"left .15s"}} /></button>
            </div>
            <div className="ws-lbl" style={{marginTop:14}}>Expires (optional)</div>
            <input className="ws-inp" type="date" value={expires} onChange={e=>setExpires(e.target.value)} />
            {msg && <div className="err" style={{textAlign:"left"}}>{msg}</div>}
            <div className="btn-row">
              <button className="btn-add" onClick={save} disabled={busy||!title.trim()}>{busy?"Saving…":(editing.id?"Save":"Post")}</button>
              <button className="btn-undo" onClick={()=>setEditing(null)} disabled={busy}>Cancel</button>
            </div>
          </div>
        </div>
      ) : (
        <div className="section">
          <div className="sec-row"><div className="sec-title">Posts ({list?list.length:0})</div><button className="btn-new" onClick={openNew}>+ New</button></div>
          {msg && <div className="err" style={{textAlign:"left"}}>{msg}</div>}
          {list===null ? <div className="empty">Loading…</div>
           : list.length===0 ? <div className="empty">No announcements yet. Tap + New.</div>
           : list.map(a=>{ const expired = a.expires_at && new Date(a.expires_at) < new Date(); return (
            <div key={a.id} className="card" style={{cursor:"default"}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,flexWrap:"wrap"}}>
                {a.is_pinned && <span style={{fontSize:".6rem",fontWeight:800,color:"var(--accent)",background:"rgba(255,255,255,.06)",borderRadius:99,padding:"2px 7px"}}>📌 PINNED</span>}
                {!a.is_active && <span style={{fontSize:".6rem",fontWeight:800,color:"var(--text2)",background:"var(--bg3)",borderRadius:6,padding:"2px 7px"}}>HIDDEN</span>}
                {expired && <span style={{fontSize:".6rem",fontWeight:800,color:"var(--partial)",background:"rgba(251,191,36,.12)",borderRadius:6,padding:"2px 7px"}}>EXPIRED</span>}

// ---------------------------------------------------------------------------
// Bulk student import — Stage 1: upload + column mapping. Parsing is 100%
// client-side (SheetJS); nothing is sent to Supabase until Stage 3.
// ---------------------------------------------------------------------------
function normalizeHeader(h) {
  return String(h == null ? "" : h)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // strip Greek/Latin accents (tonos etc.)
    .toUpperCase().trim();
}
const IMPORT_NAME_HINTS = ["ΟΝΟΜΑ/ΕΠΙΘΕΤΟ", "NAME SURNAME", "ΟΝΟΜΑΤΕΠΩΝΥΜΟ", "ΟΝΟΜΑ", "NAME", "STUDENT"];
const IMPORT_PHONE_HINTS = [["ΤΗΛ", "prefix"], ["ΚΙΝΗΤΟ", "contains"], ["PHONE", "contains"], ["MOBILE", "contains"]];
const IMPORT_FEE_HINTS = ["ΔΙΔΑΚΤΡΑ", "ΠΟΣΟ", "FEE", "PRICE", "AMOUNT"];
function suggestContainsColumn(headers, hints, exclude) {
  for (const hint of hints) {
    const nh = normalizeHeader(hint);
    for (let i = 0; i < headers.length; i++) {
      if (exclude.has(i)) continue;
      if (normalizeHeader(headers[i]).includes(nh)) return i;
    }
  }
  return null;
}
function suggestPhoneColumn(headers, exclude) {
  for (const [kw, mode] of IMPORT_PHONE_HINTS) {
    const nh = normalizeHeader(kw);
    for (let i = 0; i < headers.length; i++) {
      if (exclude.has(i)) continue;
      const H = normalizeHeader(headers[i]);
      if (mode === "prefix" ? H.startsWith(nh) : H.includes(nh)) return i;
    }
  }
  return null;
}

function normalizePhone(raw) {
  if (raw == null) return null;
  const s = String(raw).trim();
  if (!s) return null;
  // Keep digits and a leading '+' only; drop spaces, dashes, dots, parens, etc.
  const cleaned = s.replace(/[^\d+]/g, "");
  const hasPlus = cleaned.charAt(0) === "+";
  const digits = cleaned.replace(/\+/g, "");
  if (!digits) return null;

  let intl = null; // full international digits, no '+'
  if (hasPlus) {
    intl = digits;
  } else if (digits.slice(0, 2) === "00") {
    intl = digits.slice(2); // "00" international dialing prefix used instead of '+'
  } else if (digits.length === 8) {
    intl = "357" + digits; // Cyprus local (mobiles start 9, landlines 2, etc.)
  } else if (digits.length === 10 && (digits.charAt(0) === "6" || digits.charAt(0) === "2")) {
    intl = "30" + digits; // Greek local (mobiles start 6, landlines start 2)
  } else if (digits.length === 11 && digits.slice(0, 3) === "357") {
    intl = digits; // CY country code present but Excel dropped the leading 00 (numeric cell)
  } else if (digits.length === 12 && digits.slice(0, 2) === "30") {
    intl = digits; // same, for Greece
  }
  if (!intl || intl.length < 8 || intl.length > 15 || !/^\d+$/.test(intl)) return null;
  return "+" + intl;
}

// A phone number alone does NOT identify a duplicate: siblings routinely
// share a parent's phone, so two different students with the same number are
// normal, not an error. A duplicate is the same phone AND the same name —
// i.e. the same student's row entered twice.
function importDupeKey(phone, name) { return phone + "||" + normalizeHeader(name); }

// Turns raw parsed rows into validated import rows. Runs top-to-bottom so
// duplicate detection sees earlier rows (and pre-existing students) before
// later ones — order matters for which occurrence gets flagged.
function buildImportRows(rawRows, headers, nameCol, phoneCol, feeCol, overrides, existingKeys) {
  const nI = nameCol === "" ? null : parseInt(nameCol, 10);
  const pI = phoneCol === "" ? null : parseInt(phoneCol, 10);
  const fI = feeCol === "" ? null : parseInt(feeCol, 10);
  const seen = new Set(existingKeys);
  const out = [];
  const matchesHeader = (col, val) => col != null && normalizeHeader(val) !== "" && normalizeHeader(headers[col]) === normalizeHeader(val);

  rawRows.forEach((r, idx) => {
    const ov = overrides[idx] || {};
    const rawName = ov.name != null ? ov.name : (nI != null ? r[nI] : "");
    const rawPhone = ov.phone != null ? ov.phone : (pI != null ? r[pI] : "");
    const rawFee = ov.fee != null ? ov.fee : (fI != null ? r[fI] : "");
    const name = String(rawName == null ? "" : rawName).trim();
    const phoneRaw = String(rawPhone == null ? "" : rawPhone).trim();
    const phone = normalizePhone(rawPhone);
    const feeRaw = String(rawFee == null ? "" : rawFee).trim();
    const feeNum = feeRaw === "" ? null : parseFloat(feeRaw.replace(",", "."));
    const feeValid = feeRaw === "" || (feeNum != null && !isNaN(feeNum) && feeNum >= 0);

    if (!name && !phoneRaw) return; // fully empty row -> silently excluded
    if (matchesHeader(nI, rawName) && (pI == null || matchesHeader(pI, rawPhone))) return; // repeated header row -> excluded

    let status;
    if (!name) status = "missing_name";
    else if (!phone) status = "missing_phone";
    else if (seen.has(importDupeKey(phone, name))) status = "duplicate";
    else status = "ok";
    if (phone && (status === "ok" || status === "duplicate")) seen.add(importDupeKey(phone, name));

    out.push({ rowIdx: idx, name, phone, phoneRaw, fee: feeValid && feeNum != null ? feeNum : null, feeRaw, feeValid, status });
  });
  return out;
}
const IMPORT_STATUS_LABEL = {
  ok: "OK",
  missing_name: "Missing name / Λείπει το όνομα",
  missing_phone: "Missing or invalid phone / Λείπει ή μη έγκυρο τηλέφωνο",
  duplicate: "Duplicate / Διπλότυπο",
};
const IMPORT_STATUS_COLOR = { ok: "var(--green)", missing_name: "var(--red)", missing_phone: "var(--red)", duplicate: "var(--partial)" };

        const nonBlank = raw.filter(r => (r || []).some(c => String(c == null ? "" : c).trim() !== ""));
        if (!nonBlank.length) throw new Error("no-rows");

        if (!body.length) throw new Error("no-data-rows");

      }
