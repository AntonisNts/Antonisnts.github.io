async function compressImage(file, maxEdge, quality) {

    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      const s = Math.min(1, (maxEdge||1280) / Math.max(w, h));
      w = Math.max(1, Math.round(w*s)); h = Math.max(1, Math.round(h*s));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      cv.toBlob(b => { b ? resolve(b) : reject(new Error("Image compression failed")); }, "image/jpeg", quality||0.7);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read image")); };
    img.src = url;
  });
}

}  function PgReveal({ card, onDone }) {   return (     <div className="reg-page">       <h2 style={{marginBottom:4}}>Card Created</h2>       <p>Share the code and PIN with the student.</p>       <div className="reveal-box">         <div className="rv-lbl">Student Code</div>         <div className="rv-val">{card.shareCode}</div>         <div className="rv-sep" />         <div className="rv-lbl">PIN</div>         <div className="rv-pin">{card.pin}</div>       </div>       <div className="info-box" style={{marginBottom:16}}>Write these down now.</div>       <button className="btn" onClick={onDone}>Done</button>     </div>   ); }  function PgCard({ biz, card, onBack, onUpdate, onRemove }) {
  const [amount, setAmount] = useState("");

  const [sendLang, setSendLang] = useState(card.language||"EN");

  const _payYears = Object.keys(card.payments||{}).map(k=>parseInt(k.slice(0,4),10)).filter(y=>!isNaN(y));
  const minYear = _payYears.length ? Math.min(biz.year, ..._payYears) : biz.year;

      <div className="ig"><label>Business Name</label><input className="inp" placeholder="e.g. Swim Smooth" value={v.name} onChange={e=>setV(p=>({...p,name:e.target.value}))} /></div>
      <div className="ig"><label>Type</label>
        <select className="inp" value={v.type} onChange={e=>setV(p=>({...p,type:e.target.value}))}>
          {TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
      <div className="ig"><label>Monthly Fee</label><input className="inp" type="number" placeholder="e.g. 50" value={v.fee} onChange={e=>setV(p=>({...p,fee:e.target.value}))} /></div>
      {err && <div className="err">{err}</div>}
      <button className="btn" style={{marginTop:8}} onClick={doCreate} disabled={busy}>{busy?"…":"Create Business"}</button>
    </div>
  );
}

function PgParentAuth({ onBack }) {
  const [tab, setTab] = useState("login");
  const [email, setEmail] = useState("");
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);
  async function go() {
    setErr(""); setInfo("");
    if (!email.trim()||!email.includes("@")) { setErr("Enter a valid email."); return; }
    if (!pwd) { setErr("Enter your password."); return; }
    if (tab==="register" && pwd.length<6) { setErr("Password must be at least 6 characters."); return; }
    setBusy(true);
    if (tab==="login") {
      const { error } = await sb.auth.signInWithPassword({ email:email.trim(), password:pwd });
      setBusy(false);
      if (error) { setErr(error.message); return; }
    } else {
      const { error } = await sb.auth.signUp({ email:email.trim(), password:pwd, options:{ data:{ role:"parent" } } });
      setBusy(false);
      if (error) { setErr(error.message); return; }
      setInfo("Account created. Check your email to confirm, then log in.");
      setTab("login"); setPwd("");
    }
  }
  return (
    <div className="login-page">
      <button className="tb-back" style={{marginBottom:16}} onClick={onBack}>← Back</button>
      <h1>Family Account</h1>
      <p>Log in to see all your students' cards in one place.</p>
      <a href="/help" style={{display:"block",textAlign:"center",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,padding:"11px",color:"var(--violet-glow)",fontWeight:700,fontSize:".82rem",textDecoration:"none",marginBottom:18}}>📘 New here? Read the parent guide</a>
      <div style={{display:"flex",gap:8,marginBottom:18}}>
        {[["login","Log In"],["register","Sign Up"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setTab(v);setErr("");setInfo("");}} style={{flex:1,padding:"10px",borderRadius:12,border:"1px solid "+(tab===v?"var(--violet)":"var(--border)"),background:tab===v?"var(--violet)":"var(--bg2)",color:tab===v?"#fff":"var(--text2)",fontFamily:"var(--f)",fontWeight:800,fontSize:".82rem",cursor:"pointer",textTransform:"uppercase",letterSpacing:".1em"}}>{l}</button>
        ))}
      </div>
      <div className="ig"><label>Email</label>
        <input className="inp" type="email" placeholder="you@example.com" value={email}
          onChange={e=>{setEmail(e.target.value);setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&go()} /></div>
      <div className="ig"><label>Password</label>
        <input className="inp" type="password" placeholder={tab==="register"?"At least 6 characters":"Your password"} value={pwd}
          onChange={e=>{setPwd(e.target.value);setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&go()} /></div>
      {err && <div className="err">{err}</div>}
      {info && <div className="info-box" style={{marginBottom:12}}>{info}</div>}
      <button className="btn" onClick={go} disabled={busy}>{busy?"…":(tab==="login"?"Log In":"Create Account")}</button>
      <p style={{fontSize:".72rem",color:"var(--text2)",textAlign:"center",marginTop:18,lineHeight:1.5}}>By continuing, you acknowledge our <a href="/privacy" style={{color:"var(--violet-glow)"}}>Privacy Policy</a> and <a href="/terms" style={{color:"var(--violet-glow)"}}>Terms of Service</a>.</p>
    </div>
  );
}

function PgLinkChild({ onBack, onLink, kids, onAssign, onCreateChild }) {
  const [code, setCode] = useState("");
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [linked, setLinked] = useState(null);
  const [newChild, setNewChild] = useState("");
  async function doLink() {
    if (!code.trim()) { setErr("Enter the share code."); return; }
    if (!pin) { setErr("Enter the PIN."); return; }
    setBusy(true); setErr("");
    const res = await onLink(code.trim(), pin);
    setBusy(false);
    if (res && res.locked) { setErr("Too many attempts. Try again in 15 minutes."); return; }
    if (res && res.error) { setErr("Please log in again."); return; }
    if (!res || !res.ok) { setErr("Wrong code or PIN."); return; }
    setLinked({ cardId: res.card_id, name: res.name || "Card" });
  }
  async function assignTo(childId) { if (linked) await onAssign(linked.cardId, childId); onBack(); }
  async function createAndAssign() {
    if (!newChild.trim()) return;
    const c = await onCreateChild(newChild.trim());
    if (c && c.id && linked) await onAssign(linked.cardId, c.id);
    onBack();
  }
  if (linked) {
    return (
      <div className="reg-page">
        <h2 style={{marginBottom:6}}>Card Linked</h2>
        <p>Assign <strong style={{color:"var(--text)"}}>{linked.name}</strong> to a child? Optional.</p>
        {kids.length>0 && (
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18}}>
            {kids.map(k=>(
              <button key={k.id} onClick={()=>assignTo(k.id)} style={{padding:"10px 16px",borderRadius:20,border:"1px solid var(--violet)",background:"var(--bg2)",color:"#fff",fontFamily:"var(--f)",fontWeight:700,fontSize:".85rem",cursor:"pointer"}}>{k.name}</button>
            ))}
          </div>
        )}
        <div className="ig"><label>Or create a new child</label>
          <div style={{display:"flex",gap:8}}>
            <input className="inp" style={{flex:1}} placeholder="Child name" value={newChild} onChange={e=>setNewChild(e.target.value)} />
            <button className="btn" style={{width:"auto",padding:"0 22px",marginTop:0}} onClick={createAndAssign}>Add</button>
          </div>
        </div>
        <button className="btn-ghost" onClick={()=>onBack()}>Skip — leave Unassigned</button>
      </div>
    );
  }
  return (
    <div className="reg-page">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <button className="tb-back" onClick={onBack}>←</button>
        <h2>Link a Child</h2>
      </div>
      <div className="info-box" style={{marginBottom:20}}>Enter the share code and PIN your student's business gave you.</div>
      <div className="ig"><label>Share Code</label>
        <input className="inp" placeholder="e.g. AQ3RG0" value={code}
          onChange={e=>{setCode(e.target.value.toUpperCase());setErr("");}} /></div>
      <div className="ig"><label>PIN</label>
        <input className="inp" type="password" inputMode="numeric" placeholder="4-digit PIN" maxLength={4} value={pin}
          onChange={e=>{setPin(e.target.value.replace(/\D/g,"").slice(0,4));setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&doLink()} /></div>
      {err && <div className="err">{err}</div>}
      <button className="btn" style={{marginTop:8}} onClick={doLink} disabled={busy}>{busy?"…":"Link Card"}</button>
    </div>
  );
}

function PgParentDashboard({ items, kids, announcements, annRead, onMarkAnnRead, onLink, onUnlink, onAssign, onCreateChild, onRenameChild, onDeleteChild, onLogout, onTeacher, onSettings }) {
  const [expanded, setExpanded] = useState({});
  const [openGroups, setOpenGroups] = useState({});
  const [annSecOpen, setAnnSecOpen] = useState(false);   // announcements section, collapsed by default
  const [annShowAll, setAnnShowAll] = useState(false);   // "Show all" within the expanded section
  const [annOpenItem, setAnnOpenItem] = useState({});    // per-announcement expand (read items + "More")
  const readSet = {}; (annRead||[]).forEach(id=>{readSet[id]=true;});
  // Single merged feed across every linked school, newest first.
  const annAll = (announcements||[]).slice().sort((a,b)=>String(b.created_at||"").localeCompare(String(a.created_at||"")));
  const annUnread = annAll.filter(a=>!readSet[a.id]);
  const annReadItems = annAll.filter(a=>readSet[a.id]);
  // Every announcement renders as the same compact row. An earlier version gave
  // the newest two a tall card and the rest a thin row, but with several unread
  // items from one school that split looked arbitrary — the size implied a
  // status difference that didn't exist — and the tall cards wasted height when
  // an announcement had little or no body. One row shape, distinguished by
  // weight/fill/dot instead of size, keeps the block short so the CARDS section
  // (the reason parents open this screen) stays on screen.
  // Strictly newest-first, with read state never affecting order. Sorting unread
  // ahead of read makes an item jump the moment you tap it — it becomes read,
  // moves to the back, and with a cap in place can vanish out of the list before
  // you've read the body you just opened. Unread is signalled by fill, weight
  // and dot instead, and the "N new" badge plus "Show all" cover any unread item
  // sitting below the cap.
  const ANN_CAP = 4;
  const annOrdered = annAll;
  const annShown = annShowAll ? annOrdered : annOrdered.slice(0, ANN_CAP);
  const annHidden = annOrdered.length - annShown.length;
  const annNewest = annOrdered[0];
  // A tap always toggles the body and marks an unread item read. An earlier
  // version deliberately collapsed on the read-marking tap, which suited the
  // old layout where unread items were tall cards already showing a preview of
  // the body. In this uniform list a row shows only title and time, so that
  // same tap would clear the dot and reveal nothing — a dead interaction.
  function openAnnItem(a){
    setAnnOpenItem(s=>({ ...s, [a.id]: !s[a.id] }));
    if (!readSet[a.id] && onMarkAnnRead) onMarkAnnRead(a.id);
  }
  // Announcements only carry the school's name, so resolve its palette accent
  // via the linked cards — this gives the school label the same treatment it
  // has on the card rows rather than a generic colour.
  function annAccent(name){
    const it = (items||[]).find(x=>x.biz && x.biz.name===name);
    return getPal(it && it.biz ? it.biz.type : "Other").acc;
  }
  const [manage, setManage] = useState(false);
  const [newChild, setNewChild] = useState("");
  const [renaming, setRenaming] = useState(null);
  // Reuse the existing stacking logic (billableMi/billableCount/monthsPaid/totalPaid).
  const rows = items.map(it => {
    const biz = it.biz, card = it.card;
    const year = biz.year || new Date().getFullYear();
    const inactive = (biz.inactiveMonths || []).concat(card.pausedMonths || []);
    const es = card.enrollmentStart || null;
    const pmts = card.payments || {};
    const nowym = nowYM();
    let behind = false;
    for (let mi=0; mi<12; mi++) {
      if (billableMi(mi, year, inactive, es) && ymOf(year,mi) <= nowym && !(pmts[ymOf(year,mi)]||{}).paid) { behind = true; break; }
    }
    return { it, biz, card, childId:it.childId, pal:getPal(biz.type), mp:monthsPaid(pmts, year, inactive, es), bc:billableCount(year, inactive, es), paid:totalPaid(pmts, card.history||[]), behind };
  });
  rows.sort((a,b)=> a.behind===b.behind ? 0 : (a.behind ? -1 : 1));
  const need = rows.filter(r=>r.behind).length;
  const childIds = kids.map(k=>k.id);
  const assignedCount = rows.filter(r=>r.childId && childIds.includes(r.childId)).length;
  const grouped = kids.length>0 && assignedCount>0;

  function renderRow(r) {
    const isOpen = !!expanded[r.it.cardId];
    return (
      <div key={r.it.cardId} style={{marginBottom:10}}>
        <div onClick={()=>setExpanded(s=>({...s,[r.it.cardId]:!s[r.it.cardId]}))} style={{display:"flex",alignItems:"center",gap:12,background:"var(--bg2)",border:"1px solid "+(isOpen?"rgba(99,102,241,.35)":"var(--border)"),borderRadius:16,padding:"13px 16px",cursor:"pointer"}}>
          <div style={{width:40,height:40,borderRadius:12,background:"rgba(255,255,255,.06)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.3rem",flexShrink:0}}>{r.pal.icon}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:".64rem",fontWeight:800,color:r.pal.acc,textTransform:"uppercase",letterSpacing:".1em",marginBottom:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.biz.name}</div>
            <div style={{fontSize:"1rem",fontWeight:700,color:"#fff",marginBottom:2}}>{r.card.name}</div>
            <div style={{fontSize:".72rem",fontWeight:600,color:"var(--text2)"}}>{r.mp+"/"+r.bc+" months · €"+r.paid.toFixed(0)+" paid"}</div>
          </div>
          <div style={{width:12,height:12,borderRadius:99,flexShrink:0,background:r.behind?"var(--red)":"var(--green)",boxShadow:r.behind?"0 0 8px rgba(239,68,68,.6)":"0 0 8px rgba(16,185,129,.5)"}} />
        </div>
        {isOpen && (
          <div style={{marginTop:8}}>
            <BizCard biz={r.biz} card={r.card} isTeacher={false} onTap={null} inactiveMonths={r.biz.inactiveMonths} />
            {kids.length>0 && (
              <div style={{display:"flex",gap:6,flexWrap:"wrap",margin:"2px 0 8px",alignItems:"center"}}>
                <span style={{fontSize:".66rem",color:"var(--text2)",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em"}}>Child:</span>
                {kids.map(k=>(
                  <button key={k.id} onClick={()=>onAssign(r.it.cardId, k.id)} style={{padding:"6px 12px",borderRadius:20,border:"1px solid "+(r.childId===k.id?"var(--violet)":"var(--border)"),background:r.childId===k.id?"var(--violet)":"var(--bg2)",color:r.childId===k.id?"#fff":"var(--text2)",fontFamily:"var(--f)",fontSize:".72rem",fontWeight:700,cursor:"pointer"}}>{k.name}</button>
                ))}
                <button onClick={()=>onAssign(r.it.cardId, null)} style={{padding:"6px 12px",borderRadius:20,border:"1px solid "+(!r.childId?"var(--violet)":"var(--border)"),background:!r.childId?"var(--violet)":"var(--bg2)",color:!r.childId?"#fff":"var(--text2)",fontFamily:"var(--f)",fontSize:".72rem",fontWeight:700,cursor:"pointer"}}>Unassigned</button>
              </div>
            )}
            <button onClick={()=>onUnlink(r.it.cardId, r.card.name)} style={{width:"100%",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,padding:"10px",fontFamily:"var(--f)",fontWeight:700,fontSize:".78rem",color:"var(--text2)",cursor:"pointer"}}>Unlink</button>
          </div>
        )}
      </div>
    );
  }

  function renderSection(id, title, secRows) {
    const open = openGroups[id] !== false;
    const groupBehind = secRows.some(r=>r.behind);
    return (
      <div key={id} style={{marginBottom:6}}>
        <div onClick={()=>setOpenGroups(s=>({...s,[id]: open?false:true}))} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 4px",cursor:"pointer"}}>
          <span style={{fontSize:".82rem",fontWeight:800,color:"#fff"}}>{title}</span>
          <span style={{fontSize:".72rem",fontWeight:700,color:"var(--text2)"}}>{"("+secRows.length+")"}</span>
          {groupBehind && <span style={{width:8,height:8,borderRadius:99,background:"var(--red)"}} />}
          <span style={{marginLeft:"auto",color:"var(--text2)",fontSize:".8rem"}}>{open?"▾":"▸"}</span>
        </div>
        {open && secRows.map(renderRow)}
      </div>
    );
  }

  const unassigned = rows.filter(r=>!r.childId || !childIds.includes(r.childId));

  return (
    <div className="page">
      <div className="topbar">
        <h2 style={{minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>My Family</h2>
        <div style={{display:"flex",gap:8,flexShrink:0,alignItems:"center"}}>
          {onTeacher && <button className="tb-act" onClick={onTeacher} style={{fontWeight:800,whiteSpace:"nowrap",flexShrink:0}}>Business</button>}
          {onSettings && <button className="tb-act" onClick={onSettings} style={{fontWeight:800,whiteSpace:"nowrap",flexShrink:0}} aria-label="Account settings">⚙</button>}
          <button onClick={onLogout} style={{flexShrink:0,whiteSpace:"nowrap",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:10,padding:"7px 14px",fontFamily:"var(--f)",fontSize:".78rem",fontWeight:800,color:"var(--text)",cursor:"pointer"}}>Sign out</button>
        </div>
      </div>
      <div className="section">
        {rows.length>0 && (
          <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,padding:"10px 14px",marginBottom:14,fontSize:".78rem",fontWeight:700,color:"var(--text2)"}}>
            {rows.length+(rows.length===1?" card":" cards")+" · "}
            <span style={{color:need>0?"var(--red)":"var(--green)"}}>{need+(need===1?" needs":" need")+" attention"}</span>
          </div>
        )}

        {annAll.length>0 && (
          <div style={{marginBottom:10}}>
            {/* Rendered with the exact anatomy of a card row (renderRow): same
                40px icon tile, same three-line stack \u2014 accent eyebrow, white
                title, muted sub \u2014 and the same status dot on the right. It is
                the announcements "card", sitting alongside the student cards
                rather than looking like a separate widget bolted above them.
                Collapsed it costs one row; the newest headline still shows, so
                the row carries information rather than just a count. */}
            <div onClick={()=>setAnnSecOpen(v=>!v)} style={{display:"flex",alignItems:"center",gap:12,background:"var(--bg2)",border:"1px solid "+(annSecOpen?"rgba(99,102,241,.35)":"var(--border)"),borderRadius:16,padding:"13px 16px",cursor:"pointer"}}>
              <div style={{width:40,height:40,borderRadius:12,background:"rgba(255,255,255,.06)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.3rem",flexShrink:0}}>📣</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:".64rem",fontWeight:800,color:"var(--violet-glow)",textTransform:"uppercase",letterSpacing:".1em",marginBottom:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>Announcements</div>
                <div style={{fontSize:"1rem",fontWeight:700,color:"#fff",marginBottom:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{annNewest ? annNewest.title : "Announcements"}</div>
                <div style={{fontSize:".72rem",fontWeight:600,color:"var(--text2)"}}>
                  {(annUnread.length>0 ? annUnread.length+" new" : annAll.length+(annAll.length===1?" announcement":" announcements"))
                    + (annNewest ? " \u00b7 "+relTime(annNewest.created_at) : "")}
                </div>
              </div>
              <div style={{width:12,height:12,borderRadius:99,flexShrink:0,background:annUnread.length>0?"var(--red)":"var(--green)",boxShadow:annUnread.length>0?"0 0 8px rgba(239,68,68,.6)":"0 0 8px rgba(16,185,129,.5)"}} />
            </div>
            {annSecOpen && (<div style={{marginTop:8}}>
{annShown.map((a,idx)=>{
              const open = !!annOpenItem[a.id];
              const isUnread = !readSet[a.id];
              // Only label the school when it changes from the row above —
              // repeating it on every row is noise when a run of announcements
              // comes from the same school.
              const showSchool = idx===0 || annShown[idx-1].business_name!==a.business_name;
              return (
                <div key={a.id} onClick={()=>openAnnItem(a)} style={{background:isUnread?"var(--bg2)":"var(--bg)",border:"1px solid "+(isUnread?"rgba(99,102,241,.28)":"var(--border)"),borderRadius:14,padding:"11px 14px",marginBottom:8,cursor:"pointer"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{flex:1,minWidth:0}}>
                      {showSchool && (
                        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                          {a.is_pinned && <span style={{fontSize:".54rem",fontWeight:800,color:"var(--violet-glow)",background:"rgba(99,102,241,.15)",borderRadius:5,padding:"1px 6px"}}>PINNED</span>}
                          <span style={{fontSize:".62rem",fontWeight:800,color:annAccent(a.business_name),textTransform:"uppercase",letterSpacing:".1em",opacity:isUnread?1:.6}}>{a.business_name}</span>
                        </div>
                      )}
                      <div style={{fontSize:".86rem",fontWeight:isUnread?800:600,color:isUnread?"#fff":"var(--text2)",whiteSpace:open?"normal":"nowrap",overflow:"hidden",textOverflow:"ellipsis",overflowWrap:"anywhere"}}>

                    <span style={{flexShrink:0,color:"var(--text3)",fontSize:".8rem",lineHeight:1,display:"inline-block",transform:open?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s ease-out"}}>⌄</span>
                  </div>
                  {open && a.body && <div style={{fontSize:".82rem",color:"var(--text2)",lineHeight:1.5,whiteSpace:"pre-wrap",marginTop:9,overflowWrap:"anywhere"}}>{a.body}</div>}
                  {open && a.image_url && <img src={a.image_url} alt="" style={{display:"block",width:"100%",height:"auto",maxHeight:340,objectFit:"contain",borderRadius:12,marginTop:8,background:"var(--bg)"}} />}
                </div>
              );
            })}

{(annHidden>0 || annShowAll) && (
              <button onClick={()=>setAnnShowAll(v=>!v)} style={{background:"none",border:"none",padding:"6px 4px 0",fontFamily:"var(--f)",fontSize:".76rem",fontWeight:800,color:"var(--violet-glow)",cursor:"pointer"}}>

          </div>
        </div>

        {manage && (
          <div className="wsec" style={{margin:"0 0 14px"}}>
            <div className="ws-t">Manage Children</div>
            {kids.length===0 && <div style={{fontSize:".8rem",color:"var(--text2)",fontWeight:600,marginBottom:10}}>No children yet. Add one to group cards.</div>}
            {kids.map(k=>(
              <div key={k.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                {renaming && renaming.id===k.id ? (
                  <>

            </div>
          </div>
        )}

        {rows.length===0
          ? <div className="empty">No cards linked yet. Tap "+ Link".</div>

            ? rows.map(renderRow)

                {kids.map(k=>{ const sec=rows.filter(r=>r.childId===k.id); return sec.length>0 ? renderSection(k.id, k.name, sec) : null; })}

        }
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Bulk student import — Stage 1: upload + column mapping. Parsing is 100%
// client-side (SheetJS); nothing is sent to Supabase until Stage 3.
// ---------------------------------------------------------------------------
function normalizeHeader(h) {
  return String(h == null ? "" : h)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // strip Greek/Latin accents (tonos etc.)
    .toUpperCase().trim();
}
const IMPORT_NAME_HINTS = ["ΟΝΟΜΑ/ΕΠΙΘΕΤΟ", "NAME SURNAME", "ΟΝΟΜΑΤΕΠΩΝΥΜΟ", "ΟΝΟΜΑ", "NAME", "STUDENT"];
const IMPORT_PHONE_HINTS = [["ΤΗΛ", "prefix"], ["ΚΙΝΗΤΟ", "contains"], ["PHONE", "contains"], ["MOBILE", "contains"]];
const IMPORT_FEE_HINTS = ["ΔΙΔΑΚΤΡΑ", "ΠΟΣΟ", "FEE", "PRICE", "AMOUNT"];
function suggestContainsColumn(headers, hints, exclude) {
  for (const hint of hints) {
    const nh = normalizeHeader(hint);
    for (let i = 0; i < headers.length; i++) {
      if (exclude.has(i)) continue;
      if (normalizeHeader(headers[i]).includes(nh)) return i;
    }
  }
  return null;
}
function suggestPhoneColumn(headers, exclude) {
  for (const [kw, mode] of IMPORT_PHONE_HINTS) {
    const nh = normalizeHeader(kw);
    for (let i = 0; i < headers.length; i++) {
      if (exclude.has(i)) continue;
      const H = normalizeHeader(headers[i]);
      if (mode === "prefix" ? H.startsWith(nh) : H.includes(nh)) return i;
    }
  }
  return null;
}

function normalizePhone(raw) {
  if (raw == null) return null;
  const s = String(raw).trim();
  if (!s) return null;
  // Keep digits and a leading '+' only; drop spaces, dashes, dots, parens, etc.
  const cleaned = s.replace(/[^\d+]/g, "");
  const hasPlus = cleaned.charAt(0) === "+";
  const digits = cleaned.replace(/\+/g, "");
  if (!digits) return null;

  let intl = null; // full international digits, no '+'
  if (hasPlus) {
    intl = digits;
  } else if (digits.slice(0, 2) === "00") {
    intl = digits.slice(2); // "00" international dialing prefix used instead of '+'
  } else if (digits.length === 8) {
    intl = "357" + digits; // Cyprus local (mobiles start 9, landlines 2, etc.)
  } else if (digits.length === 10 && (digits.charAt(0) === "6" || digits.charAt(0) === "2")) {
    intl = "30" + digits; // Greek local (mobiles start 6, landlines start 2)
  } else if (digits.length === 11 && digits.slice(0, 3) === "357") {
    intl = digits; // CY country code present but Excel dropped the leading 00 (numeric cell)
  } else if (digits.length === 12 && digits.slice(0, 2) === "30") {
    intl = digits; // same, for Greece
  }
  if (!intl || intl.length < 8 || intl.length > 15 || !/^\d+$/.test(intl)) return null;
  return "+" + intl;
}

// A phone number alone does NOT identify a duplicate: siblings routinely
// share a parent's phone, so two different students with the same number are
// normal, not an error. A duplicate is the same phone AND the same name —
// i.e. the same student's row entered twice.
function importDupeKey(phone, name) { return phone + "||" + normalizeHeader(name); }

// Turns raw parsed rows into validated import rows. Runs top-to-bottom so
// duplicate detection sees earlier rows (and pre-existing students) before
// later ones — order matters for which occurrence gets flagged.
function buildImportRows(rawRows, headers, nameCol, phoneCol, feeCol, overrides, existingKeys) {
  const nI = nameCol === "" ? null : parseInt(nameCol, 10);
  const pI = phoneCol === "" ? null : parseInt(phoneCol, 10);
  const fI = feeCol === "" ? null : parseInt(feeCol, 10);
  const seen = new Set(existingKeys);
  const out = [];
  const matchesHeader = (col, val) => col != null && normalizeHeader(val) !== "" && normalizeHeader(headers[col]) === normalizeHeader(val);

  rawRows.forEach((r, idx) => {
    const ov = overrides[idx] || {};
    const rawName = ov.name != null ? ov.name : (nI != null ? r[nI] : "");
    const rawPhone = ov.phone != null ? ov.phone : (pI != null ? r[pI] : "");
    const rawFee = ov.fee != null ? ov.fee : (fI != null ? r[fI] : "");
    const name = String(rawName == null ? "" : rawName).trim();
    const phoneRaw = String(rawPhone == null ? "" : rawPhone).trim();
    const phone = normalizePhone(rawPhone);
    const feeRaw = String(rawFee == null ? "" : rawFee).trim();
    const feeNum = feeRaw === "" ? null : parseFloat(feeRaw.replace(",", "."));
    const feeValid = feeRaw === "" || (feeNum != null && !isNaN(feeNum) && feeNum >= 0);

    if (!name && !phoneRaw) return; // fully empty row -> silently excluded
    if (matchesHeader(nI, rawName) && (pI == null || matchesHeader(pI, rawPhone))) return; // repeated header row -> excluded

    let status;
    if (!name) status = "missing_name";
    else if (!phone) status = "missing_phone";
    else if (seen.has(importDupeKey(phone, name))) status = "duplicate";
    else status = "ok";
    if (phone && (status === "ok" || status === "duplicate")) seen.add(importDupeKey(phone, name));

    out.push({ rowIdx: idx, name, phone, phoneRaw, fee: feeValid && feeNum != null ? feeNum : null, feeRaw, feeValid, status });
  });
  return out;
}
const IMPORT_STATUS_LABEL = {
  ok: "OK",
  missing_name: "Missing name / Λείπει το όνομα",
  missing_phone: "Missing or invalid phone / Λείπει ή μη έγκυρο τηλέφωνο",
  duplicate: "Duplicate / Διπλότυπο",
};
const IMPORT_STATUS_COLOR = { ok: "var(--green)", missing_name: "var(--red)", missing_phone: "var(--red)", duplicate: "var(--partial)" };

function PgImport({ biz, onBack, onImport }) {
  const [step, setStep] = useState("upload"); // 'upload' | 'mapping' | 'preview'
  const [fileName, setFileName] = useState("");
  const [headers, setHeaders] = useState([]);   // header row, as-is per column
  const [rows, setRows] = useState([]);         // data rows (array-of-arrays), header excluded
  const [nameCol, setNameCol] = useState("");
  const [phoneCol, setPhoneCol] = useState("");
  const [feeCol, setFeeCol] = useState("");
  const [groupId, setGroupId] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);

  // Preview-step state: per-row edits, per-row manual include/exclude, and
  // which single cell (if any) is currently being edited.
  const [overrides, setOverrides] = useState({});       // { [rowIdx]: {name?,phone?,fee?} }
  const [manualInclude, setManualInclude] = useState({}); // { [rowIdx]: boolean } — explicit user toggle
  const [editing, setEditing] = useState(null);          // { rowIdx, field } | null
  const [editDraft, setEditDraft] = useState("");
  const [importing, setImporting] = useState(false);
  const [importResult, setImportResult] = useState(null); // {ok:true,count} | {ok:false,error} | null
  const [importedCount, setImportedCount] = useState(0);

  function reset() {
    setStep("upload"); setFileName(""); setHeaders([]); setRows([]);
    setNameCol(""); setPhoneCol(""); setFeeCol(""); setGroupId("");
    setError(""); setOverrides({}); setManualInclude({}); setEditing(null);
    setImporting(false); setImportResult(null); setImportedCount(0);
  }

  function handleFile(file) {
    if (!file) return;
    setError(""); setBusy(true);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const wsName = wb.SheetNames[0];
        if (!wsName) throw new Error("empty-workbook");
        const ws = wb.Sheets[wsName];
        const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
        // Drop fully-blank rows (trailing blank lines Excel/Sheets often append).
        const nonBlank = raw.filter(r => (r || []).some(c => String(c == null ? "" : c).trim() !== ""));
        if (!nonBlank.length) throw new Error("no-rows");
        const hdr = nonBlank[0].map(c => (c == null ? "" : c));
        const body = nonBlank.slice(1);
        if (!body.length) throw new Error("no-data-rows");
        const exclude = new Set();
        const sName = suggestContainsColumn(hdr, IMPORT_NAME_HINTS, exclude); if (sName != null) exclude.add(sName);
        const sPhone = suggestPhoneColumn(hdr, exclude); if (sPhone != null) exclude.add(sPhone);
        const sFee = suggestContainsColumn(hdr, IMPORT_FEE_HINTS, exclude);
        setHeaders(hdr); setRows(body); setFileName(file.name);
        setNameCol(sName != null ? String(sName) : "");
        setPhoneCol(sPhone != null ? String(sPhone) : "");
        setFeeCol(sFee != null ? String(sFee) : "");
        setOverrides({}); setManualInclude({}); setImportResult(null);
        setStep("mapping");
      } catch (err) {
        const msg = (err && err.message) || "";
        if (msg === "no-data-rows") setError("This file only has a header row — no student data found below it. / Το αρχείο έχει μόνο επικεφαλίδα — δεν βρέθηκαν δεδομένα μαθητών.");
        else if (msg === "no-rows" || msg === "empty-workbook") setError("This file looks empty. / Το αρχείο φαίνεται άδειο.");
        else setError("Couldn't read this file. Please upload an Excel (.xlsx) or CSV (.csv) file. / Δεν ήταν δυνατή η ανάγνωση του αρχείου. Ανεβάστε αρχείο Excel (.xlsx) ή CSV (.csv).");
      } finally {
        setBusy(false);
      }
    };
    reader.onerror = () => { setBusy(false); setError("Couldn't read this file. / Δεν ήταν δυνατή η ανάγνωση του αρχείου."); };
    reader.readAsArrayBuffer(file);
  }

  const colLabel = (h, i) => (h != null && String(h).trim()) ? String(h).trim() : ("Column " + (i + 1));
  const canContinue = nameCol !== "" && phoneCol !== "" && !busy;

  // Existing students' phones (normalized the same way) so duplicate
  // detection compares apples to apples regardless of how they were typed.
  const existingKeys = React.useMemo(() => {
    const set = new Set();
    Object.values(biz.cards || {}).forEach(c => { const n = normalizePhone(c.phone); if (n) set.add(importDupeKey(n, c.name || "")); });
    return set;
  }, [biz.cards]);

  const processedRows = React.useMemo(() => {
    if (step !== "preview") return [];
    return buildImportRows(rows, headers, nameCol, phoneCol, feeCol, overrides, existingKeys);
  }, [step, rows, headers, nameCol, phoneCol, feeCol, overrides, existingKeys]);

  function isIncluded(row) {
    return Object.prototype.hasOwnProperty.call(manualInclude, row.rowIdx) ? manualInclude[row.rowIdx] : row.status === "ok";
  }
  function toggleInclude(row) {
    setManualInclude(m => ({ ...m, [row.rowIdx]: !isIncluded(row) }));
  }
  function startEdit(rowIdx, field, currentValue) {
    setEditing({ rowIdx, field }); setEditDraft(currentValue == null ? "" : String(currentValue));
  }
  function commitEdit() {
    if (!editing) return;
    const { rowIdx, field } = editing;
    setOverrides(o => ({ ...o, [rowIdx]: { ...(o[rowIdx] || {}), [field]: editDraft } }));
    setManualInclude(m => { if (!(rowIdx in m)) return m; const n = { ...m }; delete n[rowIdx]; return n; }); // re-derive default after an edit
    setEditing(null);
  }
  function cancelEdit() { setEditing(null); }

  async function doImport() {
    const toImport = processedRows.filter(isIncluded);
    if (!toImport.length || importing) return;
    setImporting(true); setImportResult(null);
    const nowYm = nowYM();
    const usedCodes = new Set();
    const payload = toImport.map(row => {
      let code; do { code = genShareCode(); } while (usedCodes.has(code)); usedCodes.add(code);
      return {
        business_id: biz.id,
        name: row.name,
        level: null,
        share_code: code,
        pin: genPin(),
        phone: row.phone,
        preferred_channel: "whatsapp",
        language: "EN",
        enrollment_start_month: nowYm,
        group_id: groupId || null,
        lesson_schedule: [],
        fee_history: row.fee != null ? [{ from: 0, fee: row.fee }] : [],
        payments: {},
        history: [],
      };
    });
    const result = await onImport(payload);
    setImporting(false); setImportResult(result);
    if (result && result.ok) { setImportedCount(result.count); setStep("done"); }
  }

  const willImport = processedRows.filter(isIncluded).length;
  const skippedDup = processedRows.filter(r => r.status === "duplicate" && !isIncluded(r)).length;
  const invalidCount = processedRows.filter(r => (r.status === "missing_name" || r.status === "missing_phone") && !isIncluded(r)).length;

  const cellStyle = { cursor: "pointer", borderBottom: "1px dashed var(--border)", paddingBottom: 1 };
  const editInpStyle = { padding: "6px 8px", fontSize: ".85rem", fontWeight: 700, width: "100%" };

  return (
    <div className="page">
      <div className="topbar">
        <button className="tb-back" onClick={step === "preview" ? () => setStep("mapping") : onBack}>←</button>
        <h2>Import Students</h2>
        <div style={{ width: 24 }} />
      </div>
      <div className="section">
        {(step === "upload" || step === "mapping") && (
          <div style={{ fontSize: ".72rem", color: "var(--text2)", fontWeight: 600, marginBottom: 16, lineHeight: 1.5 }}>
            Upload an Excel or CSV file to add many students at once. / Ανεβάστε αρχείο Excel ή CSV για να προσθέσετε πολλούς μαθητές μαζί.
          </div>
        )}

        {step === "upload" && (
          <div className="wsec" style={{ margin: 0 }}>
            <div className="ws-t">Upload File / Ανέβασμα Αρχείου</div>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }}
              onChange={e => handleFile(e.target.files && e.target.files[0])} />
            <button className="btn" onClick={() => fileRef.current && fileRef.current.click()} disabled={busy}>
              {busy ? "Reading…" : "Choose File / Επιλογή Αρχείου"}
            </button>
            <div style={{ fontSize: ".72rem", color: "var(--text3)", fontWeight: 600, marginTop: 12, lineHeight: 1.5 }}>
              Accepted: .xlsx, .csv — the first row should be column headers. / Δεκτά: .xlsx, .csv — η πρώτη γραμμή πρέπει να είναι επικεφαλίδες στηλών.
            </div>
            {error && <div className="err">{error}</div>}
          </div>
        )}

        {step === "mapping" && (
          <>
            <div className="wsec" style={{ margin: "0 0 16px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                <div style={{ fontSize: ".85rem", fontWeight: 800, color: "var(--text)" }}>📄 {fileName}</div>
                <button onClick={reset} style={{ background: "none", border: "none", color: "var(--violet-glow)", fontFamily: "var(--f)", fontSize: ".72rem", fontWeight: 700, cursor: "pointer" }}>Change file / Αλλαγή</button>
              </div>
              <div style={{ fontSize: ".78rem", color: "var(--text2)", fontWeight: 600 }}>
                {headers.length + " columns · " + rows.length + " rows found / " + headers.length + " στήλες · " + rows.length + " γραμμές"}
              </div>
            </div>

            <div className="wsec" style={{ margin: "0 0 16px" }}>
              <div className="ws-t">Column Mapping / Αντιστοίχιση Στηλών</div>

              <div className="ig" style={{ marginBottom: 16 }}>
                <label>Name column (required) / Στήλη Ονόματος (υποχρεωτικό)</label>
                <select className="ws-inp" value={nameCol} onChange={e => setNameCol(e.target.value)}>
                  <option value="">— Select column — / — Επιλέξτε στήλη —</option>
                  {headers.map((h, i) => <option key={i} value={i}>{colLabel(h, i)}</option>)}
                </select>
              </div>

              <div className="ig" style={{ marginBottom: 16 }}>
                <label>Phone column (required) / Στήλη Τηλεφώνου (υποχρεωτικό)</label>
                <select className="ws-inp" value={phoneCol} onChange={e => setPhoneCol(e.target.value)}>
                  <option value="">— Select column — / — Επιλέξτε στήλη —</option>
                  {headers.map((h, i) => <option key={i} value={i}>{colLabel(h, i)}</option>)}
                </select>
              </div>

              <div className="ig" style={{ marginBottom: 0 }}>
                <label>Monthly Fee column (optional) / Στήλη Διδάκτρων (προαιρετικό)</label>
                <select className="ws-inp" value={feeCol} onChange={e => setFeeCol(e.target.value)}>
                  <option value="">None — use school default fee / Καμία — προεπιλεγμένα δίδακτρα</option>
                  {headers.map((h, i) => <option key={i} value={i}>{colLabel(h, i)}</option>)}
                </select>
              </div>
            </div>

            <div className="wsec" style={{ margin: "0 0 16px" }}>
              <div className="ws-t">Assign to Group / Ανάθεση σε Ομάδα</div>
              <select className="ws-inp" value={groupId} onChange={e => setGroupId(e.target.value)}>
                <option value="">No group / Χωρίς ομάδα</option>
                {(biz.groups || []).map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
              </select>
              {(biz.groups || []).length === 0 && (
                <div style={{ fontSize: ".72rem", color: "var(--text3)", fontWeight: 600, marginTop: 8 }}>No groups yet — create them in Settings → 🗂️ Manage. / Δεν υπάρχουν ακόμη ομάδες.</div>
              )}
            </div>

            <button className="btn" disabled={!canContinue} onClick={() => setStep("preview")}>Continue / Συνέχεια</button>
          </>
        )}

        {step === "preview" && (
          <>
            <div className="wsec" style={{ margin: "0 0 14px" }}>
              <div style={{ fontSize: ".78rem", color: "var(--text2)", fontWeight: 700, lineHeight: 1.6 }}>
                <span style={{ color: "var(--green)" }}>{willImport + " will be imported"}</span>
                {" · "}<span style={{ color: "var(--partial)" }}>{skippedDup + " skipped (duplicates)"}</span>
                {" · "}<span style={{ color: "var(--red)" }}>{invalidCount + " invalid"}</span>
                <div style={{ color: "var(--text3)", fontWeight: 600, marginTop: 2 }}>
                  {willImport + " θα εισαχθούν · " + skippedDup + " παραλείπονται (διπλότυπα) · " + invalidCount + " μη έγκυρα"}
                </div>
              </div>
            </div>
            <div style={{ fontSize: ".68rem", color: "var(--text3)", fontWeight: 600, marginBottom: 10, lineHeight: 1.5 }}>
              Tap Name, Phone or Fee to fix a row. / Πατήστε Όνομα, Τηλέφωνο ή Δίδακτρα για διόρθωση.
            </div>

            {processedRows.map(row => {
              const included = isIncluded(row);
              const edName = editing && editing.rowIdx === row.rowIdx && editing.field === "name";
              const edPhone = editing && editing.rowIdx === row.rowIdx && editing.field === "phone";
              const edFee = editing && editing.rowIdx === row.rowIdx && editing.field === "fee";
              return (
                <div key={row.rowIdx} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "12px 14px", background: "var(--bg2)", border: "1px solid var(--border)", borderRadius: 14, marginBottom: 8, opacity: included ? 1 : .55 }}>
                  <input type="checkbox" checked={included} onChange={() => toggleInclude(row)} style={{ marginTop: 4, width: 18, height: 18, flexShrink: 0 }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ marginBottom: 4 }}>
                      {edName ? (
                        <input autoFocus className="ws-inp" style={editInpStyle} value={editDraft} onChange={e => setEditDraft(e.target.value)}
                          onBlur={commitEdit} onKeyDown={e => { if (e.key === "Enter") commitEdit(); if (e.key === "Escape") cancelEdit(); }} />
                      ) : (
                        <span onClick={() => startEdit(row.rowIdx, "name", row.name)} style={{ ...cellStyle, fontWeight: 800, fontSize: ".92rem", color: row.name ? "var(--text)" : "var(--text3)" }}>
                          {row.name || "(no name) / (χωρίς όνομα)"}
                        </span>
                      )}
                    </div>
                    <div style={{ marginBottom: 4 }}>
                      {edPhone ? (
                        <input autoFocus className="ws-inp" style={editInpStyle} value={editDraft} onChange={e => setEditDraft(e.target.value)}
                          onBlur={commitEdit} onKeyDown={e => { if (e.key === "Enter") commitEdit(); if (e.key === "Escape") cancelEdit(); }} />
                      ) : (
                        <span onClick={() => startEdit(row.rowIdx, "phone", row.phoneRaw)} style={{ ...cellStyle, fontSize: ".82rem", fontWeight: 700, color: row.phone ? "var(--text2)" : "var(--red)" }}>
                          {row.phone || (row.phoneRaw ? (row.phoneRaw + " ⚠") : "(no phone) / (χωρίς τηλέφωνο)")}
                        </span>
                      )}
                    </div>
                    <div>
                      {edFee ? (
                        <input autoFocus className="ws-inp" style={editInpStyle} value={editDraft} onChange={e => setEditDraft(e.target.value)}
                          onBlur={commitEdit} onKeyDown={e => { if (e.key === "Enter") commitEdit(); if (e.key === "Escape") cancelEdit(); }} />
                      ) : (
                        <span onClick={() => startEdit(row.rowIdx, "fee", row.feeRaw)} style={{ ...cellStyle, fontSize: ".78rem", fontWeight: 700, color: "var(--text2)" }}>
                          {row.fee != null ? ("€" + row.fee) : (row.feeRaw && !row.feeValid ? (row.feeRaw + " ⚠ (using default)") : ("Default (€" + biz.fee + ")"))}
                        </span>
                      )}
                    </div>
                  </div>
                  <div style={{ flexShrink: 0, textAlign: "right" }}>
                    <span style={{ fontSize: ".62rem", fontWeight: 800, color: IMPORT_STATUS_COLOR[row.status], textTransform: "uppercase", letterSpacing: ".06em" }}>{row.status === "ok" ? "OK" : IMPORT_STATUS_LABEL[row.status].split(" / ")[0]}</span>
                  </div>
                </div>
              );
            })}

            {processedRows.length === 0 && (
              <div className="empty">No usable rows found in this file. / Δεν βρέθηκαν χρησιμοποιήσιμες γραμμές.</div>
            )}

            <button className="btn" style={{ marginTop: 8 }} disabled={willImport === 0 || importing} onClick={doImport}>
              {importing ? "Importing… / Εισαγωγή…" : ("Import " + willImport + " Students / Εισαγωγή " + willImport + " Μαθητών")}
            </button>
            {importResult && !importResult.ok && (
              <div className="err" style={{ marginTop: 12 }}>
                Import failed — nothing was imported, your file is unchanged. / Η εισαγωγή απέτυχε — δεν έγινε καμία αλλαγή.
                <div style={{ marginTop: 4, fontWeight: 600 }}>{importResult.error}</div>
              </div>
            )}
          </>
        )}

        {step === "done" && (
          <div className="wsec" style={{ margin: 0, textAlign: "center" }}>
            <div style={{ fontSize: "2.2rem", marginBottom: 8 }}>✅</div>
            <div style={{ fontSize: "1.1rem", fontWeight: 900, marginBottom: 6 }}>{importedCount + " Students Imported"}</div>
            <div style={{ fontSize: ".78rem", color: "var(--text2)", fontWeight: 600, lineHeight: 1.6, marginBottom: 20 }}>
              {importedCount + " μαθητές εισήχθησαν επιτυχώς. Each student got a share code and PIN, visible on their card. / Κάθε μαθητής απέκτησε κωδικό και PIN, ορατά στην κάρτα του."}
            </div>
            <button className="btn" onClick={onBack}>Done / Τέλος</button>
            <button className="btn-ghost" onClick={reset}>Import More / Εισαγωγή Περισσότερων</button>
          </div>
        )}
      </div>
    </div>
  );
}
function PgManage({ biz, onBack, onSaveTeacher, onDeleteTeacher, onSaveGroup, onDeleteGroup }) {
  const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const ABBR = {Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thu",Friday:"Fri",Saturday:"Sat",Sunday:"Sun"};
  const teachers = biz.teachers || [];
  const groups = biz.groups || [];
  const cards = Object.values(biz.cards || {});
  const [tName, setTName] = useState("");
  const [tEdit, setTEdit] = useState(null);   // {id,name} inline teacher edit
  const [gEdit, setGEdit] = useState(null);   // {id?, name, schedule, teacher_id} group form
  const [del, setDel] = useState(null);       // {kind, id, name, warn}
  const [busy, setBusy] = useState(false);
  const teacherName = (id)=>{ const t=teachers.find(x=>x.id===id); return t?t.name:null; };
  const schedSummary = (sch)=> (sch&&sch.length) ? sch.map(s=>(ABBR[s.day]||s.day)+" "+(s.start_time||"")+(s.end_time?("–"+s.end_time):"")).join(", ") : "No schedule set";

  async function addTeacher(){ if(!tName.trim()) return; setBusy(true); const ok=await onSaveTeacher({name:tName}); setBusy(false); if(ok) setTName(""); }
  async function saveTeacherEdit(){ setBusy(true); const ok=await onSaveTeacher(tEdit); setBusy(false); if(ok) setTEdit(null); }
  async function saveGroup(){ setBusy(true); const ok=await onSaveGroup(gEdit); setBusy(false); if(ok) setGEdit(null); }
  async function confirmDelete(){ setBusy(true); const ok = del.kind==="teacher" ? await onDeleteTeacher(del.id) : await onDeleteGroup(del.id); setBusy(false); if(ok) setDel(null); }

  function askDeleteTeacher(t){ const n=groups.filter(g=>g.teacher_id===t.id).length; setDel({kind:"teacher",id:t.id,name:t.name,warn:n>0?("Assigned to "+n+" group"+(n>1?"s":"")+" — they will show no teacher."):null}); }
  function askDeleteGroup(g){ const n=cards.filter(c=>c.groupId===g.id).length; setDel({kind:"group",id:g.id,name:g.name,warn:n>0?(n+" student"+(n>1?"s":"")+" will become unassigned."):null}); }

  const setSch = (fn)=> setGEdit(g=>({ ...g, schedule: fn(g.schedule||[]) }));
  const lbl = {fontSize:".68rem",fontWeight:800,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".1em",margin:"14px 0 6px"};
  const secTitle = {fontSize:".72rem",fontWeight:800,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".16em",marginBottom:12};
  // Compact, content-sized row actions. These deliberately do NOT use .btn-ghost
  // / .btn-add: those are full-width form buttons (.btn-ghost is width:100%),
  // which is what previously stretched Edit across the row and crushed the name
  // and schedule text beside it at every viewport width.
  const rowActions = {display:"flex",gap:8,marginTop:12,flexWrap:"wrap"};
  const rowBtn = {flex:"0 0 auto",width:"auto",padding:"9px 16px",borderRadius:10,border:"1px solid var(--border)",background:"var(--bg3)",color:"var(--text)",fontFamily:"var(--f)",fontWeight:700,fontSize:".8rem",cursor:"pointer",margin:0};
  const rowBtnDanger = {...rowBtn,background:"transparent",color:"var(--red)",fontWeight:800};
  const rowBtnPrimary = {...rowBtn,background:"var(--violet)",color:"#fff",border:"none",fontWeight:800};

  // ---- Group create/edit form ----
  if (gEdit) {
    return (
      <div className="page">
        <div className="topbar">
          <button className="tb-back" onClick={()=>setGEdit(null)}>←</button>
          <h2>{gEdit.id ? "Edit Group" : "New Group"}</h2>
          <div style={{width:24}} />
        </div>
        <div className="section">
          <div style={lbl}>Group name</div>
          <input className="inp" placeholder="e.g. Τρ/Παρ 15:15" value={gEdit.name} onChange={e=>setGEdit(g=>({...g,name:e.target.value}))} autoFocus />
          <div style={lbl}>Teacher</div>
          <select className="inp" value={gEdit.teacher_id||""} onChange={e=>setGEdit(g=>({...g,teacher_id:e.target.value}))}>
            <option value="">— No teacher —</option>
            {teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
          {teachers.length===0 && <div style={{fontSize:".72rem",color:"var(--text3)",fontWeight:600,marginTop:6}}>Add a teacher below first to assign one.</div>}
          <div style={lbl}>Schedule</div>
          {(gEdit.schedule||[]).map((row,i)=>(
            <div key={i} style={{marginBottom:10,padding:"10px",background:"var(--bg2)",borderRadius:12,border:"1px solid var(--border)"}}>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <select className="inp" style={{flex:1,marginBottom:0}} value={row.day} onChange={e=>setSch(s=>s.map((r,j)=>j===i?{...r,day:e.target.value}:r))}>{DAYS.map(d=><option key={d} value={d}>{d}</option>)}</select>
                <button type="button" onClick={()=>setSch(s=>s.filter((_,j)=>j!==i))} aria-label="Remove" style={{background:"transparent",border:"1px solid var(--border)",borderRadius:10,minWidth:44,height:48,color:"var(--red)",fontWeight:900,fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>×</button>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center",marginTop:6}}>
                <input className="inp" style={{flex:1,marginBottom:0}} type="time" value={row.start_time||""} onChange={e=>setSch(s=>s.map((r,j)=>j===i?{...r,start_time:e.target.value}:r))} />
                <span style={{color:"var(--text2)",fontWeight:700}}>–</span>
                <input className="inp" style={{flex:1,marginBottom:0}} type="time" value={row.end_time||""} onChange={e=>setSch(s=>s.map((r,j)=>j===i?{...r,end_time:e.target.value}:r))} />
              </div>
            </div>
          ))}
          {(gEdit.schedule||[]).length<7 && <button type="button" onClick={()=>setSch(s=>[...s,{day:"Monday",start_time:"17:00",end_time:"18:00"}])} className="btn-ghost" style={{padding:"12px",width:"100%"}}>+ Add day</button>}
          <button className="btn" style={{marginTop:16}} onClick={saveGroup} disabled={busy}>{busy?"…":(gEdit.id?"Save Group":"Create Group")}</button>
        </div>
      </div>
    );
  }

  // ---- Lists ----
  return (
    <div className="page">
      <div className="topbar">
        <button className="tb-back" onClick={onBack}>←</button>
        <h2>Manage</h2>
        <div style={{width:24}} />
      </div>

      <div className="section">
        <div style={secTitle}>Teachers</div>
        {teachers.length===0 && <div style={{fontSize:".82rem",color:"var(--text3)",fontWeight:600,marginBottom:10}}>No teachers yet.</div>}
        {teachers.map(t=>(
          <div key={t.id} style={{padding:"12px 14px",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,marginBottom:8}}>
            {tEdit && tEdit.id===t.id ? (
              <>
                <input className="inp" style={{width:"100%",marginBottom:0}} value={tEdit.name} onChange={e=>setTEdit({...tEdit,name:e.target.value})} autoFocus />
                <div style={rowActions}>
                  <button style={rowBtnPrimary} onClick={saveTeacherEdit} disabled={busy}>Save</button>
                  <button style={rowBtn} onClick={()=>setTEdit(null)}>Cancel</button>
                </div>
              </>
            ) : (
              <>
                <div style={{fontWeight:700,fontSize:".95rem",overflowWrap:"anywhere"}}>{t.name}</div>
                <div style={rowActions}>
                <button style={rowBtn} onClick={()=>setTEdit({id:t.id,name:t.name})}>Edit</button>
                <button style={rowBtnDanger} onClick={()=>askDeleteTeacher(t)}>Delete</button>
                </div>
              </>
            )}
          </div>
        ))}
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <input className="inp" style={{flex:1,marginBottom:0}} placeholder="New teacher name" value={tName} onChange={e=>setTName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTeacher()} />

function PgGroups({ biz, onBack }) {
  const [sel, setSel] = useState(null);
  const DAYS = [["Monday","Mon"],["Tuesday","Tue"],["Wednesday","Wed"],["Thursday","Thu"],["Friday","Fri"],["Saturday","Sat"],["Sunday","Sun"]];
  const ABBR = {Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thu",Friday:"Fri",Saturday:"Sat",Sunday:"Sun"};
  const COLORS = ["#6366f1","#10b981","#f59e0b","#ec4899","#06b6d4","#a855f7","#ef4444","#84cc16","#f97316","#0ea5e9","#14b8a6","#eab308"];
  const HOUR_PX = 60, HDR = 24, DEFAULT_DUR = 60;
  const toMin = (t)=>{ if(t==null||t==="") return null; const p=String(t).split(":"); const h=parseInt(p[0],10), m=parseInt(p[1]||"0",10); return isNaN(h)?null:h*60+(isNaN(m)?0:m); };
  // Canonicalize a day value to a full English name. The grid columns are keyed
  // by "Monday".."Sunday", but stored schedules may use abbreviations ("Mon"),
  // different casing, or stray whitespace — any of which would otherwise miss
  // the column lookup and drop the block silently.
  const DAYNAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const normDay = (d)=>{ if(d==null) return null; const k=String(d).trim().toLowerCase(); if(!k) return null; return DAYNAMES.find(n=>{const ln=n.toLowerCase(); return ln===k || ln.slice(0,3)===k.slice(0,3);}) || null; };
  // Normalize one schedule slot to {day, sm, em} in minutes. Reads the current
  // start_time/end_time shape AND the legacy single-time field; if no end is
  // recorded, assume a default duration so the block still has height. day is
  // canonicalized so the column lookup matches regardless of stored spelling.
  const slotMin = (s)=>{
    const sm = toMin((s.start_time!=null && s.start_time!=="") ? s.start_time : s.time);
    if(sm==null) return null;
    let em = toMin(s.end_time);
    if(em==null||em<=sm) em = sm + DEFAULT_DUR;
    return { day:normDay(s.day), sm, em };
  };

  // Render one session per REAL group (from the groups table) — its schedule is
  // the single source of truth, so a group is one clean block per scheduled slot
  // (no more scattered per-student blocks).
  const groups = biz.groups || [];
  const allCards = Object.values(biz.cards || {});
  const teacherName = (id)=>{ const t=(biz.teachers||[]).find(x=>x.id===id); return t ? t.name : null; };
  // Students belong to a group by group_id; legacy students (no group_id) match
  // by their old free-text group_name so they still appear until reassigned.
  const studentsOf = (g)=> allCards.filter(c=> c.groupId ? c.groupId===g.id : ((c.groupName||"").trim()===(g.name||"").trim())).map(c=>c.name||"Unnamed");
  // Stable color per group id, assigned in alphabetical name order.
  const ordered = [...groups].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const colorOf = {}; ordered.forEach((g,i)=>{ colorOf[g.id] = COLORS[i%COLORS.length]; });
  const sessions = ordered.map(g=>({ key:g.id, name:g.name||"", schedule:g.schedule||[], teacherId:g.teacher_id||null, color:colorOf[g.id], students:studentsOf(g) }));

  // Visible window defaults to 16:00–21:00, but auto-fits (expands) to include
  // any session whose times fall outside that band — so no group is ever
  // silently clipped out of the grid.
  let lo = 16*60, hi = 21*60;
  sessions.forEach(g=>(g.schedule||[]).forEach(s=>{ const m=slotMin(s); if(m){ lo=Math.min(lo,m.sm); hi=Math.max(hi,m.em); } }));
  const START_H = Math.floor(lo/60), END_H = Math.ceil(hi/60);
  const HOURS = END_H - START_H, GRID_H = HOURS*HOUR_PX, RANGE = HOURS*60;

  const byDay = {}; DAYS.forEach(([d])=>byDay[d]=[]);
  const rendered = new Set();
  sessions.forEach(g=>{
    (g.schedule||[]).forEach(s=>{
      const m=slotMin(s);
      if(!m||!byDay[m.day]) return;
      let top=((m.sm-START_H*60)/RANGE)*GRID_H;
      let bot=((m.em-START_H*60)/RANGE)*GRID_H;
      if(bot<=0||top>=GRID_H) return;

  // Calendar-style overlap layout: within each day, blocks that overlap in time
  // are split into side-by-side lanes instead of stacking on top of each other.
  // Each block gets _lane (its column index) and _lanes (columns in its overlap
  // cluster); a block with no overlaps keeps the full column width (_lanes=1).

  // group can never be silently invisible again.

  // Legacy students still on a free-text group_name that has no matching real
  // group — surfaced so they can be reassigned in Manage (not lost silently).
  const realNames = new Set(groups.map(g=>(g.name||"").trim()));
  const legacyGroups = [...new Set(allCards.filter(c=>!c.groupId && (c.groupName||"").trim() && !realNames.has((c.groupName||"").trim())).map(c=>(c.groupName||"").trim()))];

  return (
    <div className="page">
      <div className="topbar">
        <button className="tb-back" onClick={onBack}>←</button>
        <h2>Groups</h2>
        <div style={{width:24}} />
      </div>
      {sessions.length===0 ? (
        <div className="empty">No groups yet. Create groups in Settings → 🗂️ Manage.</div>
      ) : (
        <div className="section">
          <div style={{fontSize:".72rem",color:"var(--text2)",fontWeight:600,marginBottom:12,lineHeight:1.5}}>Weekly schedule, {String(START_H).padStart(2,"0")+":00"}–{String(END_H).padStart(2,"0")+":00"}. Tap a block for details.</div>
          <div style={{display:"flex"}}>
            <div style={{width:34,flexShrink:0,position:"relative",height:HDR+GRID_H}}>
              {Array.from({length:HOURS+1}).map((_,i)=>(
                <div key={i} style={{position:"absolute",top:HDR+i*HOUR_PX-6,right:4,fontSize:".55rem",color:"var(--text3)",fontWeight:700}}>{String(START_H+i).padStart(2,"0")+":00"}</div>
              ))}
            </div>
            <div style={{flex:1,display:"flex"}}>
              {DAYS.map(([d,short])=>(
                <div key={d} style={{flex:1,minWidth:0,borderLeft:"1px solid var(--border)"}}>
                  <div style={{height:HDR,display:"flex",alignItems:"center",justifyContent:"center",fontSize:".58rem",fontWeight:800,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".04em"}}>{short}</div>
                  <div style={{position:"relative",height:GRID_H,background:"var(--bg2)"}}>
                    {Array.from({length:HOURS+1}).map((_,i)=>(
                      <div key={i} style={{position:"absolute",left:0,right:0,top:i*HOUR_PX,height:1,background:"rgba(255,255,255,.05)"}} />
                    ))}
                    {byDay[d].map((b,bi)=>{
                      const on = b.key===sel;
                      const lanes = b._lanes||1, lane = b._lane||0, wPct = 100/lanes;
                      return (
                        <div key={bi} onClick={()=>setSel(x=>x===b.key?null:b.key)}
                          style={{position:"absolute",left:"calc("+(lane*wPct)+"% + 1px)",width:"calc("+wPct+"% - 2px)",top:b.top,height:b.h,background:b.color,borderRadius:5,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",textAlign:"center",padding:"1px 2px",overflow:"hidden",zIndex:on?5:1,transform:on?"scale(1.06)":"none",boxShadow:on?("0 0 0 2px #fff, 0 0 12px "+b.color):"none",transition:"transform .15s ease-out, box-shadow .15s ease-out"}}>
                          <span style={{fontSize:"8px",lineHeight:"9px",fontWeight:800,color:"#fff",wordBreak:"break-word",whiteSpace:"normal"}}>{b.name}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{maxHeight:selG?640:0,opacity:selG?1:0,overflow:"hidden",transition:"max-height .3s ease-out, opacity .3s ease-out"}}>
            {selG && (
              <div style={{marginTop:14,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:16,padding:"16px 18px"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <span style={{width:12,height:12,borderRadius:4,background:selG.color,flexShrink:0}} />
                  <div style={{fontSize:"1.05rem",fontWeight:900}}>{selG.name}</div>
                </div>
                <div style={{fontSize:".78rem",color:"var(--text2)",fontWeight:700,marginBottom:4}}>{teacherName(selG.teacherId) ? ("👤 "+teacherName(selG.teacherId)) : "No teacher"}</div>

                <div style={{fontSize:".62rem",fontWeight:800,color:"var(--text3)",textTransform:"uppercase",letterSpacing:".12em",marginBottom:8}}>Students ({selG.students.length})</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>

  );
}
function App() {

  const [dashViewBy, setDashViewBy] = useState("all");

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{ setSession(data.session); }).catch(()=>{}).finally(()=>{ setAuthReady(true); });
    const { data: sub } = sb.auth.onAuthStateChange((_e,s)=>{ setSession(s); setAuthReady(true); });
    return ()=>{ sub.subscription.unsubscribe(); };
  },[]);

  async function loadInto() {
    let b = await loadMyBusiness();
    if (!b) {
      const rawp = localStorage.getItem("pending_biz");
      if (rawp) {
        try {
          const pv = JSON.parse(rawp);
          await sb.from("businesses").insert({ biz_code:genBizId(), name:pv.name, type:pv.type, fee:+pv.fee, year:new Date().getFullYear(), contact_email:pv.email, inactive_months:[], levels:[] });
          localStorage.removeItem("pending_biz");
          b = await loadMyBusiness();
        } catch(e){}
      }
    }
    if (b) { setDb({businesses:{[b.id]:b}}); setBizId(b.id); }
    return b;
  }

  useEffect(()=>{
    if (!session) { setDb({businesses:{}}); setBizId(null); setMyCards([]); setAnn([]); setMode("teacher"); setApproval(null); setBizLoaded(false); return; }
    setBizLoaded(false);
    (async()=>{
      try {
        const role = session.user && session.user.user_metadata && session.user.user_metadata.role;
        let b = null;
        if (role === "parent") {
          setApproval("approved"); // parents are not gated
        } else {
          // Admin approval gate. This effect only runs once a user is
          // authenticated (it early-returns above when !session), so the
          // status check NEVER runs before auth. It also fails OPEN: only an
          // explicit 'pending'/'rejected' shows the gate — any other result
          // (approved, no business yet, or an RPC error) loads the app, so a

            b = await loadInto();                 // approved / no-biz-yet / unknown → load

          }
        }

        try { setAnn(await loadMyAnnouncements()); } catch(e){ setAnn([]); }
        try { setAnnRead(await loadMyAnnReads()); } catch(e){ setAnnRead([]); }
        let m;

          ? (m==="parent" ? "parentDash" : "dashboard") : v);

  async function doSaveTeacher(t){ const name=(t.name||"").trim(); if(!name){ pop("Enter a teacher name","err"); return false; } let error; if(t.id){ ({error}=await sb.from("teachers").update({name}).eq("id",t.id)); } else { ({error}=await sb.from("teachers").insert({business_id:bizId,name})); } if(error){ pop(error.message,"err"); return false; } await refresh(); return true; }

  async function doDeleteGroup(id){ const { error }=await sb.from("groups").delete().eq("id",id); if(error){ pop(error.message,"err"); return false; } await refresh(); return true; }

  // GDPR right-to-erasure. Both RPCs are SECURITY DEFINER and also delete the
